# VICA D455 + nvblox override.
# nvblox_examples_bringup의 nvblox_base.yaml / nvblox_realsense.yaml 뒤에 얹어
# (뒤 파일이 우선) VICA 구성에 맞는 값만 덮어쓴다.
#
# 핵심: 기본 nvblox_realsense.yaml의 esdf_slice_min_height=-0.1은 카메라(~0.32 m)
# 장착과 odom(바닥 z≈0) 기준에서 바닥면을 slice 밴드에 포함시켜, static_map_slice가
# 관측된 바닥 전체를 obstacle로 투영한다. 그러면 nvblox_layer(binary)가 로봇 주변을
# LETHAL로 덮어 DWB가 유효 trajectory를 못 만든다. 바닥을 밴드에서 빼기 위해
# esdf_slice_min_height를 바닥 위(+)로 올린다.
#
# esdf_slice_min_height는 launch 인자로도 노출되어 있어(기본 0.05) 실측하며 빠르게
# 튜닝할 수 있다. 범위 대략 0.03~0.15. 바닥이 여전히 obstacle면 올리고, 낮은
# 장애물(의자 다리 등)이 안 보이면 내린다.
#
# esdf_slice_max_height는 0.5였고, 그 위는 어떤 센서도 보지 않는 사각지대였다.
#   로봇 최고점 0.863 m: base_link.stl 실측 z 상한 0.714(STL 로컬)에 collision
#                        origin -0.041과 base_footprint->base_link +0.190을 적용한 값
#   LiDAR      0.382 m : 단일 평면. 테이블 상판을 보지 못하고 다리만 본다
#   카메라     0.320 m
# 즉 0.50~0.86 m에 있는 테이블 상판(0.70~0.75)·선반·벽 돌출물은 아무도 보지 못해
# 로봇 상부가 그대로 들이받는다. LiDAR는 상판 아래 다리만 보고 "통과 가능"으로
# 판단하기 때문에 오히려 진입을 유도한다.
# 0.9는 로봇 최고점(0.863)에 3.7 cm 여유를 둔 값이다. 천장·문틀 상단보다 충분히
# 낮아 과검출 위험은 없다.
# test_slice_covers_robot_height가 이 값과 STL 실측의 정합을 감시한다.
#
# mapping_type: static_tsdf였을 때는 벽·가구·사람이 한 TSDF에 함께 쌓였다.
# 그래서 decay를 하나로만 조절할 수 있었고, 기본값 5 Hz는 카메라 시야를 벗어난
# 것을 초당 5회 지웠다. X자 책상다리를 코너 접근 중 정면으로 보고도, 돌면서
# 측면이 되자 기억이 사라져 costmap이 free가 되고 실제로 부딪혔다
# (2026-07-28. 충돌 시점 costmap의 가장 가까운 lethal이 0.919 m였다).
#
# decay를 0으로 두고 시험하니 같은 경로에서 서행이 2회 8.8 s -> 0회, 측면 여유
# 중앙값이 0.416 -> 0.543 m, 4구간 주행이 213 -> 185 s가 되었고 충돌도 없었다.
# 다만 0은 원인 규명용 극단값이다. VICA는 사람이 많은 공공장소에서 다니므로
# 지나간 사람이 영구히 유령으로 남으면 경로가 계속 막힌다.
#
# dynamic 모드는 정적/동적을 분리해 관리한다.
#   static mapper  : 벽·가구      -> decay_tsdf_rate_hz            (기억)
#   dynamic mapper : 사람          -> decay_dynamic_occupancy_rate_hz (망각)
#   combined_map_slice 로 둘을 합쳐 발행한다. nav2의 nvblox_layer는 이 토픽을
#   구독해야 한다(static_map_slice를 그대로 두면 동적 장애물이 빠진다).
/**:
  ros__parameters:
    # 2026-07-29 2차 시험: dynamic -> static_tsdf.
    #
    # 1차(r1_dyn25, dynamic + decay 2.5)는 복구 배선을 고친 뒤 처음으로 4구간을
    # 완주했다(268 s). 그러나 배선 수정 전 static 기록(scale015_full, 231 s)보다
    # 16 % 느리고 정지 시간이 1 s -> 32 s, 궤적 여유 중앙값이 0.885 -> 0.806 m로
    # 모두 나빴다. 다만 그 기록은 복구가 죽어 있던 때라 완전한 대조군이 아니다.
    # 그래서 배선을 고친 상태에서 mapping_type만 바꿔 다시 잰다.
    #
    # decay_tsdf_rate_hz는 2.5로 유지한다. 1차와의 차이를 mapping_type
    # 하나로 묶기 위해서다.
    # 2026-07-30 3차: static_tsdf -> dynamic. 이유가 2차와 다르다.
    #
    # 2차까지 nvblox는 local_costmap에만 있었고, 그때는 하나의 슬라이스로 충분했다.
    # 2026-07-30에 nvblox_layer를 global_costmap에도 넣었다(planner가 LiDAR 평면
    # 0.382 m 아래의 사선 책상다리와, 거울면 스테인리스라 LiDAR가 깜빡이는 청소기를
    # 보게 하려는 것이었고, 그 목적은 달성했다 — 계획 시점 LETHAL 0 -> 166개,
    # 완전 소실 18초 연속 -> 0, 완주 3/3 145.6 s).
    #
    # 그런데 static_tsdf에서는 벽·가구·사람이 한 TSDF에 함께 쌓인다. 그래서 사람이
    # global costmap에 유령으로 남았다. 실측(2026-07-30):
    #   일시 LETHAL 셀   7,693 -> 33,138개
    #   지속 중앙값        2.0 -> 9.0 s,  p95 9.0 -> 46.0 s,  최대 66 -> 87 s
    # TSDF 무게는 소거마다 x0.95이고 1e-3 밑에서 소멸하므로
    #   n = ln(1e-3)/ln(0.95) = 134.7 스텝,  2.5 Hz -> 53.9 s
    # 실측 p95 46 s와 맞는다. 그 유령이 통로를 막아
    # "Starting point in lethal space"가 22회 났다.
    #
    # 하나의 decay로 둘을 만족시킬 수 없다는 것이 요점이다.
    #   가구를 붙잡으려면 사람도 붙잡히고, 사람을 놓으려면 가구도 놓친다.
    # dynamic 모드는 두 mapper를 나눠 각자 decay를 갖는다
    # (nvblox_node.cpp 193~210: static_mapper / dynamic_mapper 이름공간이 따로 있고,
    #  921·927행에서 decayOccupancy와 decayTsdf가 따로 돈다).
    #   static  -> global costmap. 느리게. 가구를 기억한다.
    #   dynamic -> local costmap(combined). 빠르게. 사람을 잊는다.
    #
    # 알려진 위험: 2026-07-28에 dynamic + combined_map_slice로 local costmap이
    # 두 배로 찼다(lethal 10.7 -> 21.2 %, inscribed 26.4 -> 46.4 %, 방2에서 출발
    # 실패). 그때 decay_tsdf_rate_hz가 0.0이라 static이 본 것을 절대 지우지 않아,
    # 로봇이 각도를 바꿀 때마다 같은 물체의 다른 면이 계속 누적된 것이 원인이었다.
    # 0.5로도 부족했고(inscribed 38.4 %), 2.5에서는 4구간 완주했다(r1_dyn25, 268 s).
    # 이번은 2.5를 유지하면서 dynamic 쪽 소거를 기본값보다 더 빠르게 하므로
    # 그때보다 누적이 덜해야 한다. 주행 후 local_costmap의 lethal/inscribed 비율을
    # 위 수치와 대조해 확인한다. 되돌리려면 이 한 줄만 static_tsdf로 바꾸고
    # nav2_params.yaml의 local nvblox_map_slice_topic도 static_map_slice로 돌린다.
    # 2026-07-30 4차: dynamic -> static_tsdf로 되돌린다.
    #
    # 3차에서 슬라이스 분리(global=static / local=combined)를 시험한 이유는 사람이
    # static TSDF에 쌓여 global costmap에 유령으로 남는 것이었다. 그런데 실측이
    # 개선을 보이지 않았다:
    #   일시 LETHAL 셀 지속 p95   47.0 s (static_tsdf) -> 43.0 s (분리)
    #   일시 셀 수                26,270 -> 26,059
    # 즉 유령의 원인은 mapping_type이 아니었다. 원인은
    # exclude_last_view_from_decay(아래)였고 그것만 남긴다.
    #
    # 그리고 분리 구성으로 완주한 회차가 없다(1/3). 유일하게 3/3 완주한 조합은
    # static_tsdf + 두 costmap 모두 static_map_slice + scale 0.15 + decay 2.5였다
    # (2026-07-30, 145.6 s). 그 조합으로 되돌리고 exclude_last_view만 얹는다.
    #
    # 주의: 되돌리면 combined_map_slice가 발행되지 않으므로 nav2_params.yaml의
    # local nvblox_map_slice_topic도 static_map_slice여야 한다. 짝이 어긋나면
    # nvblox_layer가 아무것도 받지 못한 채 조용히 무해해진다.
    #
    # ===== 2026-08-15: human 모드 시험 =====
    # static_tsdf -> human_with_static_tsdf. 사람만 골라 전경(빨리 잊는 쪽)으로
    # 보낸다. dynamic 모드와 다르다 -- dynamic은 nvblox가 스스로 판정하다 사람이
    # 배경에도 섞여 3회 실패했고, human은 밖에서 준 마스크로만 가른다
    # (multi_mapper.cpp:244의 CHECK가 둘을 섞지 못하게 막는다).
    #
    # 마스크 공급자는 PeopleSemSegNet shuffleseg(TensorRT fp16)다. 실측:
    #   0.45~0.60 m  검출 92 %  (다리만 보이는 거리인데도 잡는다)
    #   1.70~2.40 m  검출 100 %
    #   0.30~0.45 m  검출 19 %  <- 한계. 무릎 아래만 들어와 판정 근거가 사라진다
    #   끊김은 최대 0.6초. 사람 없을 때 오검출 597장 중 0건.
    #
    # 한계를 알고 시작한다. 0.45 m 미만의 사람은 마스크에 안 잡혀 정적 지도로
    # 들어간다. 이 시험의 목적은 "완전 해결"이 아니라 "얼마나 줄어드는가"다.
    #
    # [되돌리기] mapping_type을 static_tsdf로, use_segmentation을 false로 돌리고
    # nav2_params.yaml의 local nvblox_map_slice_topic도 static_map_slice로
    # 함께 되돌린다. 셋은 한 세트다.
    mapping_type: human_with_static_tsdf
    # 마스크 구독을 켠다. **켜면 깊이 단독 경로가 닫힌다**
    # (nvblox_node.cpp:258의 if/else). 마스크가 안 오면 깊이도 통합되지 않아
    # nvblox가 조용히 아무것도 안 하는 상태가 된다. 세그멘테이션이 죽으면
    # 장애물 인식이 통째로 멈춘다는 뜻이라 감시가 필요하다.
    use_segmentation: true
    # 마스크 잡티 제거를 끈다. **사람이 static으로 새는 최대 경로였다.**
    #
    # 기본값은 true + 임계 2000이다. 마스크에서 2000픽셀보다 작은 연결덩어리를
    # 잡음으로 보고 지운다. 지워진 픽셀은 배경이 되어 static TSDF로 들어간다.
    #
    # 2026-08-16 run17 마스크 3625장 실측. 사람이 잡힌 1077장을 덩어리 단위로
    # 셌다(cv2 connectedComponents, 8-이웃).
    #
    #   임계    살아남는 픽셀   사람이 100% static으로 가는 프레임
    #   2000        94.6 %       596장 (55.3 %)   <- 기본값
    #   1000        97.8 %       323장 (30.0 %)
    #    500        98.7 %       249장 (23.1 %)
    #    250        99.3 %       180장 (16.7 %)
    #      0       100.0 %         0장
    #
    # 픽셀 비율로 보면 2000도 94.6 %라 멀쩡해 보이지만, **프레임으로 보면
    # 절반 이상이 통째로 죽는다.** 사람이 크게 잡힌 몇 장이 픽셀 수를 다
    # 채우기 때문이다. static은 한 장만 오염돼도 30초를 가므로 프레임 수가
    # 판단 기준이다.
    #
    # 같은 실측에서 프레임당 덩어리가 평균 3.1개였다. 사람 하나가 팔·다리·
    # 몸통으로 갈려서 각 조각이 작아지고, 그래서 임계에 더 잘 걸린다.
    # 측면에서 화면에 막 들어오는 사람이 가장 심하게 버려진다.
    #
    # [끄면 어떻게 되나] multi_mapper.cpp:252 의 else 가지로 가서 마스크가
    # 손대지 않고 그대로 splitImageOnGPU에 들어간다. GPU 연산이 한 단계 줄어
    # 자원도 조금 아낀다.
    #
    # [대가] 잡음 덩어리가 사람으로 오인되면 그 자리의 지형이 static에서
    # 빠진다. 위험이 제한적인 이유는 두 가지다.
    #   1. nav2는 라이다 voxel_layer도 함께 본다. 벽·가구는 라이다가 잡는다.
    #   2. 한 프레임짜리 잡음은 다음 프레임에 다시 static으로 채워진다.
    # 다만 라이다가 못 보는 낮은 장애물이 반복해서 오인되면 그것만은
    # 가려질 수 있다. 실주행에서 낮은 장애물 인식을 함께 확인한다.
    #
    # [되돌리기] true로 되돌리면 기본 임계 2000이 다시 걸린다. 중간을 원하면
    # true로 두고 connected_mask_component_size_threshold를 500으로 둔다.
    multi_mapper.remove_small_connected_components: false
    # 정적 지도는 아주 천천히만 감쇠시킨다.
    #
    # 0.0(감쇠 없음)으로 두었더니 combined_map_slice에서 costmap이 두 배로
    # 찼다(2026-07-28). static_tsdf 모드일 때는 lethal 10.7 / inscribed 26.4 %
    # 였는데 dynamic 모드에서 21.2 / 46.4 %가 되어 local_costmap의 46 %가
    # 통과 불가가 됐고, 방2에서 출발조차 못 했다.
    # 원인은 static과 dynamic이 같은 물체를 각자 잡아 합쳐지는데, static이
    # 한 번 본 것을 절대 지우지 않아 로봇이 각도를 바꿀 때마다 같은 물체의
    # 다른 면이 계속 누적되기 때문이다.
    # 0.5로도 부족했다(inscribed 38.4 %, 1구간에서 갇힘). 감쇠는 확률적이라
    # 자주 재관측되는 것은 살아남고 각도 차이로 생긴 중복만 지워지는 균형점이
    # 있을 수 있어 2.5를 시험한다. nvblox 기본값 5.0은 X자 책상다리를 잊어
    # 충돌했던 값이므로 그보다는 낮아야 한다.
    #
    # 주의: 이 값을 바꿔도 이미 쌓인 맵은 줄지 않는다. exclude_last_view_from_decay가
    # True라 정지한 채 같은 곳을 보고 있으면 감쇠가 걸리지 않는다. nvblox에는
    # 맵 초기화 서비스가 없으므로(save_map/load_map만 있다) 재시작해야 한다.
    # 2026-07-30: 2.5 -> 5.0 (nvblox 기본값).
    #
    # 실질 소멸 시점은 tsdf_decayed_weight_threshold(0.001)가 아니라
    # esdf_integrator_min_weight(0.1)다. ESDF가 weight 0.1 미만 복셀을 아예 보지
    # 않는다(esdf_integrator.cu:115  return tsdf_voxel.weight >= min_weight).
    #   5.0 x 0.95^n <= 0.1  ->  n = ln(0.02)/ln(0.95) = 76 tick
    #   2.5 Hz -> 30.6 s      5.0 Hz -> 15.2 s
    #
    # 필요 기억은 계산된다. 시야 밖으로 나간 낮은 장애물을 로봇이 지나칠 때까지만
    # 기억하면 된다:
    #   90도 회전  1.571 rad / max_vel_theta 0.4  = 3.93 s
    #   차체 통과  차체 0.87 m / max_vel_x 0.26   = 3.35 s
    #   최악 조합                                 ~ 7.3 s
    # 15.2 s는 2.1배 여유다. 30.6 s는 4배로 과하다.
    #
    # 위험: 이 값 5.0이 2026-07-28 X자 책상다리 충돌의 원인으로 기록돼 있다.
    # 다만 산수가 그 귀인을 지지하지 않는다 - 5.0 Hz의 소멸 시간은 15~33 s인데
    # 코너 회전은 7 s다. 경쟁 설명은 해상도다(브레이스 두께 2~4 cm vs voxel 5 cm로
    # 애초에 TSDF에 약하게만 들어가 weight가 낮았을 가능성). 이 주행이 그것을
    # 가른다 - 충돌이 재현되면 decay 속도가 맞고, 재현되지 않으면 해상도 문제이며
    # 그때는 voxel_size 0.05 -> 0.03이 대책이다.
    # 2026-07-30 4차: 5.0 -> 2.5로 되돌린다.
    # 5.0은 2026-07-28 X자 책상다리 충돌로 기록된 값이다. 산수가 그 귀인을 지지하지
    # 않지만(15 s 소멸 vs 7 s 회전) 검증 전에 안고 갈 위험이 아니다.
    # exclude_last_view_from_decay: false만으로 시야 안 유령이 영구 -> 30.6 s가 된다
    #   (5.0 x 0.95^n <= esdf_integrator_min_weight 0.1 -> n = 76 tick / 2.5 Hz).
    # 그것으로 부족하다는 실측이 나온 뒤에 다시 올린다.
    #
    # ── 2026-08-24: 그 실측이 나왔다. 2.5 -> 10.0 ──────────────────────────
    # bag 실측(drive_0824_run01, 앞 0.4~2.5 m 부채꼴): 사람 잔상 **정점→소멸
    # 최대 15.8 초**(중앙 2.7, 10건). 사용자 관찰은 "짧으면 6초, 오래 서 있으면
    # 30초"로 위 30.6 s 계산과 정확히 맞는다. 코앞 사람은 세그멘테이션이 놓쳐
    # static 으로 새기 때문에(2026-08-15 확정) dynamic 쪽 decay 가 안 듣는다.
    #
    # **10.0 을 시도했다가 같은 날 철회했다. 2.5 를 유지한다.**
    # 근거는 test_ghost_clears_within_the_maneuver_budget 의 하한이다 —
    # 소멸이 기동 예산(5.7 s)의 2배(11.4 s)보다 짧으면 안 된다. 실측 두 건이
    # 그 하한을 만들었다: **15.2 s 에서 X자 책상다리 충돌(07-28), 9.6 s 로
    # 내렸다가 같은 종류 재현(08-13)**. 10.0 Hz 는 7.6 s 로 그보다도 아래다.
    #
    # "벽은 라이다가 지키니 nvblox 는 잊어도 된다"는 논리는 **반증된다.**
    # 벽은 그렇지만 **낮은 의자다리는 라이다 평면(0.382 m) 아래라 nvblox 만
    # 잡는다.** 빨리 지우면 그것을 잃고 부딪힌다. 지형이 함께 사라지면
    # planner 가 흔들려 복구를 새로 부르므로 정체 시간도 안 준다.
    #
    # 또 하나: test_static_memory_outlives_dynamic_memory 가 static(2.5) <
    # dynamic(5.0) 을 감시한다. static 을 10 으로 올리면 벽·가구를 사람보다
    # 빨리 잊는 역전이 된다.
    #
    # **decay 축은 좁다.** 계약이 허용하는 가장 빠른 값(11.4 s)조차 실패한 9.6 s 와
    # 1.8 s 차이고, 15.2 s 에서도 충돌이 났다. 근본 해결은 사람이 static 으로 새는
    # 것 자체를 막는 것인데(세그멘테이션·카메라 각도), 카메라 각도는 2026-08-24 에
    # 27도까지 기울여 보니 **로봇 자기 앞부분이 화면에 걸려** 되돌렸다. 그 축이
    # 막혀 남은 것이 이 값의 소폭 조정뿐이다.
    #
    # ── 2026-08-24 시험: 2.5 -> 6.5 (30.6 s -> 11.7 s) ────────────────────
    # **사용자 결정.** 잔상이 주행을 실제로 막는 피해가 더 크다는 판단이다
    # (bag 실측 잔상 최대 15.8 s, 관찰로는 30초까지). 위험은 아래에 적은 대로
    # 알린 뒤 진행했다.
    #
    # 76 tick / 6.5 Hz = 11.7 s. **계약이 허용하는 가장 빠른 값**이다 -
    # test_ghost_clears_within_the_maneuver_budget 의 하한이 기동예산 5.7 x 2 =
    # 11.4 s 이므로 6.67 Hz 가 상한이고 6.5 가 그 바로 아래다.
    #
    # ** 감수하는 위험 ** : 07-28 에 소멸 15.2 s 에서 X자 책상다리 충돌, 08-13 에
    # 9.6 s 로 내렸다가 같은 종류 재현. 11.7 s 는 그 사이다. 낮은 의자다리는
    # 라이다 평면(0.382 m) 아래라 nvblox 만 잡으므로, 빨리 지우면 못 본다.
    #
    # ** 깨지는 계약 1건 (사용자 승인) **
    # test_static_memory_outlives_dynamic_memory 가 static < dynamic 을 감시하는데
    # static 6.5 > dynamic 5.0 이라 역전된다. "벽은 기억, 사람은 망각"이라는 전제
    # 때문인데, **지금 겪는 문제가 바로 사람이 벽으로 기록되는 것**이라 그 전제가
    # 이 상황과 맞지 않는다고 보고 감수한다.
    # dynamic 을 올려 역전을 푸는 길은 **막혀 있다** - 아래 285행 주석대로 관측(카메라
    # 15 Hz)보다 감쇠가 빠르면 전경 블록이 해제되어 dynamic_map_slice 가 0칸이 된다.
    # 10.0 으로 올렸다가 되돌린 이력이 있고 3:1 을 지켜야 한다. 둘은 한 세트다.
    # 계약을 다 지키는 최대값은 4.5(16.9 s)였으나 개선 폭이 부족하다고 판단했다.
    #
    # ── 2026-08-24 마지막 회차: 2.5 -> 6.5 (30.6 s -> 11.7 s) ─────────────
    # **사용자 결정.** 잔상이 주행을 실제로 막는 피해가 더 크다는 판단이다.
    # 이 회차를 끝으로 nvblox 튜닝을 접고 YOLO 작업으로 넘어간다.
    #
    # 76 tick / 6.5 Hz = 11.7 s. test_ghost_clears_within_the_maneuver_budget 의
    # 하한(기동예산 5.7 x 2 = 11.4 s) 바로 위다.
    #
    # ** 감수하는 위험 ** : 07-28 소멸 15.2 s 에서 X자 책상다리 충돌, 08-13 에
    # 9.6 s 로 내렸다가 재현. 11.7 s 는 그 사이다. 낮은 의자다리는 라이다 평면
    # (0.382 m) 아래라 nvblox 만 잡으므로 빨리 지우면 못 본다.
    #
    # ** 깨지는 계약 1건 ** : test_static_memory_outlives_dynamic_memory 가
    # static < dynamic 을 감시하는데 6.5 > 5.0 으로 역전된다. dynamic 을 올려
    # 푸는 길은 막혀 있다 - 관측(카메라 15 Hz)보다 감쇠가 빠르면 전경 블록이
    # 해제되어 dynamic_map_slice 가 0칸이 된다(10.0 에서 되돌린 이력, 3:1 유지).
    # 계약을 다 지키는 최대는 4.5(16.9 s)지만 개선 폭이 부족하다고 판단했다.
    #
    # 관문 — ① 잔상이 15.8 s(drive_0824_run01)보다 확실히 짧을 것
    #        ② 로봇 0.3 m 안 INSCRIBED 0칸 유지
    #        ③ **의자다리류에 부딪히거나 그 앞에서 멈추면 즉시 2.5 로 원복**
    #        ④ 벽이 옅어져 주행이 불안해지는지도 볼 것(역전의 대가)
    # 되돌리기: 2.5 (계약을 다 지키려면 4.5)
    decay_tsdf_rate_hz: 6.5
    # 동적 점유는 빠르게 잊는다. 사람이 지나간 자리를 감쇠시키는 값이다.
    #
    # 2026-08-15: 10.0 -> 5.0. **카메라 주기와 한 세트로 움직인다.**
    #
    # 전경 지도는 관측으로 쌓이고 감쇠로 줄어든다. 그 균형이 깨지면 블록이
    # 통째로 해제되어(decay_integrator.deallocate_decayed_blocks: 1)
    # dynamic_map_slice 가 "빈 지도"가 아니라 **0칸**이 된다.
    #
    #   카메라 30 Hz · 감쇠 10 Hz  ->  3:1    쌓인다   (종전)
    #   카메라 15 Hz · 감쇠 10 Hz  ->  1.5:1  못 버틴다 (실측 0칸)
    #   카메라 15 Hz · 감쇠  5 Hz  ->  3:1    쌓인다   <- 지금
    #
    # 그날 CPU 경합(코어 평균 81 %, load 14)을 풀려고 run_d455.sh 를 30 -> 15 Hz
    # 로 내렸는데, 감쇠를 그대로 두어 전경 지도가 사라졌다. 사람이 마스크에
    # 잡히는데도(전경 13.98 %) dynamic 이 0칸이라 static 으로 들어갔고,
    # "오래 서 있을수록 오래 멈춘다"가 그 결과였다.
    #
    # 5.0 으로 맞춘 뒤 실측: 사람이 서 있는 동안 dynamic 가까운칸 192~312 로
    # 안정 유지. 소멸 시간은 0.11 -> 약 0.2초로 늘지만 여전히 즉시에 가깝다.
    #
    # [주의] run_d455.sh 의 프로파일을 바꾸면 이 값도 함께 본다. 비율 3:1 이
    # 기준이다. 30 Hz 로 되돌리면 10.0 으로 되돌린다.
    # 2026-08-16: 30 Hz 시험을 마치고 카메라를 15 Hz 로 되돌리면서 감쇠도
    # 10.0 -> 5.0 으로 함께 되돌린다. 관측보다 감쇠가 빠르면 전경 블록이
    # 해제되어 dynamic_map_slice 가 0칸이 된다(deallocate_decayed_blocks: 1).
    # 카메라 15 Hz · 감쇠 5 Hz 로 3:1 을 유지한다. **둘은 한 세트다.**
    decay_dynamic_occupancy_rate_hz: 5.0
    static_mapper:
      esdf_slice_min_height: 0.05
      esdf_slice_max_height: 0.9
      esdf_slice_height: 0.10
      # 관측 무게의 상한. 기본 5.0 -> 2.0 (2026-08-16).
      #
      # 소멸 시각은 이 식으로 정해진다.
      #   관측무게 x tsdf_decay_factor^n <= esdf_integrator_min_weight
      #   5.0 x 0.95^n <= 0.1  ->  n = 76 tick  ->  76 / 2.5 Hz = 30.6 초
      #   2.0 x 0.95^n <= 0.1  ->  n = 58 tick  ->              = 23.4 초
      #   1.0 x 0.95^n <= 0.1  ->  n = 45 tick  ->              = 18.0 초
      #
      # **다른 감쇠 손잡이와 성격이 다르다.** decay_factor·decay_rate·
      # min_weight 는 무게와 무관하게 모든 복셀을 똑같이 빨리 지운다. 이 값은
      # '무거워질 수 있는 상한'이라 **무거운 것만 골라** 짧아진다.
      #
      # 무게는 관측마다 쌓이고 그 양이 거리 제곱에 반비례한다
      # (projective_integrator_weighting_mode:
      #  "inverse_square_tsdf_distance_penalty"). 그래서
      #   코앞에 오래 서 있던 사람  -> 무게가 상한까지 찬다  -> 상한을 낮추면 짧아진다
      #   멀리서 스친 의자다리      -> 무게가 0.3 정도       -> 상한 2.0 이어도 그대로
      #
      # 이 축을 여는 근거(2026-08-16 run24 실측). 컨트롤러가 보는 지도에서
      # 로봇 앞 부채꼴(0.3~1.5 m, 좌우 ±0.7 m)의 통과불가 칸을 셌다:
      #
      #   +33.5 ~ +55.1 초   218 ~ 296칸,  그동안 라이다 최근접 2.8 m
      #   +55.7 초              0칸
      #
      # **22초 동안 앞이 막혀 있었는데 라이다는 2.8 m 까지 비었다고 했다.**
      # 전부 nvblox 잔상이다. 그리고 저절로 사라진 게 아니라 복구 동작의
      # ClearEntireCostmap 이 지웠다. 그 사이 DWB 는 좌우로 흔들리기만 해서
      # 25초·26초 정체 두 건이 났다(Failed to make progress).
      # 사용자도 RViz 에서 직접 확인했다.
      #
      # [대가] 로봇이 다가가며 계속 본 실물도 상한까지 찬다. 그것이 옆으로
      # 빠져 시야에서 사라지면 그만큼 빨리 지워진다. 2026-07-28 X자 책상다리
      # 충돌 당시 조건이 약 15초였으므로 23.4초는 8초 여유가 있다.
      # **낮은 장애물 인식을 실주행에서 함께 확인한다.**
      #
      # [2026-08-16 2단계] 2.0 -> 1.0.  23.4 초 -> 18.0 초.
      #
      # 2.0 으로 두 회차(run25·run26)를 돌린 결과 **우려한 대가가 안 나타났다.**
      #   지워지는 속도   빨라졌다 (사용자 관찰)
      #   의자다리 등 낮은 장애물을 스칠 뻔한 일  **0회** (사용자 확인)
      # run25 에서는 앞쪽 통과불가 칸이 286 -> 87 -> 63 -> 0 으로 내려갔고,
      # 마지막 0 은 복구의 ClearEntireCostmap 이 아니라 **감쇠가 지웠다**
      # (지우기 요청은 +170.1 인데 0 이 된 것은 +176.3). 로봇이 선 시점부터
      # 약 23초로 예측값 23.4 초와 맞았다.
      #
      # 남은 증상은 "완전 가깝게 스치면 오래 걸린다"다. 코앞은 마스크 검출률이
      # 0 % 라 사람으로 안 갈리는 데다 무게가 상한까지 꽉 차서 가장 나쁜 경우다.
      #
      # [2026-08-16 3단계 — 1.0 은 실패. 2.0 으로 확정 복귀한다]
      #
      # 1.0(18.0 초)에서 접촉이 두 번 났다.
      #   1회차  주행 중 부딪힘.  다만 그때 nvblox 가 두 개 떠 있어 판정 보류
      #   2회차  중복을 모두 정리한 깨끗한 조건에서 **코너를 돌다 스쳤다**
      # 두 번째는 변수가 하나뿐이라 1.0 이 원인으로 확정된다.
      #
      #   5.0(기본) 30.6 초   원래 값
      #   2.0       23.4 초   run25·run26 두 회차, 스칠 뻔한 일 0회   <- 확정값
      #   1.0       18.0 초   접촉 2회                                <- 실패
      #   0.5       12.6 초   2026-07-28 충돌 조건(약 15초) 아래
      #
      # **이 축의 하한은 2.0 이다. 1.0 이하를 다시 제안하지 않는다.**
      # 남은 "코앞에 스치면 오래 걸린다"는 이 값으로 못 고친다. 코앞은 마스크
      # 검출률이 0 % 라 사람으로 갈리지 않는 것이 원인이고, 카메라 장착 높이·
      # 각도를 바꾸는 하드웨어 축이다.
      #
      # [2026-08-16 최종 — 기본값 5.0 으로 되돌린다. 이 축은 열어만 둔다]
      #
      # 2.0 은 접촉 0회였지만 사용자 관찰이 **"안정성이 떨어지는 느낌,
      # 장애물에 좀 더 붙는 느낌"** 이었다. 기전이 맞다 - 지도에서 빨리
      # 사라지면 costmap 이 더 비어 보이고 로봇이 더 붙어서 돈다. 즉 값이
      # 일을 하고 있고 그 양이 과했다.
      #
      # 되돌리는 이유 셋:
      #   1. 얻는 게 7.2초뿐이고, 정작 고치려던 "코앞 사람"은 그대로다.
      #      코앞은 마스크 검출률 0 % 라 무게가 상한까지 차서 23초를 꽉 채운다
      #   2. 진짜 해결책이 정해졌다 - 카메라를 약 16 cm 올리면 코앞 사람이
      #      검출되어 dynamic 행이 되고 1초에 사라진다. 이 값이 필요 없어진다
      #   3. 하드웨어를 바꾸기 전에 기준선이 깨끗해야 한다. 둘을 같이 바꾸면
      #      좋아진 게 어느 쪽 덕인지 못 가린다
      #
      # 남겨 두는 사실(다시 필요해지면 근거가 이미 있다):
      #   소멸 = ln(esdf_integrator_min_weight / max_weight) / ln(tsdf_decay_factor)
      #          / decay_tsdf_rate_hz
      #   5.0 -> 30.6초   2.0 -> 23.4초   1.0 -> 18.0초   0.5 -> 12.6초
      #   2.0  run25·run26·run27 세 회차 접촉 0회. 다만 여유가 줄었다
      #   1.0  접촉 2회. **닫힘.**
      #   이 손잡이는 다른 감쇠값과 달리 '무거운 것만' 골라 줄인다. 멀리서
      #   스친 낮은 장애물은 무게가 0.3 정도라 상한에 닿지도 않는다.
      # projective_integrator_max_weight: 2.0   <- 되살리려면 이 줄을 켠다
      # [닫힘] 이 축은 2026-08-13 에 양쪽으로 시험했고 둘 다 실패했다. 0.95
      # (소멸 30.6 s)를 유지한다. 다시 내리자고 제안하지 않는다.
      #
      #   0.85 ( 9.6 s)  사용자 판정: "낮은 의자다리를 못 봐서 멈춘다.
      #                  복구 시간도 크게 차이가 없고 오히려 주행이 불안정하다"
      #   0.925(20.1 s)  같은 의자다리에서 같은 증상. 사람이 비켜난 뒤에도
      #                  대기를 거의 다 채웠다
      #
      # 실측이 단조롭지도 않았다(No valid trajectories: 30.6 s 210회 /
      # 9.6 s 61회 / 20.1 s 382회). 회차마다 사람이 막은 시점·위치가 달라
      # decay 의 효과가 그 차이에 묻혔다. 즉 이 노브로는 원하는 것을 얻지
      # 못한다는 것까지가 오늘 확인된 사실이다.
      #
      # 왜 그런가 — 소멸을 앞당기면 사람만 빨리 지워지는 것이 아니다. 로봇이
      # 딛고 설 지형 정보도 같이 사라진다. 낮은 장애물(의자다리·책상다리)은
      # 라이다 높이 아래라 nvblox 만 잡으므로 그대로 잃는다. 그 자리를 다시 볼
      # 때까지 planner 가 흔들리고, 그 흔들림이 복구를 새로 부른다. 벌어들인
      # 시간을 다른 곳에서 도로 잃는다.
      #
      # 사람이 사라진 뒤의 대기를 줄이려면 "무엇이 막았는지 구분"해야 한다
      # (YOLO, 4단계). 사람만 골라 지우면 지형은 그대로 두고 대기만 줄일 수
      # 있다. 시간으로 뭉뚱그려 지우는 방식의 한계가 여기까지다.
      #
      # 종전 주석은 "정적 소거는 느리게가 목적"이라며 0.95를 유지했다. 그 판단을
      # 뒤집는 실측이 나왔다(run4_wait2x20_0810, 129~157 s 구간):
      #
      #   130.7 s  라이다 전방 최소거리 0.81 -> 1.21 m   사람이 비켜났다
      #   132.0 s  전방 2.01 m                          완전히 트였다
      #   157.0 s  전방 2.01 m, 명령 vx 0.000           26 초째 서 있다
      #
      # 라이다는 즉시 지웠는데 지도가 사람을 붙잡고 있었다. 그동안 planner 는
      # "no valid path found"를 냈다. BT 대기를 5 -> 2 s 로 줄여 열 배 자주 다시
      # 봐도 소용이 없었다 - 볼 때마다 지도에 사람이 그대로 있었기 때문이다.
      #
      # [감시] 이 값은 사람만 빨리 잊지 않는다. 라이다 높이 아래의 낮은 장애물
      # (책상다리·청소기)은 nvblox 만 잡으므로 같이 빨라진다. 2026-07-30 에
      # "책상다리·청소기를 다시 놓침" 이력이 있다. 정면은 접근하면 카메라가 다시
      # 보지만 시야각 87도 밖(측면 통과)은 복구되지 않는다. 회귀하면 0.90(15 s)
      # 으로 올린다.
      tsdf_decay_factor: 0.95
      # false면 완전 소거된 복셀이 '미관측'으로 남아 ESDF가 모른다고 한다.
      # true면 명시적 free(아래 거리)로 보고한다. 실제로 치워진 가구가 확실히
      # 사라지게 하려면 true여야 한다.
      tsdf_set_free_distance_on_decayed: true
      tsdf_decayed_free_distance_vox: 4.0
      # 2026-07-30: nvblox_base.yaml의 true를 false로 덮어쓴다. 유령이 영구히
      # 남는 직접 원인이다.
      #
      # true면 '마지막 깊이 영상에 보이는 블록'을 decay에서 제외한다
      # (mapper.cpp 368~375, ViewBasedInclusionData). 의도는 지금 보고 있는 것을
      # 지우지 않는 것이지만, '보는 범위'와 '갱신되는 범위'가 다르다:
      #   보는 범위     = 카메라 수직 FOV 58°
      #   갱신되는 범위 = 관측 표면 앞뒤 0.20 m
      #                  (projective_integrator_truncation_distance_vox 4.0 x 0.05)
      # 사람이 떠나고 뒤쪽 벽이 2 m에 보이면 갱신은 2 m 근처에서만 일어나고,
      # 0.47 m에 있던 유령 복셀은 truncation 밖이라 손대지 않는다. 그런데 시야
      # 안이므로 decay에서도 빠진다. 두 지우기 경로가 동시에 막혀 영구히 남는다.
      # 막혀서 멈춘 로봇이 계속 그것을 쳐다보므로 상태가 원인을 유지한다
      # (devlog/2026-07-30-nvblox-ghost-obstacle.md 4.3).
      #
      # false로 두어도 시야 안 실제 장애물은 안전하다. integration이 매 관측마다
      # weight를 다시 올리고(카메라 30 Hz >> decay 2.5 Hz), 보호를 잃는 것은
      # '시야 안인데 재관측되지 않는 것' 즉 유령뿐이다.
      # 시야 밖 거동은 전혀 바뀌지 않는다 - 2026-07-28 X자 책상다리 충돌은 다리가
      # 측면이 되어 시야에서 빠진 경우라 그때도 이미 decay가 걸리고 있었다.
      #
      # 실질 소멸 시점은 tsdf_decayed_weight_threshold(0.001)가 아니라
      # esdf_integrator_min_weight(0.1)다. ESDF가 weight 0.1 미만 복셀을 아예
      # 보지 않는다(esdf_integrator.cu:115  return tsdf_voxel.weight >= min_weight).
      #   5.0 x 0.95^n <= 0.1  ->  n = 76 tick  ->  76 / 2.5 Hz = 30.6 초
      # 즉 영구 -> 30초가 된다. 2026-07-30 실측 유령 지속 p95 46 s와 부합한다.
      # 더 줄이려면 tsdf_decay_factor를 낮춘다(0.90 -> 15 s, 0.84 -> 9 s). 단 그건
      # 시야 밖 실물도 같이 빨라지므로 책상다리 회귀 감시가 필요해 분리한다.
      exclude_last_view_from_decay: false
    dynamic_mapper:
      esdf_slice_min_height: 0.05
      esdf_slice_max_height: 0.9
      esdf_slice_height: 0.10
      # 동적 점유는 확률(log-odds) 감쇠다. 사람은 몇 초 안에 지워져야 한다.
      # occupied는 [0.0, 0.5]에서 낮을수록, free는 [0.5, 1.0]에서 높을수록 빠르다.
      # 기본값 0.4 / 0.55보다 각각 빠르게 잡는다.
      occupied_region_decay_probability: 0.30
      free_region_decay_probability: 0.60
      # static_mapper와 같은 이유로 false. 멈춰 선 사람을 계속 쳐다보면 occupancy
      # decay도 제외되어 local costmap에서 지워지지 않는다. 기전이 동일하다.
      exclude_last_view_from_decay: false
      # false면 소거된 복셀이 unknown이 된다. 그런데 DWB의
      # ObstacleFootprintCritic::pointCost는 0xff(NO_INFORMATION)에서도 예외를
      # 던지므로(cmp w1, #0xff), 사람이 지나간 자리가 미지로 남으면 그 위를
      # 지나는 궤적이 전부 무효가 된다. 253 밴드 문제와 같은 함정이다.
      # true로 두어 명시적 free가 되게 한다.
      occupancy_decay_to_free: true
