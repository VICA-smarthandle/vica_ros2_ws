####################################################

# ============================================================
# VICA nav2_params.yaml — 직진 안정화 수정본
#
# 목적:
#   teleop 수동 주행은 안정적인데 Nav2 주행에서 직진 중 좌우로 비틀거리는 현상 완화
#
# 핵심 수정:
#   - 최대 속도 계열은 변경하지 않음
#     max_vel_x, max_vel_theta, max_speed_xy,
#     acc_lim_x, decel_lim_x, velocity_smoother 속도 한계값 유지
#
#   - RotateToGoal 제거
#     도착 지점 근처에서 강한 제자리 회전을 유발할 수 있으므로 일단 제거
#
#   - BaseObstacle 유지
#     장애물 회피 노드를 따로 만들지 않았더라도 Nav2의 local_costmap + DWB는
#     /scan 기반 장애물 비용을 보고 속도 후보를 평가해야 하므로 유지
#
#   - PathAlign / GoalAlign을 과하게 올리지 않고 중간값 적용
#     16.0처럼 강하게 올리면 odom/AMCL 흔들림에 과민하게 반응할 수 있으므로
#     PathAlign=10.0, GoalAlign=8.0부터 테스트
#
#   - vtheta_samples 감소
#     20 → 10, 회전 후보 과탐색 완화
#
#   - sim_time 소폭 증가
#     1.7 → 2.0, 너무 순간적인 후보보다 조금 더 앞을 보게 함
#
#   - yaw_goal_tolerance 완화
#     0.20 → 0.35 rad, 도착 후 제자리 회전 완화
#
# [추가 수정] /plan 전역 경로가 너무 크게 선회하는 문제 완화
#   - global_costmap inflation_radius : 0.65 → 0.45
#   - global_costmap cost_scaling_factor : 3.0 → 4.0
#   - planner tolerance : 0.5 → 0.2
#   - use_astar : false → true
#   - allow_unknown : true → false
#   ※ local_costmap은 실제 장애물 회피 안전 여유와 관련되므로 0.65 유지
# ============================================================

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "/scan"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true
    transform_tolerance: 1.0
    min_particles: 500
    max_particles: 2000
    max_beams: 60
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.05
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5

