amcl:
  ros__parameters:
    use_sim_time: false
    # --- 운동 모델 잡음 (DifferentialMotionModel) ---
    #   alpha1  회전 -> 회전 오차      alpha2  병진 -> 회전 오차
    #   alpha3  병진 -> 병진 오차      alpha4  회전 -> 병진 오차
    #
    # [닫힘] alpha1 0.4 는 2026-08-13 실기에서 실패했다. 되돌렸고 다시 올리지
    # 않는다.
    #
    # 올렸던 근거는 이랬다 — 이 로봇은 제자리 회전 직후 오차가 컸고, alpha1 을
    # 올리면 회전 시 입자 분산이 커져 스캔 매칭이 자세를 되돌릴 여지가 생긴다
    # (devlog/2026-07-31.md:29-50, t+86 의 AMCL 점프 -10.8도).
    #
    # 실제로는 주행 능력이 눈에 띄게 나빠졌다. 사용자 판정: "주춤거림·머뭇거림이
    # 눈에 띄게 늘었다." 입자를 넓게 퍼뜨리면 자세 추정이 그만큼 덜 확신하게 되고,
    # 그 흔들림이 controller 로 그대로 내려간다. 위치 오차를 줄이려던 값이
    # 주행 품질을 깎은 것이다. 판정 기준은 로봇이 통과하는가가 아니라 사람이
    # 따라올 수 있는가다.
    #
    # 회전 직후 오차라는 문제 자체는 남아 있다. 다만 그 해법이 운동 모델 잡음이
    # 아니라는 것이 이 회차의 결론이다.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # NAV2-B1 2단계. 60 -> 180. AMCL 이 한 번 갱신할 때 쓰는 라이다 빔 수다.
    # 60 은 유효 반사의 일부만 보는 것이라 좁은 곳에서 지형 특징을 놓친다.
    #
    # 방향은 update_min 과 같은 쪽이다 — "더 잘 보게" 만든다. 실패한 alpha1 0.4
    # 와는 성격이 다르다(그쪽은 "덜 확신하게" 만들어 planner 를 멈춰 세웠다).
    #
    # [미검증] 대가는 CPU 이고 이번 회차의 관건이 그것이다. 필터 갱신 비용이
    # 빔 수에 비례하므로 amcl CPU 가 3배 가까이 오를 수 있다. 이미 여유가 넉넉한
    # 편은 아니다:
    #   1단계 회차 실측  전체 346 % / 800 %  ·  amcl 7.6 %  ·  load 최대 13.8
    #   load average 13.8 은 코어 8개를 넘는다. 실행 대기 큐가 쌓였다는 뜻이다.
    #   alpha1 회차에서 제어주기 놓침이 0 -> 2 로 늘었다.
    #
    # 되돌리는 신호는 완주 실패가 아니라 이 둘이다:
    #   grep -c "missed its desired rate" ~/.ros/log/controller_server_*.log
    #   vica_drive_compare.py 의 amcl CPU 평균 · load average 최대
    # 되돌릴 때는 180 -> 120 -> 60 으로 내린다.
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # NAV2-B1 1단계. 0.2 / 0.25 -> 0.10 / 0.10 (a 는 각도 rad, d 는 거리 m 다.
    # 단위가 달라 뒤바꿔 적기 쉽다). "이만큼 움직이기 전에는 라이다를 보지
    # 않는다"는 문턱이고, 문턱이 고쳐야 할 오차보다 크면 영영 못 고친다 —
    # 2026-07-31 에 30 cm 어긋난 자세를 고치려고 25 cm 를 먼저 움직여야 했다.
    #
    # 2026-08-12 probe 측정으로 효과가 확인됐다(~/vica_amcl_logs, 21:01 -> 21:15):
    #   1 m 당 갱신     4.83 -> 10.04 회   (2.08배)
    #   무갱신 중앙값   1.05 -> 0.45 s     (0.43배)
    #   무갱신 p95      1.40 -> 0.65 s     (0.47배)
    # 다만 최악 무갱신은 2.75 -> 4.05 s 로 나빠졌고 8/11 기준(3 s 미만)에 못 미친다.
    # 비교 스크립트가 "CPU 포화를 의심하라"를 찍었다. max_beams 를 60 으로 두는
    # 이유가 이것이다 — CPU 를 더 얹기 전에 이 항목부터 갈라 봐야 한다.
    update_min_a: 0.10
    update_min_d: 0.10
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: "/scan"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml'은 기본값을 쓴다:
    #   nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    #
    # 'default_nav_to_pose_bt_xml'은 vica_nav2의 커스텀 트리를 쓴다. 기본 트리에서
    # <BackUp backup_dist="0.30" backup_speed="0.05"/> 한 줄만 지운 것이다.
    # 실주행에서 핸들 뒤에 사람이 따라오는데(guideline/vica_scenario.md),
    # 2026-07-30 Hybrid 주행에서 BackUp이 실제로 0.30 m 후진을 실행했다.
    # planner를 DUBIN으로 바꿔도 막히지 않는다 — BackUp은 planner를 거치지 않고
    # behavior_server가 직접 발행하기 때문이다.
    #
    # 아래 값은 자리표시자다. RewrittenYaml은 '이미 존재하는 키'만 치환하므로
    # 키가 있어야 하고, 실제 경로는 nav2_map_test.launch.py가 설치된 share
    # 디렉터리로 덮어쓴다. 이 launch를 거치지 않고 이 yaml만 직접 쓰면
    # bt_navigator가 파일을 못 찾아 실패한다(조용히 기본 트리로 돌아가지 않는다).
    default_nav_to_pose_bt_xml: "SET_BY_VICA_NAV2_LAUNCH"
    #
    # 2026-07-28: 기본 BT에 SmoothPath가 없다는 것을 근거로 커스텀 BT를 넣어
    # smoother_server(simple_smoother)를 호출해 봤으나 실주행에서 악화되어
    # 되돌렸다. SimpleSmoother는 경로 길이를 줄이는 방향으로 부드럽게 만들어
    # 코너 안쪽으로 경로를 당긴다. 그 결과 측면 여유 중앙값이 0.476 -> 0.373 m로
    # 줄었고, DWB가 저속 궤적만 고를 수 있게 되어 코너 구간의 '절반 이하 속도'
    # 비율이 30.1 -> 52.8 %로 늘었다. 경로 꺾임 p95도 15.1 -> 24.0도로 나빠져
    # 얻은 것이 없었다(costmap 장애물 밀도는 두 주행이 동일했다).
    # 경로 각짐을 풀려면 smoother가 아니라 costmap을 아는 planner가 필요하다.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 컨트롤러가 궤적을 못 찾은 상태를 몇 초까지 참을지. 이 시간을 넘겨야
    # FollowPath 를 실패로 선언한다.
    #
    # 2026-08-16: 0.3 -> 10.0.
    #
    # 사람이 앞을 막으면 DWB 가 궤적을 전부 버리는 것은 **정상**이다. 로봇이
    # 사람 쪽으로 갈 궤적을 고르면 안 되기 때문이다. 그런데 0.3 초는 그 정상
    # 상태를 곧바로 '주행 실패'로 바꾼다. 실패로 선언되면 경로를 통째로 버리고
    # 복구동작(지도 지우기 -> Wait 1 s -> 경로 재작성)으로 넘어가는데, 그 절차가
    # 돌던 중에는 사람이 비켜도 절차를 마쳐야 다시 간다.
    #
    # run19 실측(2026-08-16). 좁은 모서리에서 27.6 초 정체:
    #
    #   No valid trajectories out of 419!   213회 / 27초
    #   복구 동작                             9회
    #   /cmd_vel_req                        1.1 Hz (주행 중 4.4 Hz)
    #   그동안 가장 가까운 장애물             0.85 m · +43도 로 8초간 ±3도 미만
    #
    # 즉 컨트롤러는 27초 내내 419개를 만들어 전부 버리고, 그 사이 복구가 9번
    # 돌았다. 사용자 관찰도 같다 - "사람이 길게 앞을 막고 있으면 컨트롤러가
    # 궤적을 모두 버린다".
    #
    # 10.0 이면 그동안 로봇은 **정지 명령을 내며 같은 경로를 들고 조용히
    # 기다린다.** 사람이 비키는 순간 다음 제어 주기(1/20 초)에 그대로 출발한다.
    # 지도를 지우지도, 경로를 다시 그리지도 않는다.
    #
    # 상한을 20 초 아래로 둔 이유: progress_checker 가 20 초/0.10 m 로 뒤를
    # 받친다. 사람이 아니라 진짜로 갇힌 것이면 그쪽이 복구를 띄운다. 순서가
    # 뒤집히지 않게 이 값은 그보다 작아야 한다.
    #
    # [되돌리기] 0.3 으로 되돌리면 nav2 기본 동작이다.
    # [함께 보지 말 것] sim_time 은 닫힌 축이다. 2026-08-02 실주행에서 2.5 ->
    # 2.0 으로 줄였더니 No valid trajectories 가 74 -> 168 회로 2.3배 나빠졌고
    # 좁은 경로를 한 번도 통과하지 못했다.
    failure_tolerance: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 2026-07-31: 0.5/10.0 -> 0.10/20.0.
      #
      # SimpleProgressChecker는 "movement_time_allowance 안에
      # required_movement_radius 이상 움직였는가"만 본다. 구값 0.5/10.0은
      # 평균 0.05 m/s 이상을 끊임없이 유지하라는 뜻인데, 좁은 구간 서행이
      # 정확히 그 속도다. 즉 정상 주행을 실패로 오판한다.
      #
      # recovery가 있을 때는 이 오판이 Spin 한 번으로 흡수됐다. 복구를 끈
      # 지금은 오판이 곧 주행 종료이므로, 이 값을 고치지 않으면 좁은 구간에서
      # 거의 확실히 죽는다. '인내를 늘리는 것'이 아니라 '오탐을 없애는 것'이다.
      #
      # 도착 구간도 위험하다. Isaac 시뮬레이션 쪽 주석에 "저속 컨트롤러가 이미
      # 목표 허용범위 안에 멈춘 뒤에도 progress checker를 건드릴 수 있다"가
      # 있고, 실기는 StoppedGoalChecker라 도착 판정이 더 오래 걸린다.
      #
      # 20.0은 velocity_smoother 정지시간(max_vel_x/max_decel)보다 훨씬 커야
      # 한다는 test_nav2_params_contract의 계약도 함께 만족한다.
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    # Goal checker parameters
    general_goal_checker:
      # 감속 중 tolerance를 재이탈해도 속도 조건만으로 성공 처리되지 않도록
      # 매 주기 XY/yaw를 재검사한다.
      stateful: False
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.25
      # yaw_goal_tolerance 0.25 -> 0.15 (2026-08-25)
      #
      # 도착한 뒤 로봇이 바라보는 방향을 더 정확하게 맞추려는 것이다. 0.25 rad 는
      # 14.3도라 안내 로봇이 "저쪽입니다" 하고 선 방향이 눈에 띄게 어긋난다.
      # 0.15 rad 는 8.6도다.
      #
      # xy 는 건드리지 않는다. 한 번에 한 축만 움직인다.
      #
      # 대가는 도착까지 걸리는 시간이다. stateful 이 False 라 매 주기 yaw 를
      # 다시 보고, StoppedGoalChecker 라 rot_stopped_velocity 0.05 아래로
      # 느려질 때까지 기다린다. 남은 0.10 rad 를 RotateToGoal 이 줄여 놓은
      # 회전 속도(max_vel_theta 0.4 / slowing_factor 5.0 = 약 0.08 rad/s)로
      # 닫으면 대략 1~2초가 더 붙는다. progress checker 의
      # movement_time_allowance 20.0 s 에는 여유가 있다.
      #
      # [미검증] 위 1~2초는 계산이고 실기로 확인해야 한다.
      #
      # 되돌리는 신호는 '도착이 느리다'가 아니라 이 둘이다.
      #   - 도착 지점에서 좌우로 흔들리며 못 멈춘다(회전 진동)
      #   - progress checker 가 도착 직전에 주행을 실패로 끝낸다
      #     grep "Failed to make progress" ~/.ros/log/controller_server_*.log
      # 되돌릴 때는 0.15 -> 0.20 -> 0.25 로 올린다.
      yaw_goal_tolerance: 0.15
      # 위치·방향뿐 아니라 실제 저속 상태까지 확인한 뒤 도착으로 판정한다.
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.05
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      # 2026-08-13: 0.26 -> 0.5. 사용자 요구다 — 안내 보행 0.8~1.1 m/s 에 비해
      # 너무 느렸다. 회전(max_vel_theta)은 이번에 건드리지 않는다. 한 번에 한
      # 축이고, 회전은 별도 병목으로 따로 잰다.
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.4 # 1.0 회전 속도 줄임
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.0 # 2.5 주행 시작 시 너무 튀어나가서 줄임
      acc_lim_y: 0.0
      acc_lim_theta: 2.0 # 3.2 회전 시작 속도 줄임
      # 장애물 회피·취소·controller 정지 등 모든 상황의 실제 제동력이므로 전역
      # 최대치를 유지한다. 도착 시 완만함은 velocity_smoother.max_decel에서만
      # 별도로 완화한다 (guideline/vica_scenario.md 참고). E-stop 0 출력은
      # Safety가 별도 처리한다.
      #
      # 2026-08-13: -2.5 -> -1.5. 속도를 0.5 로 올리면서 smoother 와의 정합이
      # 깨지기 때문이다. DWB 는 이 값으로 "여기서 설 수 있다"를 계산하는데,
      # 실제 감속은 smoother 가 낸다. 낙관적으로 계획할수록 계획한 정지선을
      # 넘는다:
      #   0.5 m/s, DWB -2.5 / smoother -1.0  ->  초과 7.5 cm   padding 5 cm 넘음
      #   0.5 m/s, DWB -1.5 / smoother -1.25 ->  초과 1.7 cm   덮인다
      # 제동력을 줄인 것이 아니라 계획을 보수적으로 만든 것이다. 실제 제동은
      # smoother 가 -1.25 로 이전보다 오히려 세다. 계약은
      # test_velocity_smoother_linear_decel_matches_dwb 가 지킨다(하한 1.0 도 있다).
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      # 2026-08-02: 1.7 -> 2.5. DWB가 내다보는 거리를 늘린다.
      #
      # DWB는 '거리'가 아니라 '시간'을 내다본다. sim_time x max_vel_x 가 궤적
      # 길이이므로 지금 값은 이렇게 계산된다.
      #
      #   1.7 x 0.26 = 0.44 m  + footprint 앞단 0.355 m = 검사 도달 0.80 m
      #   2.5 x 0.26 = 0.65 m  + 0.355 m               = 검사 도달 1.01 m
      #
      # obstacle_max_range 는 3.0 m 인데 DWB 는 0.80 m 앞만 검사했다. 즉 costmap 에
      # 찍힌 2.2 m 분을 controller 가 한 번도 읽지 않았다. run1104 에서 의자가
      # 1.5 m 앞에 찍히고 4초 뒤 LETHAL 이 됐는데 그 4초 동안 감속이 없었던 이유다.
      #
      # ObstacleFootprint.scale 은 0.15 그대로 둔다. 같은 날 0.6 을 시험했다가
      # 궤적 전멸이 152회로 뛰어 되돌렸다(위 critic 주석 참고). '거부 세기'가
      # 아니라 '보는 거리'만 바꾸는 것이 이번 변경의 취지다.
      #
      # **대가는 계산량이다.** 궤적당 자세 수가 sim_time/granularity 에 비례해
      # 약 1.5배가 된다. 궤적 400개 x 자세 68개 -> 100개. run1104 에서 이미
      # "Control loop missed its desired rate of 20 Hz" 가 19회 나왔으므로,
      # 주행 후 이 횟수를 먼저 센다:
      #   grep -c "missed its desired rate" ~/.ros/log/controller_server_*.log
      # 크게 늘면 sim_time 을 2.0 으로 낮추거나 vx_samples/vtheta_samples 를 줄인다.
      #
      # 또 하나. 궤적이 길어지면 그만큼 LETHAL 을 밟을 확률도 올라가므로
      # "No valid trajectories" 가 함께 늘 수 있다. scale 0.6 때(152회)만큼
      # 뛰면 이 방향도 통로 폭에 막힌 것이다.
      #
      # ── 2026-08-02: 2.5 -> 2.0. 위 우려가 실제로 나타났다 ─────────────────
      # padding 0.04 회차에서 No valid trajectories 가 74회였고, 거부 사유 30회가
      # "궤적의 100 % 가 장애물에 걸림"이었다. 좁은 통로에서 1.00 m 앞까지
      # 안전한 경로를 요구하니 그린 궤적이 전부 벽·가구 다리에 닿는다. 실제로는
      # 20~30 cm 씩 조금씩 움직이면 빠져나올 수 있는 자리다.
      #
      #   1.7 x 0.26 + 0.355 = 0.80 m 검사   <- 의자에 박던 값
      #   2.0 x 0.26 + 0.355 = 0.87 m        <- 이번. 여전히 1.7 보다 멀리 본다
      #   2.5 x 0.26 + 0.355 = 1.00 m        <- 좁은 곳에서 불리
      #
      # 두 요구가 정면으로 부딪힌다. 멀리 보면 장애물을 미리 피하고(넓은 곳),
      # 짧게 보면 좁은 곳에서 해를 찾는다. DWB 는 이 값 하나로 둘 다 정하므로
      # 상황별로 바꿀 수 없다. 그 한계를 넘으려면 controller 자체를 바꿔야
      # 한다(MPPI 는 별도 브랜치에서 시험).
      #
      # **실패 신호**: 의자·사람 앞에서 감속이 늦어 다시 부딪히면 되돌린다.
      # 되돌릴 값은 2.5 다.
      #
      # ── 결과: 2.0 은 역효과. 2.5 로 되돌린다 (2026-08-02 16:36 실주행) ────
      #   No valid trajectories  74 -> **168회**  2.3배 악화
      #   좁은 경로는 한 번도 통과하지 못했다
      #
      # 예측이 틀렸다. "짧게 보면 좁은 곳에서 해를 찾는다"고 봤는데 반대였다.
      # 궤적이 짧아지면 **장애물을 피해 돌아나가는 곡선을 그릴 여유가 없어진다.**
      # 0.88 m 앞만 보면 "이 앞은 막혔다"만 보이고, 그 너머로 빠져나가는 경로를
      # 못 그린다. 우회 궤적은 멀리 봐야 나온다.
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: True
      stateful: True
      # BaseObstacle은 "원형 로봇"을 가정하고 궤적 각 자세에서 중심 셀 하나만
      # 조회한다. VICA footprint는 x -0.595~+0.305, y ±0.2275(길이 0.900, 폭
      # 0.455)이라 padding 0.05 적용 후 inscribed 0.2775 m와 circumscribed
      # 0.6506 m가 2.3배 차이난다.
      # 중심이 free여도 후방 0.595 m나 전방 0.305 m가 장애물에 들어가 있을 수
      # 있고, inflation은 방향 무관 등방성이라 이 방향 의존성을 표현하지 못한다.
      # 최협 통로 반폭 0.35 m < circumscribed 0.6506 m이므로, 그곳에서 제자리
      # 회전하면 후방이 부딪히는데 BaseObstacle로는 이를 걸러낼 수 없다.
      # (2026-08-06 수치 갱신: 이 문단은 원래 사각형 footprint 기준으로
      #  x -0.60 / inscribed 0.277 / circumscribed 0.692라 적혀 있었다. 2026-08-02
      #  육각형 전환으로 외접이 0.675 -> 0.651로 줄었다. 결론은 그대로다.)
      # ObstacleFootprint는 궤적 각 자세에 footprint를 놓고 변을 순회한다.
      #
      # 교체만으로 서행이 11.0 -> 7.9 s로 줄었고 제어주기도 버텼다(중앙값
      # 50.1 ms, 75 ms 초과 1.0 %). short_circuit_trajectory_evaluation이
      # True라 조기 탈락이 유지되는 덕이다.
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # critic은 '충돌하면 무효'라는 하드 판정만 정확하게 만든다. '장애물에서
      # 멀어지려는 선호'의 세기는 scale이 정한다. 0.08에서는 무게가 이랬다:
      #   ObstacleFootprint 최대 기여 = 253 x 0.08 = 20.2
      #   PathDist 경로 이탈 1셀(5 cm) = 32
      # 장애물 비용을 최대로 물어도 경로에서 3 cm 벗어나는 것보다 싸서, 경로가
      # 벽에 붙어 있으면 그대로 따라갔다(측면 여유 0.415 -> 0.411 m, 무변화).
      # inflation 곡선 cost = 253*exp(-3.5*(d-0.277))로 계산하면 벽 이격을
      # 0.35 -> 0.45 m로 옮기는 이득이 58이고 대가가 경로 이탈 2셀 = 64이라
      # 손익분기 scale이 약 1.1이다.
      #
      # 0.3으로 올렸더니 좁은 곳에서 로봇이 갇혔다(2026-07-28). 전방 여유가
      # 0.146 m(중심 기준 0.451 m)인 지점에서 46초간 한 발도 못 나갔고,
      # /plan은 계속 나오는데 /cmd_vel_nav에 5.2초짜리 공백이 반복됐다.
      # 경로는 멀쩡한데 controller가 유효 궤적을 하나도 못 찾은 것이다.
      # inflation_radius 0.45가 최협 통로 반폭 0.35 m보다 커서 좁은 곳은 전부
      # 비용 지대인데, scale 0.3이 그 비용을 무겁게 쳐 모든 궤적이 탈락했다.
      # 회피 선호는 남기되 궤적이 전멸하지 않도록 0.15로 낮춘다.
      # 이래도 갇히면 다음은 inflation_radius를 0.45 -> 0.38로 낮춰 최협
      # 통로에 비용 0인 중앙선을 만드는 것이다.
      #
      # 2026-07-30: 0.15 -> 0.5. 이유는 '회피 선호'가 아니라 planner와 controller의
      # '충돌 임계값 비대칭'을 닫는 것이다. 기계어로 확인했다:
      #   dwb_critics ObstacleFootprintCritic::pointCost
      #       cmp w1, #0xfe (254 LETHAL) / cmp w1, #0xff (255 UNKNOWN) -> 예외
      #       0xfd(253 INSCRIBED) 비교가 없다 -> 253은 통과시킨다
      #   nav2_smac_planner GridCollisionChecker::inCollision
      #       cmp w1, #0xfc (252 초과 = 253 이상) -> 충돌 (footprint 전체)
      # 즉 253 밴드는 controller에게 합법이고 planner에게 금지다. DWB가 footprint를
      # 253 밴드에 넣으며 정상 주행하다가, 그 자리에서 planner가
      # "Starting point in lethal space"로 아무 경로도 못 내고 굳는다. 부딪히지도
      # 않았고 나갈 공간이 있는데 멈춘다.
      # 2026-07-30 주행 실측(bins36_people): 정지 지점의 로봇 중심 셀 값이 74~79
      # (경사 안, 합법)였고 중심이 99 이상인 샘플은 36개 중 0개였는데,
      # planner "Starting point in lethal space"가 22회, DWB "No valid"는 3회였다.
      # 대부분의 순간 셀은 253이었고 DWB만 괜찮다고 한 것이다.
      #
      # scale은 253 진입 비용을 정한다. PathDist.scale 32가 경로 1셀(5 cm) 이탈
      # 비용이므로 무게 비교는 이렇다:
      #   0.15 -> 253 x 0.15 =  38  = 경로 1.2셀   (싸다. 자유롭게 들어간다)
      #   0.5  -> 253 x 0.5  = 127  = 경로 4.0셀   <- 채택
      #   1.0  -> 253 x 1.0  = 253  = 경로 7.9셀
      # 2026-07-28에 0.3이 나빴던 기록은 planner가 SmacPlanner2D(점 로봇)로
      # 경로 자체가 달랐던 때다. 그때는 planner가 253 밴드를 지나는 경로를
      # 냈으므로 controller가 그것을 거부하면 전멸했다. 지금은 planner가
      # 253을 피한 경로를 내므로 controller가 같은 기준을 따르는 것이 정합이다.
      #
      # 2026-07-30 실측 (같은 코스 방2 -> 화장실 -> 안내소, 7회):
      #   scale 0.15  lethal space  1~25회 / DWB 무효   3~4회   완주 3/3 (사람 없음)
      #   scale 0.25  lethal space     28회 / DWB 무효     1회   완주 1/3
      #   scale 0.5   lethal space      2회 / DWB 무효   133회   완주 1/3
      # 0.5는 궤적이 전멸했고(44배), 0.25는 lethal space가 오히려 최다였다.
      # 완주한 것은 0.15뿐이므로 되돌린다.
      #
      # 임계값 비대칭(DWB 254 vs planner 253)은 여전히 열린 문제다. scale로는
      # 두 실패 모드 사이에 앉히지 못했다 - 0.15에서 lethal space가 1회(사람 없음)와
      # 25회(사람 있음)로 갈리므로, 이 값은 환경이 정하고 scale이 정하지 않는다.
      #
      # ── 2026-08-02: 0.15 -> 0.6. Lattice에서 다시 연다 ─────────────────
      # 위 7회 실측은 planner가 **Hybrid**일 때다. 이 브랜치는 Lattice이고,
      # 같은 주석 위 문단(2026-07-28 0.3 실패 기록을 무효로 본 대목)이 이미
      # "planner가 바뀌면 전제가 바뀐다"고 적었다. Lattice는 footprint 전체로
      # 253을 피한 경로를 내므로, controller가 같은 기준을 따르는 것이 정합이다.
      #
      # 오늘 실주행(run1104)에서 이 값이 왜 문제인지 실측으로 드러났다.
      # 의자에 정면으로 박은 구간을 bag으로 열어 보면:
      #
      #   11:10:36  전방 1.5 m 에 비용 79 로 찍힘        속도 0.20 m/s
      #   11:10:38  전방 1.0 m 에 비용 72               속도 0.22 m/s  감속 없음
      #   11:10:40  전방 0.5 m 가 LETHAL(99)            속도 0.24 m/s  감속 없음
      #   11:10:42  ─ 이제야 정지 ─                     속도 0.04 m/s
      #
      # 감지는 4초 전부터 되고 있었다. 피하지 않은 이유는 점수다:
      #   장애물 비용 79 x 0.15          =  11.8점
      #   경로에서 0.5 m 이탈 = 10셀 x 32 = 320점
      # 회피가 27배 손해라 직진이 이겼다. 로봇은 정확히 계산했고 저울이 틀렸다.
      #
      # 0.6이면 79 x 0.6 = 47점이 되어 경로 1.5셀(7.5 cm) 이탈과 맞먹는다.
      # "조금 비켜 간다"가 선택지가 된다.
      #
      # **관찰할 실패 신호**: Hybrid 때 0.5가 무너진 방식은 궤적 전멸이었다
      # (DWB "No valid trajectories" 3~4회 -> 133회, 44배). 주행 후 이걸 먼저 센다:
      #   grep -c "No valid trajectories" ~/.ros/log/controller_server_*.log
      # 두 자릿수로 뛰면 통로가 좁아 회피 유인을 감당 못 하는 것이므로 되돌린다.
      # 되돌리는 값은 0.15다. 중간값 0.25는 Hybrid에서 갇힘이 오히려 최다(28회)였다.
      #
      # ── 결과: 0.6 실패. 0.15로 되돌린다 (2026-08-02 12:00 실주행) ────────
      #   No valid trajectories       몇 회 -> 152회   (Hybrid 0.5의 133회보다 나쁘다)
      #   planner "lethal space"       4회 -> 56회
      #   거부 사유 67회가 "1.00 ObstacleFootprint" = 궤적의 100 %가 장애물로 거부
      #   Goal 성공 3 / 실패 2. 멈췄다 복구했다를 반복하다 6회 재시도를 소진해 종료
      #
      # 다만 **부딪힘은 실제로 사라졌다**(사용자 보고). 회피 방향 자체는 옳았다.
      #
      # 이로써 scale로는 못 푼다는 것이 **두 planner에서** 확인됐다.
      #   Hybrid  0.5 -> 궤적 전멸 133회
      #   Lattice 0.6 -> 궤적 전멸 152회
      # planner를 바꿔도 같은 실패가 나므로 원인은 planner가 아니라 통로 폭이다.
      # 1.0 m 통로에서 inflation 0.45면 비용 0인 폭이 10 cm뿐이라, 회피 유인을
      # 세게 주면 모든 궤적이 비용 지대를 지나 전멸한다. 파고들기(0.15)와
      # 멈춰서기(0.6) 사이에 앉힐 값이 없다.
      #
      # 다음 시도는 scale이 아니라 **더 일찍 보기**다(sim_time). 거부 세기를
      # 건드리지 않으므로 궤적 전멸이 늘지 않는다.
      ObstacleFootprint.scale: 0.15
      PathAlign.scale: 32.0
      # forward_point_distance는 "로봇 앞 이 거리의 점"을 경로에 정렬시키는
      # 기준점이다. 0.1은 footprint 전방(0.305) 안쪽, 즉 차체 내부라서
      # PathAlign이 PathDist와 하는 일이 겹쳐 방향 정렬 정보가 사라진다.
      # 그러면 코너를 미리 보고 꺾지 못하고 도달해서야 반응하므로 감속한다.
      # 2026-07-28 주행에서 코너 구간의 |wz|-vx 상관이 -0.389였다(코너 없는
      # 구간은 -0.116). Nav2 기본값 0.325로 되돌린다.
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      # [근거 없음] nav2 기본값은 3×3이다. 6×6으로 키운 경위를 적은 주석도
      # devlog 기록도 없다. 2026-08-06 전수 점검에서 확인했다.
      #
      # 판단에 쓸 수 있는 재료만 적어 둔다(추정이며 검증되지 않았다):
      #   - rolling_window 이므로 6×6 은 로봇 중심 반경 3.0 m 를 담는다.
      #     아래 raytrace_max_range 3.5 m 는 그래도 맵 밖으로 나간다.
      #   - DWB 가 실제로 검사하는 거리는 sim_time 2.5 × 0.26 + footprint 앞단
      #     0.355 = 1.01 m 라 3×3(반경 1.5 m)로도 담기기는 한다.
      #   - 대가는 셀 수다. 6 m/0.05 = 120셀 → 14,400셀로 3×3(3,600셀)의 4배다.
      #     update_frequency 5.0 Hz 로 갱신하므로 CPU 여유를 볼 것.
      # 줄이려면 raytrace_max_range 와 함께 판단해야 한다.
      width: 6
      height: 6
      resolution: 0.05
      # robot_radius: 0.22
      # footprint는 vica_description/meshes/base_link.stl의 XY 투영 실측값이다.
      # URDF collision origin이 z만 오프셋(xyz="0 0 -body_center_z")이라 STL x/y는 base_link
      # 좌표와 직접 대응한다. 실측 bbox: x -0.505~+0.305, y ±0.227.
      #   전방 +0.305 : 구값 +0.15은 실제보다 15.5 cm 짧아 커브 중 전방 범퍼가
      #                 costmap상 free 영역을 쓸고 지나가 실제 충돌이 발생했다
      #                 (2026-07-27 화장실 주행). LiDAR(+0.185)·카메라(+0.287)·
      #                 전방 캐스터(+0.252)가 모두 구값 바깥이었던 것이 방증이다.
      #   좌우 ±0.227 : 구값 ±0.1875는 각 4 cm 짧았다.
      #   후방 -0.565 : 2026-07-29 줄자 실측(중심 -> 핸들 끝 56.5 cm). STL은 -0.505로
      #                 6 cm 짧아 후방부를 신뢰할 수 없다. 같은 날 핸들 기둥 위치도
      #                 CAD(-0.265~-0.305) 대비 실측(-0.205)이 7~10 cm 어긋났다.
      #                 구값 -0.60은 STL만 보고 "안전 여유"로 얹은 3.5 cm였는데,
      #                 실측이 -0.565로 나와 근거가 사라졌다. 전방·좌우와 같이
      #                 실측 + padding 0.05로 통일한다.
      #
      #                 효과는 외접반경 0.707 -> 0.675 m다. 지도 free 면적 106.4 m2 중
      #                 제자리 회전 가능 면적이 42.0 -> 44.0 %가 된다(+2.2 m2).
      #                 다만 이것으로 갇힘이 풀리지는 않는다. planner가 보는 면적은
      #                 내접 0.277 기준 74.9 %라 격차가 여전히 30.9 %p다.
      # test_footprint_contract가 이 값과 실측의 정합을 감시한다.
      #
      # ── 2026-08-02: 사각형 -> 육각형. 손잡이를 실제 폭으로 표현한다 ──────
      # 줄자 재실측: **손잡이 제외 차체 61 cm · 손잡이 돌출 29 cm · 합계 90 cm**
      #              가로 45.5 cm · 손잡이 가장 넓은 곳 **7 cm**
      #              손잡이는 높이 80 cm · 라이다 포함 차체 높이 38 cm
      #
      # base_link(구동륜 축) 기준으로 앞 +0.305, 차체 뒤 -0.305(=61 cm 대칭),
      # 손잡이 끝 -0.595(=차체 뒤에서 29 cm 더). 즉 차체는 앞뒤 대칭이고 뒤로
      # 29 cm 더 나온 것은 손잡이 하나다. 그런데 사각형 footprint 는 그 29 cm 를
      # **차체 폭 45.5 cm 로 꽉 찬 것**으로 다뤘다. 실제로는 폭 7 cm 막대다.
      #
      # 이 과대평가가 코너 통과를 막고 있었다. R=0.5 호로 1.0 m 코너를 돌 때
      # 필요한 폭(padded footprint 스윕):
      #
      #     사각형   0.990 m   1.0 m 코너 여유 +1 cm    <- 벽 요철 하나에 막힌다
      #     육각형   0.750 m                 +25 cm
      #
      # 2026-08-02 실주행에서 "1 m 폭 구간에서 코너 돌아 빠져나올 때 못 나오고
      # 같은 자리에서 계속 멈춘다"가 이 1 cm 였다.
      #
      # **손잡이를 뺀 것이 아니다.** 여전히 footprint 안에 있고 뒤로 56.7 cm 를
      # 차지한다. 폭만 실제값(7 cm)으로 줄였다. 손잡이 높이 80 cm 는 사람 허리
      # 높이이고 책상 상판 72 cm · 의자 등받이 75 cm 도 그 대역이라, 후방 보호를
      # 없애면 회전할 때 사람을 친다. Nav2 는 2D footprint 하나만 쓰므로
      # "낮은 장애물엔 무시, 높은 것엔 적용"을 할 수 없다.
      #
      # 외접반경은 0.675 -> 0.651 m 로 거의 그대로다. 손잡이 끝이 여전히 가장
      # 먼 점이기 때문이다. 즉 **제자리 회전 능력은 나아지지 않는다**(필요 폭
      # 1.35 -> 1.30 m). 좋아지는 것은 호로 돌 때의 스윕 폭이다.
      #
      # 대가: 내접반경이 0.277 -> 0.085 m 로 줄어든다. 내접원은 "어디든 이 안은
      # 무조건 안전"이라 빠른 판정에 쓰이는데, 뒤가 뾰족해지니 작아진다.
      #   좋은 면 - planner 의 "Starting point in lethal space" 판정이 완화된다
      #             (2026-08-02 회차마다 14회씩 나던 갇힘의 직접 원인)
      #   나쁜 면 - 매번 육각형 변을 훑어야 해서 planner/controller 가 무거워진다
      #             [미검증] Control loop missed 가 늘면 이 대가가 큰 것이다
      #
      # 볼록 다각형이다(꼭짓점 6개, 외적 부호 일정). Nav2 costmap 이 요구한다.
      #
      # ── 2026-08-13: 하드웨어 최종 실측. 손잡이가 29 -> 19 cm 로 짧아졌다 ──
      #
      #   차체 61 cm(앞뒤 대칭 ±0.305) · 손잡이 19 cm · 총 세로 80 cm
      #   반폭 0.225(전체 폭 45 cm) · 손잡이 최대폭 7 cm
      #
      # 후방 -0.495 = -0.305 - 0.19 이다. 폭은 0.2275 -> 0.225 로 1.5 mm 줄었다.
      # STL(±0.2265)보다 1.5 mm 작지만 CAD 보다 줄자를 우선한다 — 후방부가 6 cm
      # 틀렸던 전례가 있다(위 2026-07-29 문단). test_footprint_contract 가 그
      # 차이를 1 cm 까지만 허용하므로, CAD 와 실물이 더 벌어지면 시험이 잡는다.
      #
      # padding 0.05 포함 효과:
      #   내접  0.2775 -> 0.275 m    통과 가능성. 거의 그대로다
      #   외접  0.651  -> 0.552 m    제자리 회전. 10 cm 줄었다
      #   제자리 회전 필요 직경  1.30 -> 1.10 m
      #   L자 코너 최소 통로     0.728 -> 0.670 m (스윕 시뮬레이션)
      # 손잡이가 외접반경을 지배하므로 뒤를 줄인 효과가 회전에 그대로 나타난다.
      #
      # 이 파일의 다른 곳에 남은 -0.595 · 0.2275 · 0.651 · 0.2775 는 2026-08-02
      # 기준 기록이며 그때의 판단 근거로 남긴다. 현재 값은 이 문단이다.
      #
      # 되돌리려면 아래 한 줄을 사각형으로 바꾼다:
      #   "[[0.305, 0.225], [0.305, -0.225], [-0.495, -0.225], [-0.495, 0.225]]"
      # 그러면 손잡이 19 cm 를 차체 폭으로 꽉 찬 것으로 다루게 되어 코너 통과
      # 폭이 다시 커진다. 육각형으로 바꾼 이유가 그것이다.
      footprint: "[[0.305, 0.225], [0.305, -0.225], [-0.305, -0.225], [-0.495, -0.035], [-0.495, 0.035], [-0.305, 0.225]]"
      # padding은 유일한 '하드 여유'다. inscribed radius = 0.227 + padding 이고
      # planner는 벽에서 그 거리까지 통과 가능으로 본다. padding 0.03이면 차체
      # 가장자리가 벽에 정확히 닿는 지점까지 경로가 허용되어 여유가 0이었고,
      # AMCL 오차만큼 그대로 충돌로 이어졌다. 0.06으로 3 cm 하드 여유를 준다.
      # 맵 최협 구간 반폭이 0.35 m라 inscribed 0.287에도 통과 여지가 남는다.
      # 2026-08-02: 0.05 -> 0.03. planner 의 "Starting point in lethal space" 를
      # 줄이려는 유일한 소프트웨어 수단이다.
      #
      # 그 판정은 **내접반경**이 정한다. Smac 의 GridCollisionChecker 는 로봇 중심
      # 셀이 253(INSCRIBED) 이상이면 **footprint 모양을 보지도 않고** 충돌로
      # 끝낸다. 그 253 밴드를 inflation_layer 가 칠하는 범위가 내접반경이다.
      #
      #   내접반경 = 차체 반폭 0.2275 + padding
      #     padding 0.05 -> 0.2775 m
      #     padding 0.03 -> 0.2575 m   (2 cm 얇아진다)
      #
      #   1.0 m 통로(반폭 0.50)에서 로봇 중심이 있어도 되는 폭
      #     0.05 -> 0.445 m      0.03 -> 0.485 m   (4 cm 넓어진다)
      #
      # 같은 날 footprint 를 육각형으로 바꿔 봤지만 이 판정에는 아무 영향이
      # 없었다(lethal space 14회 -> 14회). 내접반경은 '가장 가까운 변'까지의
      # 거리인데 육각형에서도 그 변은 여전히 차체 좌우 변이라 값이 그대로다.
      # 뒤를 뾰족하게 만드는 것은 2단계(실제 모양 검사)에만 효과가 있고,
      # 1단계(중심 셀 253 판정)는 좌우 폭이 정한다.
      #
      # 대가: 차체와 costmap 사이 하드 여유가 5 -> 3 cm 다. AMCL 오차·바닥
      # 미끄러짐이 3 cm 를 넘으면 그대로 접촉이다. costmap 해상도가 5 cm 라
      # 격자 반올림에 묻힐 가능성도 있다 [미검증].
      #
      # **실패 신호**: 벽·의자에 스치기 시작하면 되돌린다. 되돌릴 값은 0.05 다.
      # test_padding_keeps_a_hard_clearance_margin 이 0.05 하한을 요구하므로
      # 그 시험도 함께 고쳤다 - 근거는 그 시험 주석에 적었다.
      #
      # ── 결과: 0.03 실패. 0.05 로 되돌린다 (2026-08-02 15:16 실주행) ──────
      # 노린 효과는 나왔다. planner "lethal space" 14 -> 0회, 1 m 폭 구간을
      # 처음으로 통과했고 Goal 8개를 전부 달성했다. 그런데 대가가 컸다.
      #
      #   Control loop missed  0 -> 838회   (RViz·VS Code 종료 후에도 345회)
      #   사용자 보고: "직진 구간에서도 좌우로 움직인다" -> 다음 회차 "부딪혔다"
      #
      # 인과는 이렇다. padding 이 작아지면 내접반경이 줄어 Smac 의 '빠른 통과
      # 판정'(중심 셀이 내접원 안이면 footprint 검사 생략)이 덜 먹는다. 그만큼
      # 매 궤적마다 footprint 변 전체를 훑게 되어 20 Hz 제어 주기를 놓친다.
      # 반응이 늦어지면 0.26 m/s 로 4 cm 를 더 가는데, 여유가 3 cm 뿐이라
      # 그대로 접촉이다. **여유를 깎은 것이 계산을 무겁게 만들고, 무거워진
      # 계산이 여유를 잡아먹는** 되먹임이었다.
      #
      # 검사 비용을 둘레 기준으로 추정하면(궤적 400 x 자세 100):
      #   육각형 + 0.03  100 %      <- 부딪힘
      #   사각형 + 0.03  108 %      사각형은 뒤가 넓어 둘레가 길다. 더 무겁다
      #   육각형 + 0.05   77 %      <- 채택. 여유 회복 + 계산 23 % 감소
      #   사각형 + 0.05   83 %
      # 즉 되돌릴 축은 footprint 모양이 아니라 padding 이다. 꼭짓점 개수가
      # 아니라 둘레 길이가 비용을 정하기 때문이다.
      #
      # 1 m 구간은 다시 못 갈 것이다. 그 구간은 **계산을 먼저 가볍게 만든 뒤**
      # (궤적 샘플 축소 등) 다시 도전한다. 순서를 거꾸로 해서 사고가 났다.
      #
      # ── 2026-08-02 16:02: 부하가 풀렸다. 0.05 -> 0.04 로 다시 내린다 ──────
      # IMU 어댑터를 50 Hz 로 스로틀한 회차에서 부하 문제가 사라졌다.
      #
      #   Control loop missed  382 -> **0회**
      #   load average         17.1 -> 4.28 (코어 8개)
      #   ekf_node CPU         25.7 -> 4.5 %   (IMU 입력이 줄어 함께 가벼워졌다)
      #
      # 사용자 보고: "다 잘 갔는데 마지막 1 m 통로 구간에서 또 못 가고 섰다.
      # 코너만 나오면 완벽했다." 그 회차 planner lethal space 는 31회였다.
      #
      # 역설처럼 보이지만 설명된다. 제어가 제때 나가니 로봇이 계획 경로를 그대로
      # 따라가고, 그 경로가 좁은 통로 한가운데를 지나 253 판정에 걸린다. 부하가
      # 있던 회차에는 반응이 늦어 어정쩡하게 다니느라 그 자세에 덜 들어갔다.
      #
      # 'Starting point in lethal space' 를 줄이는 축은 **padding 뿐**이다.
      # 253(INSCRIBED) 밴드 반경 = 차체 반폭 0.2275 + padding 이고,
      # inflation_radius 는 253 바깥의 감쇠 비용만 정해 이 판정과 무관하다.
      # 오히려 inflation 을 낮추면 벽 근처가 덜 비싸져 로봇이 더 붙어 다니고
      # 253 진입이 늘 수 있다(0.45 회차의 벽 붙음이 그 방향이다).
      #
      #   padding   253 반경    1.0 m 통로 중심 허용폭   실측
      #    0.05     0.2775 m         0.445 m          lethal 5~31회
      #    0.04     0.2675 m         0.465 m          <- 이번 시험
      #    0.03     0.2575 m         0.485 m          lethal 0회 (부하 폭증 동반)
      #
      # 0.03 은 효과가 이미 확인됐지만(1 m 구간 통과·Goal 8개 전부 성공) 그때는
      # 계산이 무거워져 missed 838회가 났고 그 지연이 충돌로 이어졌다. 지금은
      # missed 0회라 여유가 있지만, 얼마나 남았는지는 모른다. 절반만 가서
      # **missed 가 0을 유지하는지 먼저 본다.** 유지되면 그때 0.03 을 검토한다.
      #
      # **실패 신호 둘.** (1) missed 가 다시 두 자릿수 이상 -> 계산이 감당 안 되는
      # 것이니 되돌린다. (2) 벽·의자에 스침 -> 여유 4 cm 가 부족한 것이니 되돌린다.
      # 되돌릴 값은 0.05 다.
      #
      # ── 결과: 0.04 는 문제를 planner 에서 controller 로 옮겼을 뿐이다 ──────
      # 2026-08-02 16:17 실주행.
      #
      #   planner lethal space   31 -> **0회**    노린 효과는 완벽히 나왔다
      #   No valid trajectories  12 -> **74회**   6배 폭증
      #   Control loop missed     0 -> 3회        부하는 문제없다
      #   Goal                성공2/실패1 -> 성공3/실패0
      #
      # 사용자 보고: "1 m 구간은 무시하고 지나갔는데, 안 서던 곳에서 유턴할 때
      # 장시간 서고 코너 정체가 심해졌다."
      #
      # 원인은 두 계층의 임계값 비대칭이다.
      #   planner(Smac)  253 이상 = 충돌   <- padding 이 정한다. 완화됐다
      #   controller(DWB) 254 만 충돌      <- 코드에 박혀 있어 못 바꾼다
      # padding 을 줄이면 planner 만 완화되어, **로봇이 planner 허락을 받고
      # 들어간 자리에서 DWB 가 움직일 방법을 못 찾는다.** 거부 사유 30회가
      # "궤적의 100 % 가 장애물에 걸림"이었고 복구 Spin 2회는 모두 실패했다.
      #
      # 사용자 판정: "패딩은 0.3~0.5 를 다 해봤는데 0.5 가 가장 안정적이다."
      #
      # 0.04 + sim_time 2.0 조합도 시험했으나 더 나빴다(No valid 74 -> 168회,
      # 좁은 경로 한 번도 통과 못 함). 0.05 로 확정한다.
      #
      # **그리고 이 회차에서 새 기준이 나왔다.** 사용자 관찰:
      #   "패딩을 줄이니까 유턴해서 나올 때 회전 반경이 넓어져서
      #    이용자가 위험할 것 같다"
      #
      # padding 이 작으면 넓은 공간이 합법이 되어 planner 가 **큰 호**를 고른다.
      # 로봇에게는 부드러운 경로지만, 뒤에 사람이 핸들을 잡고 따라온다. 크게 돌면
      # 핸들 끝(뒤 59.5 cm)이 그리는 호가 더 커지고, 사람이 훨씬 많이 움직여야
      # 하며 다음 동작을 예측하기 어렵다. 옆 가구에 사람이 부딪힐 수 있다.
      #
      # **로봇에게 좋은 경로가 사람에게 나쁜 경로다.** 그동안의 판정은 전부
      # "로봇이 통과하는가"였고 "사람이 따라올 수 있는가"는 계산에 없었다.
      # padding 은 회전 반경을 억제하는 역할도 한다 - 이 축에서도 0.05 가 낫다.
      #
      # 이로써 이 축도 양쪽 실패로 닫혔다.
      #   0.05 planner 가 막는다(lethal 31회)  0.04 DWB 가 막는다(No valid 74회)
      #   0.03 DWB 26회 + 계산 폭증 -> 충돌
      # ObstacleFootprint.scale · inflation · 회전반경에 이어 네 번째다. 남은
      # 축은 controller 교체(MPPI)이며 별도 브랜치에서 시험한다.
      footprint_padding: 0.05
      # nvblox_layer: LiDAR가 놓치는 3D 장애물을 보조로 반영한다. slice는 Docker의
      # nvblox_node가 odom frame으로 발행하므로 nav2_costmap_global_frame(odom)과
      # 정합해 TF 없이 병합된다. Host에 nvblox_nav2 plugin이 없으면 이 layer 때문에
      # local costmap configure가 실패한다(test_nvblox_dependency_contract가 감시).
      plugins: ["voxel_layer", "nvblox_layer", "inflation_layer"]
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: odom  # local costmap global_frame과 일치해야 함
        # nvblox가 mapping_type: dynamic이면 정적/동적을 나눠 관리하고
        # combined_map_slice로 둘을 합쳐 발행한다. static_map_slice를 그대로
        # 두면 사람 같은 동적 장애물이 costmap에 들어오지 않는다.
        # 근거와 배경은 vica_nvblox_bringup/config/vica_nvblox_overrides.yaml 주석.
        #
        # 2026-07-30: local은 combined, global은 static으로 '분리'한다.
        # 두 costmap의 역할이 다르기 때문이다.
        #   local  <- combined_map_slice : 정적 + 동적. DWB가 사람을 실시간 회피한다.
        #   global <- static_map_slice   : 정적만. planner가 유령에 막히지 않는다.
        # 하나의 슬라이스로는 둘을 만족시킬 수 없다. 정적을 붙잡으려면 사람도
        # 붙잡히고, 사람을 놓으려면 정적도 놓친다.
        #
        # 근거(2026-07-30 실측): static_tsdf 하나로 global까지 먹이니 사람이 static
        # TSDF에 쌓여, 장애물이 사라진 뒤에도 global costmap에 중앙값 9 s / p95 46 s
        # 남았다(일시 LETHAL 셀 7,693 -> 33,138개). 그 유령이 통로를 막아
        # "Starting point in lethal space"가 22회 났다.
        # TSDF 무게는 소거마다 x0.95이고 1e-3 밑에서 소멸하므로
        #   n = ln(1e-3)/ln(0.95) = 134.7 스텝,  2.5 Hz -> 53.9 s
        # 실측 p95 46 s와 맞는다. 즉 유령의 정체는 '사람이 static에 들어간 것'이다.
        #
        # combined_map_slice는 dynamic 계열 mapping_type에서만 발행된다
        # (nvblox_node.cpp advertiseTopics: isUsingHumanOrDynamicMapper 분기).
        # 짝이 어긋나면 nvblox_layer가 아무것도 받지 못한 채 조용히 무해해진다.
        # test_nvblox_layer_contract.py가 이 짝을 감시한다.
        #
        # 2026-07-30 되돌림: combined -> static_map_slice.
        # 슬라이스 분리(local=combined / global=static)를 시험했으나 유령 지표를
        # 개선하지 못했다 -- 일시 LETHAL 셀 지속 p95가 47.0 s에서 43.0 s로 사실상
        # 그대로였다. mapping_type도 static_tsdf로 되돌리므로 combined는 발행되지
        # 않는다. 두 costmap이 같은 슬라이스를 쓴다.
        #
        # ===== 2026-08-15: human 모드에서도 이 값을 그대로 둔다 =====
        # mapping_type 을 human_with_static_tsdf 로 바꿔도 **여기는 안 바꾼다.**
        # human 모드에서는 마스크가 사람을 전경(사람 전용 mapper)으로 보내므로
        # static_map_slice 에 사람이 애초에 들어가지 않는다. 즉 슬라이스를 나누지
        # 않아도 nvblox 지도에서 사람이 빠진다 -- 이 시험이 노리는 것 자체다.
        #
        # combined_map_slice 로 옮기는 안도 있었으나 택하지 않았다. 그러면 local 만
        # 사람을 보고 global 은 못 봐서 planner 와 DWB 의 장애물이 갈린다.
        # planner 가 사람을 뚫고 경로를 내고 DWB 가 거부하는 형태로 굳을 수 있다
        # (test_both_costmaps_use_the_same_slice 가 막는 결함이다).
        #
        # 사람이 안 보이게 되는 것이 아니다. 라이다(voxel_layer)가 계속 본다.
        # laser_frame 이 0.382 m 라 사람 다리는 스캔 평면을 지나고, 레이트레이싱이
        # 사람이 비키는 즉시 지운다. 오래 기억해야 하는 낮은 장애물만 nvblox 가
        # 맡는 분업이 된다.
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: True
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        # [근거 없음] nav2 기본값 0에서 1로 바꾼 경위가 기록돼 있지 않다
        # (2026-08-06 확인). z 컬럼에 마크된 복셀이 이 수 이상일 때만 2D costmap에
        # 표시한다. LiDAR가 단일 평면(0.382 m)이라 컬럼당 복셀이 많지 않으므로
        # 이 값을 올리면 표시가 사라질 수 있다. 되돌릴 때는 0으로.
        mark_threshold: 1
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # [근거 없음] 아래 네 값은 nav2 기본값(3.0 / 0.0 / 2.5 / 0.0)에서
          # 바뀌었으나 경위를 적은 주석도 devlog 기록도 없다(2026-08-06 확인).
          # 아는 것은 둘뿐이다:
          #   - raytrace(소거) > obstacle(표시) 관계는 유지해야 한다. 표시 범위가
          #     소거 범위보다 넓으면 지워지지 않는 마크가 남는다.
          #   - 그래서 obstacle_max_range 를 올릴 때는 raytrace_max_range 도 함께
          #     올린다. 안 그러면 유령 장애물을 새로 만든다
          #     (devlog/2026-07-31.md 270-274행).
          # min_range 0.12 / 0.05 의 근거는 확인되지 않았다. 내접반경 0.2775 m
          # 보다 작으므로 '자기 차체 필터링'이 목적이라면 값이 부족할 수 있다 —
          # 이는 추정이며 검증되지 않았다.
          raytrace_max_range: 3.5
          raytrace_min_range: 0.05
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          # 관측을 보관하는 시간. 0.0이면 한 프레임만 놓쳐도 즉시 지워진다.
          # LiDAR는 0.382 m 단일 평면이라 의자·테이블 다리처럼 얇은 기둥에는
          # 점이 1~2개만 맞는다(거리 1 m, 각분해능 0.9도 -> 호 길이 1.6 cm).
          # 그래서 검출이 프레임마다 들락날락하고, 0.0에서는 그 간헐성이 그대로
          # costmap 깜빡임이 된다. 코너에서는 측면 물체의 각속도가 커서 더 심하다.
          # 2026-07-28 주행에서 경로는 그대로인데(연속 /plan 변화 0.03~0.13 m,
          # 전체 최대 2.64 m) DWB가 저속 궤적만 골라 3.43 s까지 기어가는 구간이
          # 4회 있었다. 0.5 s를 보관해 얇은 다리를 안정적으로 유지한다.
          # 주의: 다리 하나에도 inflation_radius(현재 0.55)가 적용되므로, 안정적으로
          # 잡힐수록 서행 자체는 길어질 수 있다. 이는 실주행으로 확인한다.
          # (2026-08-06 정정: 이 문장은 0.45라 적혀 있었다. 그 뒤 0.50을 거쳐
          #  2026-08-02에 0.55로 확정됐으므로 이 주의는 오히려 더 커졌다.)
          observation_persistence: 0.5
          # [근거 없음] 둘 다 nav2 기본값(0.0 / false)에서 바뀌었으나 경위가
          # 기록돼 있지 않다(2026-08-06 확인).
          #   expected_update_rate 0.2 = "5 Hz 보다 느리면 이 관측원을 stale로 본다".
          #     stale이 되면 costmap이 isCurrent()=false가 되는데, Nav2가 그때
          #     로봇을 멈추는지 자체가 [미검증]이다
          #     (devlog/2026-07-30-nvblox-ghost-obstacle.md:63).
          #   inf_is_valid true = LiDAR의 inf(반사 없음)를 range_max로 바꿔
          #     raytrace 소거에 쓴다. false면 빈 공간이 지워지지 않는다.
          expected_update_rate: 0.2
          inf_is_valid: true

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

      # inflation_radius는 '통과 가능/불가'를 정하지 않는다. 그건 padding을 적용한
      # footprint에서 계산되는 inscribed radius(0.227+0.05=0.277 m)가 정한다.
      # inflation_radius는 "벽에서 이 거리까지는 비용을 물린다"는 목표 이격거리다.
      # 그 바깥은 비용 0이라 경로가 자유롭다.
      #
      # 0.35일 때: 경사 구간이 0.277~0.35로 폭 7 cm뿐 → 중앙 유도력이 없어
      #   NavFn이 벽에 붙은 최단경로를 그렸고 실제 충돌로 이어졌다.
      # 0.65로 올렸을 때: 통로 반폭 중앙값(0.70 m)에 육박해 통로 '전체'가 비용
      #   지대가 되었다. NavFn은 경로 비용 합을 최소화하므로 비용 0인 먼 길로
      #   우회했고, 좁은 길에서는 최소비용 경로가 거의 동점이 되어 LiDAR 노이즈마다
      #   경로가 뒤바뀌며 주춤거렸다(2026-07-27 실주행).
      # 0.45: 벽 이격 목표를 0.45 m로 두고 그 바깥은 비용 0. 실여유는
      #   0.45 - 0.277 = 0.17 m. 통로 중앙부가 평탄해 우회·진동이 없다.
      # 0.38을 시험했다가 되돌렸다(2026-07-28). 의도한 효과는 나왔다 —
      #   최장 서행이 8.37 -> 2.57 s로 줄고 costmap 비용 지대도 29.3 -> 19.6 %로
      #   축소됐다. 그러나 같은 4구간 경로에서 0.45는 완주(4/4)한 반면 0.38은
      #   마지막 구간에서 61초간 갇혀 실패했다. 갇힌 자리의 여유는 전방 0.264,
      #   후방·우측 0.172 m로 inscribed(0.277) 안쪽이었다.
      #   inflation_radius는 '얼마나 떨어져 갈 것인가'를 정하므로, 줄이면 좁은
      #   곳에 진입하는 것 자체를 막지 못한다. 갇힘의 원인은 비용 지대의 폭이
      #   아니라 진입 억제력이었다.
      #
      # 2026-07-30: 0.45 -> 0.35으로 내린다. 위 0.38 실패의 근거가 수명을 다했다.
      # 그때의 planner는 SmacPlanner2D(점 로봇)였고, '진입 억제력'이 부족했던 것은
      # planner가 footprint를 안 봤기 때문이다. SmacPlannerHybrid는 padding 포함
      # footprint로 충돌을 검사하므로 진입 차단은 내접반경 0.277 m의 253 밴드가
      # 담당한다. inflation_radius는 이제 순수하게 '이격 선호'만 정한다.
      #
      # 내리는 근거는 실측이다(2026-07-30 Hybrid 주행, analysis/bottleneck_path.py).
      # 방2 -> 화장실에서 직선로(x 2.3~4.8)는 병목 여유가 0.250 m로 내접 0.277 m에
      # 미달해 '물리적으로' 통과 불가다(벽 사이 0.50 m, 협착 y 3.56~3.91). 그래서
      # 로봇은 서쪽으로 우회했고 그것이 정답이었다 — 실주행 7.86 m / 직선 4.02 m
      # = 1.96배. 이 우회는 inflation과 무관하며 고칠 대상이 아니다.
      # 문제는 우회로 '안에서' 30초를 허비한 지점이었다. (1.66, 3.04)의 여유가
      # 0.412 m인데 inflation_radius 0.45면 비용 0인 중앙선이 아예 없어서 DWB가
      # 어느 궤적을 골라도 비용을 물었고 vx=0, wz=±0.02로 진동했다.
      #
      # 그래서 0.35로 내려 주행했더니(2026-07-30 hybrid_infl035) 화장실 구간은
      # 69.3 -> 33.7 s, 최장 정지 9.1 -> 0.8 s로 크게 개선됐지만 안내소 구간이
      # ABORTED로 실패했다. 원인을 세 후보로 분리했다
      # (analysis/why_lethal_under_footprint.py):
      #   (A) planner가 lethal을 지나는 경로를 냈나 -> 39개 전부 여유 >= 0.283.
      #       한 번도 아니다. footprint 인식 planner는 제 일을 했다.
      #   (C) AMCL이 튀었나 -> 물리 최대 속도의 1.5배를 넘는 점프 0회. 아니다.
      #   (B) 로봇이 경로를 벗어났나 -> 횡오차 중앙값 0.045, p95 0.120,
      #       최대 0.164 m. 이것이다.
      # 즉 경로 최소 여유 0.283 m(내접 0.277 위로 0.6 cm)를 오차 12~16 cm로
      # 따라가서 footprint 안에 lethal이 들어왔다. 0.283 - 0.164 = 0.119 m다.
      #
      # 결론: inflation_radius의 실제 역할은 '이격 선호'가 아니라 계획과 실제의
      # 차이를 흡수하는 '추종 오차 완충'이다. footprint_padding과 다르다 --
      # padding은 하드 판정(253)을 키워 통과 가능성 자체를 줄이지만, inflation은
      # 소프트 비용이라 통과는 허용하면서 여유를 번다.
      #
      # 비용 0 지대에서 planner는 경로 길이만 최소화하므로 경로 여유는
      # inflation_radius 근처에 수렴한다. 따라서 필요한 값이 계산된다:
      #   하한 = 내접 0.277 + 추종오차 p95 0.120 = 0.397 m
      #   상한 = 화장실 우회로 최협 여유 0.412 m (넘으면 무비용 중앙선이 사라진다)
      # 창이 1.5 cm뿐이고 0.40이 유일한 값이다. 0.35는 하한 미달이었다.
      # 추종 오차 자체를 줄이는 것(CAN/드라이버 300 ms 지연이 0.26 m/s에서
      # 7.8 cm를 만든다)은 별개 과제다.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # [근거 약함] nav2 기본값 3.0 에서 3.5 로 올렸다. 남은 사유는 아래 한 줄
        # ("2.5는 감쇠가 느려…")뿐이고 날짜·회차·실측 수치가 없다(2026-08-06 확인).
        # 3.5 자체를 정당화한 기록은 없으나, 이 값을 전제로 계산한 비용표가
        # 여러 곳에 있으므로(inflation 0.45 vs 0.55 비교표 등) 바꾸면 그 표들이
        # 전부 무효가 된다. 바꿀 때는 함께 다시 계산할 것.
        cost_scaling_factor: 3.5   # 2.5는 감쇠가 느려 통로 중앙까지 비용이 남았다
        # 2026-07-31: 0.40 -> 0.50 -> 0.45.
        #
        # 0.50 실측(회차 ⑬, clearingonly_infl050): 화장실 29.5 s로 역대 최고,
        # 최장정지 0.5 s. 방2도 47.2 s / 최장정지 0.7 s. "좁은 통로가 비용
        # 지대가 되어 못 지날 것"이라던 예상이 틀렸고, 넓게 도는 쪽이 실제로
        # 더 빨랐다. 안내소 구간만 ABORTED 됐는데 원인은 inflation이 아니라
        # 좌측 후방 4.6 cm의 실제 장애물이었다(AMCL 오차 2.2 cm로 정확했다).
        #
        # 0.45는 그 사이 값이다. 0.50의 이득을 두되 비용 지대 폭을 5 cm 줄인다.
        # 종전 상한 0.412의 근거(우회로 최협 여유)는 ⑬에서 무효가 됐다.
        #
        # 참고: 0.35 -> 0.50에서 global costmap 발행 주기가 0.66 -> 0.67 Hz로
        # 전혀 변하지 않았다. inflation은 이 시스템의 병목이 아니다.
        #
        # 0.40은 "이 통로를 지나되 추종오차를 흡수할 완충을 남긴다"는 값이었고
        # 상한 0.412는 "화장실 우회로 최협 지점에 비용 0인 중앙선이 남아야
        # 한다"는 근거였다. 이번에는 전제가 바뀐다 -- 복구가 필요할 만한 좁은
        # 길은 굳이 지나지 않고, 돌아가더라도 넓은 길을 택하게 한다.
        # 0.50은 최협 여유 0.412를 넘으므로 그 통로 전체가 비용 지대가 되고,
        # planner는 비용 0인 다른 경로가 있으면 그쪽으로 돈다.
        #
        # 알고 안는 위험: 대안 경로가 없으면 그 통로를 여전히 지나야 하는데,
        # 그때는 DWB가 어느 궤적을 골라도 비용을 물어 진동한다(2026-07-30에
        # 0.45로 30초 진동을 실측했다). 복구가 없으므로 그 진동은 곧
        # progress_checker 실패, 즉 주행 종료다. 그 실패 자체가 "이 값에서
        # 이 통로는 못 쓴다"는 측정이다.
        # ── 2026-08-02: 0.45 -> 0.55. 좁은 코너에서 중앙으로 돌게 한다 ──────
        # 사용자 관찰: "좁은 코너를 돌 때 좀 더 중앙으로 돌게 해야 할 것 같다".
        # 0.45 에서는 중앙으로 갈 유인이 아예 없다는 것이 계산으로 확인됐다.
        #
        #   1.0 m 통로(반폭 0.50)에서 중앙 이탈별 비용 (가까운 벽 기준, updateWithMax)
        #      치우침    0.45    0.55
        #        0 cm      0     115
        #        3 cm      0     128
        #        5 cm      0     137
        #       10 cm    163     163
        #
        # 0.45 는 중앙 +-5 cm 가 전부 비용 0 이다. 벽에서 0.45 m 까지 다가가도
        # 공짜라 로봇에게 중앙과 벽 근처가 똑같이 좋다. 0.55 면 연속 구배가 생겨
        # 중앙이 항상 가장 싸다.
        #
        # 통과 가능성은 줄지 않는다. Lattice 의 충돌 판정은 253 이상인데 253 은
        # 내접반경 0.277 m 이내에만 생긴다. inflation_radius 를 올려도 253 밴드는
        # 넓어지지 않는다 - 바뀌는 것은 비용뿐이다.
        #
        # 2026-08-01 에 0.60 이 진동을 만든 것은 **NavFn** 이었다. NavFn 은 비용
        # 회피 가중치가 없어 비용 지대가 넓어지면 최소비용 경로가 동점이 되고
        # LiDAR 노이즈마다 경로가 뒤바뀐다. Lattice 는 cost_penalty 4.0 이 있다.
        #
        # 1.10 m 이상 통로에서는 0.55 로도 중앙 비용이 0 이라 유도가 없다.
        # 즉 이 변경은 1.0 m 급 좁은 곳에서만 작동하고 넓은 곳에는 영향이 없다.
        #
        # **실패 신호**: No valid trajectories 가 두 자릿수로 뛰거나, 꿈틀거림이
        # 재발하면(NavFn 때와 같은 경로 진동) 0.45 로 되돌린다.
        #
        # ── 결과: 0.55 는 통로를 '회피'하게 만들었다. 0.50 으로 내린다 ──────
        # 2026-08-02 run1233 실측. 부딪힘·멈춤은 사라졌으나 원인이 예상과 달랐다.
        #
        #   Goal 성공 3 / 실패 0        (처음으로 전부 성공)
        #   planner 실패 14 -> 0회       좁은 곳을 아예 안 가니 실패할 일이 없다
        #   실제 이동 거리 29.1 -> 36.2 m  같은 코스인데 7.1 m(24 %) 더 걸었다
        #   발행 속도는 그대로           평균 0.188 · p90 0.260 · 최대 0.260 m/s
        #
        # 사용자 보고 "좁은 코너는 아예 안 간다"가 이 거리 증가다. 0.55 는 1.0 m
        # 통로의 중앙마저 비용 115 로 만들어 planner 가 통로 자체를 우회했다.
        # "전체적으로 느리다"는 체감도 속도가 아니라 경로가 길어진 결과다.
        #
        # 0.50 은 그 사이를 노린다. 1.0 m 통로에서
        #   중앙(벽에서 0.50 m)  비용 0     -> planner 가 이 통로를 쓸 수 있다
        #   중앙에서 2 cm 이탈    비용 123   -> controller 가 중앙을 유지한다
        # 즉 '비용 0인 중앙선'을 통로에 남기는 것이 목적이다.
        #
        # [미검증] 이 값은 통로 폭에 민감하다. 실제 폭이 1.00 m 보다 조금이라도
        # 좁으면(0.98 m 등) 중앙도 비용을 물어 0.55 와 같은 회피가 일어난다.
        # 회피가 재발하면 통로 폭을 다시 실측하고 0.48 등으로 미세 조정한다.
        #
        # ── 2026-08-02 최종: 0.50 -> 0.55. 판정 기준이 바뀌었다 ──────────────
        # 사용자 지시: "0.50 은 유턴할 때나 벽 근처에서 회전할 때 이용자가
        # 부딪힐 수 있을 것 같다."
        #
        # 앞서 0.55 를 '실패'로 판정했었다(이동 거리 +24 %, 좁은 통로 회피).
        # 그 판정의 기준은 **로봇이 최단 경로로 통과하는가**였다. 그런데 이
        # 로봇은 뒤에서 시각장애인이 핸들을 잡고 따라온다. 진짜 기준은
        # **사람이 안전하게 따라올 수 있는가**다.
        #
        # 그 기준으로 다시 보면 0.55 의 '실패'가 오히려 요구에 맞는다.
        #   벽에서 더 떨어져 다닌다  -> 회전 시 핸들 끝(뒤 59.5 cm)이 벽·가구를
        #                              쓸 여지가 줄어든다
        #   좁은 통로를 우회한다     -> 사람이 낄 공간이 없는 곳을 피한다
        #   이동 거리 +24 %          -> 안전을 위한 비용으로 받아들인다
        #
        # 같은 날 padding 실험에서도 같은 방향이 나왔다. padding 을 줄이면
        # planner 가 큰 호를 골라 유턴 반경이 커지고, 사람이 그만큼 많이
        # 움직여야 해 위험하다. 로봇에게 편한 경로가 사람에게 편한 경로가 아니다.
        #
        # 0.55 실측(run1233): Goal 성공 3 / 실패 0, planner lethal space 0회,
        # 발행 속도는 다른 회차와 동일(평균 0.188 · 최대 0.260 m/s).
        # 정지 비율은 13.2 -> 3.7 % 로 오히려 줄었다.
        #
        # **되돌릴 조건**: 꼭 지나야 하는 목적지가 우회로 없는 좁은 통로 안에
        # 있을 때. 그때는 그 통로를 못 써 도달 자체가 불가능해진다.
        #
        # ** controller 를 바꾸기 전에 반드시 읽을 것 **
        # 이 값 0.55 는 padding 포함 외접반경 0.6506 m 보다 짧다. 그래서 Smac 의
        # GridCollisionChecker 는 벽에서 0.55~0.651 m 구간(폭 0.10 m)에서
        # footprint 검사를 건너뛴다 — planner 단계의 사각지대다.
        # 지금 이것을 막는 것은 DWB 의 ObstacleFootprint critic 하나뿐이고,
        # MPPI 등 potential-field 최적화를 쓰는 controller 로 바꾸면 그 방벽이
        # 사라진다. 바꾸려면 먼저 이 값을 0.651 이상으로 올려야 한다.
        # 계산 근거와 이를 강제하는 계약 테스트 초안:
        #   devlog/2026-08-05-inflation-외접반경-검증.md (5절 · 8절)
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      # local_costmap과 동일한 실측 footprint. 두 costmap이 다르면 planner가 통과
      # 가능하다고 본 경로를 controller가 거부한다(근거는 local_costmap 주석 참고).
      # 2026-08-02: local 과 같은 육각형. 두 costmap 은 반드시 같은 footprint 를
      # 써야 한다(test_local_and_global_costmap_use_the_same_footprint).
      # 2026-08-13: 하드웨어 실측 갱신(손잡이 29 -> 19 cm). 근거는 local 쪽 주석.
      footprint: "[[0.305, 0.225], [0.305, -0.225], [-0.305, -0.225], [-0.495, -0.035], [-0.495, 0.035], [-0.305, 0.225]]"
      # 2026-08-02: local 과 같은 값(0.05). 근거는 local 쪽 주석 참고.
      footprint_padding: 0.05
      # robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      # nvblox_layer를 global에도 넣는다(2026-07-30). 그전에는 local에만 있었고,
      # 그래서 planner는 카메라만 보는 장애물에 완전히 눈이 멀어 있었다.
      #
      # 근거 1 — LiDAR 평면 아래 장애물. laser_frame은 지면 0.382 m다. 사선
      #   책상다리처럼 그 아래에서 올라오는 구조물은 obstacle_layer(scan)가 못 본다.
      #   nvblox의 esdf slice만 본다. planner가 그것을 모르면 통과 가능한 경로를
      #   내고 DWB가 전부 거부해 로봇이 굳는다.
      #
      # 근거 2 — 2D 레이트레이싱의 깜빡임. 2026-07-30 안내소 구간에서 산업용
      #   청소기(거울면 스테인리스 드럼)가 global costmap에서 사라졌다 나타났다 했다.
      #     구간 직전 t-42s ~ t-24s : LETHAL 0, INSCRIBED 0 (18초간 완전 소실)
      #     구간 시작 t+1.9 ~ t+6.9 : LETHAL 0 (계획 시점에 장애물이 없었다)
      #     t+8.0s                  : LETHAL 4 (뒤늦게 등장)
      #     t+14.0s                 : DWB 유효 궤적 없음 — 이미 8 mm까지 접근
      #   곡면 금속에 사각 입사한 빔은 반사가 안 돌아오고, observation_persistence
      #   0.5 s라 0.5초만 놓치면 마크가 지워진다. nvblox는 TSDF에 누적하므로
      #   이 깜빡임에 훨씬 강하다.
      #
      # 위험 — 동적 환경. 이 플러그인은 updateWithMax만 하고 자체 소거가 없다.
      #   지나간 사람이 nvblox TSDF에 남아 있는 동안 global costmap에 유령으로
      #   남아 1 Hz 재계획이 흔들릴 수 있다. 다만 (a) mapping_type: static_tsdf +
      #   decay_tsdf_rate_hz 2.5로 소거가 돌고, (b) LayeredCostmap이 매 주기
      #   master를 리셋한 뒤 레이어를 다시 씌우므로 영구 누적은 없다.
      #   사람 많은 공공장소 주행에서 재검증이 필요하다(guideline/vica_scenario.md).
      #
      # 2026-07-30 A/B 결과로 확정: global에 nvblox_layer를 둔다.
      #
      # 한 번 빼고 같은 사람 조건에서 재봤다(⑨). 예민함은 예상대로 사라졌지만
      # 결과가 나빠졌다 -- 가설이 정확히 반대였다.
      #                     완주  평균LETHAL  유령p95  lethal space  DWB무효
      #   ③ 없음 사람없음    2/3      2954     9.0s        2          62
      #   ④ 있음 사람없음    3/3      7164    46.0s        1           4
      #   ⑧ 있음 사람있음    2/3      6865    45.0s       16           1
      #   ⑨ 없음 사람있음    1/3      2891     8.0s       29           9
      # LETHAL이 2.4배 줄고 유령이 45 -> 8 s가 됐는데 lethal space는 16 -> 29회로
      # 늘고 완주가 2/3 -> 1/3이 됐다. 사람 없는 조건에서도 같은 방향이다
      # (③의 DWB 무효 62회 = ④의 15배).
      #
      # 기전: global이 장애물을 늦게 알면 planner가 사람 있는 자리로 경로를 낸다.
      # 로봇이 도착할 때쯤 LiDAR가 마크하면 이미 그 자리에 서 있고, 그것이
      # "Starting point in lethal space"다. nvblox가 있으면 planner가 미리 보고
      # 넓게 우회해 그 자리에 애초에 들어가지 않는다.
      # 즉 평균 LETHAL 2.4배는 비용이 아니라 '미리 보는 것'의 값이다.
      #
      # 예민함을 줄이려는 시도는 전부 막혔다:
      #   convert_to_binary_costmap: False -> 253 밴드와 경사가 추가되어 더 예민해진다
      #   esdf_slice_max_height 낮춤       -> 로봇 최고점 0.86 m 보호를 잃는다
      # 2026-07-30 재제거: 사용자 지시. A/B(⑨)에서 빼면 나빠졌지만(2/3 -> 1/3),
      # 그 실패의 성격이 이후 규명됐다. nvblox 유무가 아니라 '지도-실제 불일치'였다:
      #   방2 -> 화장실  지도에는 있고 실주행에는 없던 장애물. global은 그것을 피해
      #     경로를 냈지만 local은 비어 있어 DWB가 벽에 붙어 갔고, 결국 지도에 고정된
      #     장애물의 inflation에 걸려 lethal 판정 -> 탈출 불가.
      #   화장실 -> 안내소  지도에도 있고 실제로도 있던 코너 장애물에 부딪힘. 별개 문제.
      # 전자는 지도를 고쳐야 하는 문제라 nvblox로 해결되지 않는다. 다음 주행 전에
      # 지도에 실제 장애물을 채워 넣을 예정이다.
      #
      # nvblox_layer 블록은 남겨 둔다. plugins에 없으면 로드되지 않아 무해하고
      # 한 줄로 되돌릴 수 있다. local에는 그대로 있다(LiDAR 평면 0.382 m 아래를
      # 볼 유일한 수단).
      # ===== 2026-08-16: nvblox_layer 를 global 에 다시 넣는다 =====
      #
      # 위 주석이 예고한 증상이 그대로 재현됐다. run22 를 odom 이동거리로 재니
      # (로그가 아니라 바퀴가 실제로 간 거리 기준, 1초에 3 cm 미만 = 멈춤)
      # 주행 중 정체가 6건이었고 가장 긴 두 건이 이것이었다:
      #
      #   +256~286  30.0초  앞 0.52~1.56 m  경로재작성 29회
      #             GridBased: ... Starting point in lethal space
      #   +204~225  21.0초  앞 1.08~3.12 m  경로재작성 19회   (같은 문구)
      #
      # **앞이 1.5~3.1 m 나 비어 있는데 못 간다.** 위 기전 그대로다 - global 이
      # 늦게 알아서 planner 가 그 자리로 경로를 냈고, 도착하니 이미 lethal 이었다.
      #
      # 2026-07-30 에 뺀 진짜 이유는 nvblox static 에 사람이 유령으로 남는
      # 것이었다. **그 전제가 2026-08-16 에 무너졌다.** human 모드 실측:
      #
      #   1 m    검출 100 %  -> dynamic 행 (static 에 안 들어감)
      #   0.6 m  검출  93 %  -> dynamic 행
      #   코앞    검출   0 %  -> static 행. 다만 비킨 뒤 1.1초면 지워진다
      #
      # 유령이 안 남으므로 반대 근거가 사라졌다. 그래서 되돌린다.
      #
      # ===== 2026-08-16 즉시 되돌림. 이 축은 닫는다 =====
      #
      # 위 판단으로 넣고 한 회차를 돌렸다(run23). **크게 나빠졌다.**
      #
      #                        run22(309초, 없음)   run23(211초, 있음)
      #   planner 시작점 lethal        6회      ->    146회    24배
      #   planner 경로 실패           17회      ->    161회     9배
      #   복구 동작                    2회      ->     37회    18배
      #
      # 주행 시간이 2/3 로 짧은데도 이렇다. 시간으로 보정하면 35배다. 그리고
      # +93초부터 기록 끝까지 **118초를 한 번도 못 나아갔다**(odom 이동거리
      # 기준). 회복하지 못했다. 사용자 관찰도 같다 - "출발 지체 및 못 가는
      # 상황이 늘어났다".
      #
      # 바닥 오인은 아니었다. 기동 직후 global costmap 은 통과불가 10.1 % ·
      # 자유 83.8 % 로 정상이었다. 즉 지도가 망가진 게 아니라, **카메라가 본
      # 것까지 더해지니 planner 가 통과 가능하다고 볼 자리가 남지 않았다.**
      # 2026-07-30 주석이 말한 "평균 LETHAL 2.4배"의 실제 대가가 이것이다.
      #
      # [이 축을 다시 열려면] 먼저 통로 여유를 확보해야 한다. 지금 실측
      # 통로가 1.5 m 이고 로봇 요구 여유가 (반폭 0.275 + 내접 0.277) x 2 =
      # 1.10 m 라 남는 게 0.4 m 뿐이다. 카메라가 조금만 더 찍으면 사라진다.
      # 파라미터로 넘을 수 있는 크기가 아니다.
      #
      # nvblox_layer 블록은 남겨 둔다. plugins 에 없으면 로드되지 않아 무해하다.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        # local은 odom, global은 map이다. 각 costmap의 global_frame과 반드시
        # 같아야 한다. 슬라이스는 odom frame으로 오므로 값이 다르면 플러그인이
        # tf_buffer_->lookupTransform(nav2_costmap_global_frame, slice_frame)으로
        # 변환한다(nvblox_costmap_layer.cpp 238~250행). map<-odom은 AMCL이 발행한다.
        nav2_costmap_global_frame: map
        # local_costmap과 같은 슬라이스를 쓴다. human 모드에서는 마스크가 사람을
        # 전경(사람 전용 mapper)으로 보내므로 이 슬라이스에 사람이 거의 안 들어간다.
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # 아래 네 값은 local_costmap 과 같아야 한다(그쪽 주석에 [근거 없음]
          # 표식과 판단 재료를 적어 뒀다). 다르면 planner 가 통과 가능하다고 본
          # 경로를 controller 가 거부한다.
          raytrace_max_range: 3.5
          raytrace_min_range: 0.05
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          # local_costmap과 같은 값이어야 한다. 다르면 planner가 통과 가능하다고
          # 본 경로를 controller가 거부한다(근거는 local_costmap 주석 참고).
          observation_persistence: 0.5
          # [근거 없음] 둘 다 nav2 기본값(0.0 / false)에서 바뀌었으나 경위가
          # 기록돼 있지 않다(2026-08-06 확인).
          #   expected_update_rate 0.2 = "5 Hz 보다 느리면 이 관측원을 stale로 본다".
          #     stale이 되면 costmap이 isCurrent()=false가 되는데, Nav2가 그때
          #     로봇을 멈추는지 자체가 [미검증]이다
          #     (devlog/2026-07-30-nvblox-ghost-obstacle.md:63).
          #   inf_is_valid true = LiDAR의 inf(반사 없음)를 range_max로 바꿔
          #     raytrace 소거에 쓴다. false면 빈 공간이 지워지지 않는다.
          expected_update_rate: 0.2
          inf_is_valid: true

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # local_costmap과 동일하게 유지한다(근거는 local_costmap 주석 참고).
      # 전역 경로를 중앙으로 미는 것이 코너 붙음의 1차 해결책이므로 global 쪽이
      # 특히 중요하다. DWB는 PathDist/PathAlign(32.0)로 이 경로를 충실히 따른다.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # local_costmap 과 같은 값이어야 한다(그쪽 주석에 [근거 약함] 표식이 있다).
        cost_scaling_factor: 3.5
        # 2026-07-31: 0.40 -> 0.50 -> 0.45.
        #
        # 0.50 실측(회차 ⑬, clearingonly_infl050): 화장실 29.5 s로 역대 최고,
        # 최장정지 0.5 s. 방2도 47.2 s / 최장정지 0.7 s. "좁은 통로가 비용
        # 지대가 되어 못 지날 것"이라던 예상이 틀렸고, 넓게 도는 쪽이 실제로
        # 더 빨랐다. 안내소 구간만 ABORTED 됐는데 원인은 inflation이 아니라
        # 좌측 후방 4.6 cm의 실제 장애물이었다(AMCL 오차 2.2 cm로 정확했다).
        #
        # 0.45는 그 사이 값이다. 0.50의 이득을 두되 비용 지대 폭을 5 cm 줄인다.
        # 종전 상한 0.412의 근거(우회로 최협 여유)는 ⑬에서 무효가 됐다.
        #
        # 참고: 0.35 -> 0.50에서 global costmap 발행 주기가 0.66 -> 0.67 Hz로
        # 전혀 변하지 않았다. inflation은 이 시스템의 병목이 아니다.
        #
        # 0.40은 "이 통로를 지나되 추종오차를 흡수할 완충을 남긴다"는 값이었고
        # 상한 0.412는 "화장실 우회로 최협 지점에 비용 0인 중앙선이 남아야
        # 한다"는 근거였다. 이번에는 전제가 바뀐다 -- 복구가 필요할 만한 좁은
        # 길은 굳이 지나지 않고, 돌아가더라도 넓은 길을 택하게 한다.
        # 0.50은 최협 여유 0.412를 넘으므로 그 통로 전체가 비용 지대가 되고,
        # planner는 비용 0인 다른 경로가 있으면 그쪽으로 돈다.
        #
        # 알고 안는 위험: 대안 경로가 없으면 그 통로를 여전히 지나야 하는데,
        # 그때는 DWB가 어느 궤적을 골라도 비용을 물어 진동한다(2026-07-30에
        # 0.45로 30초 진동을 실측했다). 복구가 없으므로 그 진동은 곧
        # progress_checker 실패,即 주행 종료다. 그 실패 자체가 "이 값에서
        # 이 통로는 못 쓴다"는 측정이다.
        # 2026-08-02: 0.45 -> 0.55. local 쪽 주석의 계산과 동일한 근거다.
        # 두 costmap 의 inflation 은 같게 유지한다 - 다르면 planner 가 낸 경로를
        # controller 가 다른 비용으로 읽어 판단이 갈린다.
        # 2026-08-02 최종: 0.55. 사람이 따라오는 안전 기준으로 재판정했다
        # (local 쪽 주석 참고). 두 costmap 의 inflation 은 같게 유지한다.
        #
        # 2026-08-06: 이 값이 외접반경 0.6506 m 보다 짧아 planner 충돌 검사에
        # 폭 0.10 m 의 사각지대가 있다. controller 를 MPPI 등으로 바꾸기 전에
        # 0.651 이상으로 올려야 한다 — 계산은 local 쪽 같은 항목의 주석과
        # devlog/2026-08-05-inflation-외접반경-검증.md 에 있다.
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # 20 -> 5. 당시 사유는 "hybrid 쓰면 노이즈 로그가 많아서"였다.
    # [근거 없음] planner는 그 뒤 Lattice로 바뀌었고(아래 planner_plugins),
    # 5.0이 지금도 맞는 값인지는 재확인되지 않았다. 이 파라미터는 계획이 이
    # 주기보다 느릴 때 경고 로그만 낸다 — 실제 계획 주기는 BT의
    # RateController(1.0 Hz)가 정하므로 값을 바꿔도 주행은 변하지 않는다.
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    # NavFn(gradient descent)은 비용이 거의 같은 셀 사이에서 경로가 진동한다.
    # 2026-07-28 실측: 서행 7회가 전부 '앞 경로가 굽은' 지점이었고, 앞 1 m
    # 누적 꺾임이 31~2639도였다(2639도는 1 m 안에서 7바퀴 도는 값이다).
    # 앞 1.5 m가 10도 미만으로 곧은 명령은 5018개 중 123개(2.5 %)뿐이라,
    # 실제 복도가 직선인데도 로봇이 계속 미세 조향을 강요받았다. 직진 구간의
    # 실제 wz 표준편차 0.1273 rad/s는 max_vel_theta 0.4의 32 %다.
    #
    # SmacPlanner2D는 A* 기반이고 cost_travel_multiplier로 비용을 적극 반영하며
    # collision-aware smoother를 planner 내부에 갖는다. BT의 planner_id가
    # 'GridBased'로 같아 plugin 교체만으로 바뀌고 되돌리기도 한 줄이다.
    #
    # 2026-07-30: SmacPlanner2D도 걷어낸다. NavFn과 마찬가지로 로봇을 '점'으로
    # 보기 때문이다. 기계어 확인 결과
    #   Node2D::isNodeValid     -> inCollision(unsigned int index, bool)
    #   NodeHybrid::isNodeValid -> inCollision(float x, float y, float theta, bool)
    # 앞은 셀 하나, 뒤는 padding 포함 footprint 전체를 본다. DWB의
    # ObstacleFootprint도 footprint 전체를 보므로, 2D를 쓰면 planner가 통과
    # 가능으로 만든 경로를 controller가 거부한다. 맵 free 영역 106.4 m2에서
    # planner 74.9 % vs controller 42.0 %로 32.9 %p가 벌어졌고
    # (analysis/rotatable_area.py), 2026-07-28~29 주행에서 통로 한가운데
    # 20초 이상 갇히는 형태로 나타났다. footprint 3.3 cm 보정으로는 이 격차의
    # 6.1 %만 줄어든다. planner 자체를 바꿔야 한다.
    #
    # 되돌리려면 아래를 원복한다:
    #   plugin: "nav2_smac_planner/SmacPlanner2D"
    #   tolerance: 0.2 / cost_travel_multiplier: 3.0
    #   use_final_approach_orientation: false
    #   (Hybrid 전용 키 motion_model_for_search / minimum_turning_radius /
    #    angle_quantization_bins / cost_penalty 는 함께 지운다)
    #
    # ---------------------------------------------------------------------
    # A/B 비교 방법
    #   아래 두 블록의 '키 이름만' 서로 바꾼다(GridBased <-> GridBasedLattice).
    #   planner_plugins에 있는 이름만 Nav2가 로드하므로, 켜지지 않은 블록은
    #   파라미터로만 남고 아무 일도 하지 않는다.
    #   두 블록이 공유 가능한 값(tolerance, cost_penalty 등)은 반드시 같게
    #   유지한다. test_planner_contract.py가 이를 검사한다 — 한 번에 한
    #   변수만 바꾼다는 원칙이 A/B의 전제다.
    # ---------------------------------------------------------------------
    # 2026-07-30 planner 축 전환: Hybrid <-> Lattice. 아래 두 블록의 키 이름만
    # 서로 바꿨다(활성 블록은 planner_plugins의 "GridBased" 하나뿐이다).
    #
    # 전환 이유: 오늘 9회 주행을 전부 nvblox/costmap 축으로 썼는데 안내소 구간이
    # 네 회차 연속 실패했다(③·⑧·⑨ ABORTED, ④만 성공 -- 그때는 사람이 없었다).
    # nvblox 유무와 무관하고 사람이 있으면 항상 실패하므로 다른 축을 봐야 한다.
    #
    # Lattice가 이 실패에 맞는 근거: 갇힌 지점 (1.96, 2.96)에서 자세별로 padded
    # footprint 외곽선을 지도에 훑으면
    #   yaw 0/45/90/135/180/315°  지도 점유 0개   <- 합법
    #   yaw 225°                  지도 점유 3개
    #   yaw 270°                  지도 점유 4개
    # 같은 자리에서 방향만 바꾸면 합법이 된다. Hybrid(DUBIN)는 제자리 회전
    # primitive가 없어 반경 0.5 m 호로만 방향을 바꾸는데 좁은 곳에서 그 호가
    # 들어가지 않는다. diff 격자에는 제자리 회전이 112개 중 32개 있다.
    #
    # 한계: "Starting point in lethal space"는 시작 자세 자체가 불법일 때 나오고
    # 그때는 어떤 planner도 경로를 못 낸다. Lattice의 기대는 '경로 모양이 달라
    # 애초에 그 자세에 들어가지 않는 것'이다.
    #
    # ===== 비교용 대안. planner_plugins에 없으므로 Nav2가 로드하지 않는다 =====
    # A/B 를 하려면 이 키(GridBasedAlt)와 아래 활성 블록의 키(GridBased)를
    # 서로 바꾼다. 그때 이 헤더 주석도 함께 옮길 것 — 2026-08-06 이전에는
    # 옮기지 않아 두 헤더가 서로 반대 블록에 붙어 있었다.
    GridBasedAlt:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      # --- 핵심 1: 후진을 경로 단계에서 없앤다 ---
      # 실주행에서는 핸들 뒤에 사람이 따라온다(guideline/vica_scenario.md).
      # DUBIN 경로는 정의상 '전진 호 + 직선'이라 후진 primitive가 없다.
      # REEDS_SHEPP은 후진을 포함하므로 reverse_penalty를 아무리 올려도
      # 후진 세그먼트가 나올 수 있어 쓰지 않는다. DWB의 min_vel_x: 0.0에만
      # 맡기면 planner가 낸 후진 경로를 controller가 못 따라가는, 지금 고치려는
      # 것과 같은 종류의 불일치가 다시 생긴다.
      motion_model_for_search: "DUBIN"

      # --- 핵심 2: 최소 회전 반경 ---
      # 90° L자 코너를 반경 R의 호로 돌 때 필요한 통로 폭을 padded footprint
      # 스윕으로 구했다(analysis/turning_radius_detail.py). R이 작을수록 더
      # 넓은 통로가 필요하다 — 급히 꺾으면 후방 0.615 m가 회전 중심 반대편으로
      # 휘둘려 '진입 통로의 외벽'을 넘는다(위반 코너는 항상 후방 우측이다).
      #   R 0.20 -> 1.160 m 필요   실측 최협 1.10 m에서 불가
      #   R 0.30 -> 1.090 m        여유 1 cm, AMCL 오차 하나로 무효
      #   R 0.50 -> 0.985 m        여유 11.5 cm  <- 채택
      #   R 0.60 -> 0.945 m        여유 15.5 cm, 코너 이득 4 cm뿐인데
      #                            180° 되돌기 필요폭이 1.85 -> 2.02 m로 늘어난다
      # 방2 -> 화장실 최협 통로 1.10 m 실측(2026-07-30) 기준이다.
      # 0.50은 설치된 diff 격자의 turning_radius와도 같아, 아래 Lattice 블록으로
      # 갈아탈 때 회전 거동이 그대로 이어진다.
      minimum_turning_radius: 0.50

      # --- 핵심 3: 장애물에서 떨어지려는 세기 ---
      # SmacPlanner2D의 cost_travel_multiplier와 같은 역할이다. 둘 다 기본
      # 2.0인데 벽에 붙는 경향 때문에 3.0으로 올려 뒀다. 여기서 기본값으로
      # 되돌리면 '장애물에서 떨어져 간다'는 원래 목적을 잃는다. 첫 튜닝 노브다.
      #
      # 2026-07-30: 3.0 -> 4.0. inflation_radius와 역할이 다르다.
      #   inflation_radius = 비용이 '어디에' 있는가 (완충 폭)
      #   cost_penalty     = 그 비용을 '얼마나 세게' 피하는가
      # 0.35 주행에서 경로 최소 여유가 0.283 m로 비용 밴드(0.277~0.35) 바닥에
      # 붙어 있었다. cost_penalty를 올리면 같은 밴드 안에서 경로를 바깥쪽으로
      # 밀어 실제 경로 여유를 inflation_radius에 더 가깝게 만든다. 무비용
      # 중앙선이 이미 있는 통로(화장실 우회로)에서는 비용이 0이라 영향이 없어,
      # 좁은 협착부만 개선하고 정체 해소는 그대로 유지한다.
      cost_penalty: 4.0

      # --- 핵심 4: 연산량 ---
      # 맵 해상도 0.05 m는 이미 거칠다. downsampling_factor 2면 셀이 0.10 m가
      # 되어 최협 통로(반폭 0.35 m)를 통과 불가로 오판할 수 있다.
      downsample_costmap: false
      downsampling_factor: 1
      # Hybrid는 (x, y, theta) 3차원을 탐색하므로 이 값이 메모리와 탐색 시간을
      # 직접 정한다.
      #
      # 5° 분해능.
      #
      # 2026-07-30에 36(10°)으로 내렸다가 되돌렸다. 근거가 오독이었다.
      # "계획 시간 중앙값 265 -> 832 ms"로 읽었는데, 그 중앙값은 0.2 s를 넘긴
      # 계획만의 중앙값이고 표본 수가 12개 vs 5개로 달라 서로 다른 모집단이었다.
      # 실제 초과율은 이렇다(경고 수 / /plan 발행 수):
      #   inflation 0.45                 32/196 = 16.3 %
      #   inflation 0.40                 12/ 94 = 12.8 %
      #   0.40 + nvblox global (bins 72)  5/129 =  3.9 %   <- 오히려 개선
      #   bins 36                         2/ 68 =  2.9 %   <- 추가 이득 미미
      # nvblox를 global에 넣은 것은 계획을 느리게 하지 않았고, bins 36의 이득은
      # 1 %p뿐이었다. 근거 없는 변경이므로 기본값으로 되돌린다.
      angle_quantization_bins: 72
      # 같은 목적지로 1 Hz 재계획이 반복되므로 obstacle heuristic 캐시가 유효하다.
      # Orin NX에서 Hybrid 탐색 시간을 줄이는 가장 큰 수단이다.
      cache_obstacle_heuristic: true

      # [근거 없음] nav2 기본값 0.5 에서 0.2 로 줄인 경위가 기록돼 있지 않다
      # (2026-08-06 확인). goal 에 정확히 못 닿을 때 이 반경 안의 대체 지점을
      # 허용한다는 뜻이라, 줄이면 "경로 없음"이 늘고 키우면 목표에서 먼 곳에
      # 도착한다. 두 planner 블록이 같은 값이어야 한다(A/B 전제).
      tolerance: 0.2
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      # 기본 BT의 ComputePathToPose는 RateController 1.0 Hz 아래에 있다. 이
      # 예산을 넘기면 controller가 그만큼 낡은 경로를 따라간다. 2D는 0.5로도
      # 충분했지만 Hybrid는 3차원 탐색이라 여유를 준다. Orin NX 실측 후 조정한다.
      max_planning_time: 1.0

      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

    # ===== 활성 planner. planner_plugins: ["GridBased"] 가 이 블록을 로드한다 =====
    # (2026-08-06 주석 정정: 여기 "비교용 대안. Nav2가 로드하지 않는다"가 붙어
    #  있었다. A/B 스왑으로 키 이름만 바꾸면서 헤더를 옮기지 않은 결과다.
    #  비활성 블록은 위쪽 GridBasedAlt 다.)
    #
    # Hybrid(DUBIN)의 구조적 한계는 제자리 회전이 없다는 것이다. 목표가 뒤쪽에
    # 있으면 반경 0.50 m 호로 180° 되돌아야 하는데 그러려면 통로 폭 1.85 m가
    # 필요하다. 맵 통로 폭 중앙값 1.40 m, 최협 1.10 m라 어느 통로에서도 불가라서
    # planner가 경로를 못 찾고 BT recovery(Spin)로 넘어간다. 복구 예산 실측은
    # 19.0 s 중 Wait이 15.0 s였다 — 정상 경로가 아니라 매번 손실이다.
    #
    # SmacPlannerLattice는 미리 생성된 motion primitive를 쓰고, Humble에 이미
    # 들어 있는 diff 격자(112개 중 제자리 회전 32개)가 차동구동 전용이다.
    # 충돌 검사는 Hybrid와 같다(NodeLattice::isNodeValid -> footprint 버전).
    # 대가는 회전 반경이 격자에 고정(0.5 m)되고 방향 분해능이 16 headings
    # (22.5°)로 거칠다는 점이다. 0.5 m는 위 계산의 채택값과 같고, 방향
    # 분해능은 DWB가 추종하면서 메꾼다.
    #
    # Lattice에는 Hybrid의 minimum_turning_radius / angle_quantization_bins /
    # motion_model_for_search / downsample_costmap 파라미터가 없다
    # (libnav2_smac_planner_lattice.so 확인). 격자 파일 metadata가 대신 정한다.
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"

      # nav2 기본값은 ackermann 격자다. VICA는 차동구동이라 diff를 써야 하고,
      # grid_resolution 0.05가 costmap resolution과 같아야 primitive 끝점이
      # 셀 경계에 맞는다.
      #
      # ── 2026-08-02: 0.5m -> 1m 회전 반경 격자 ──────────────────────────
      # 실주행에서 "1 m 폭 구간에서 코너를 돌아 빠져나올 때 못 나오고 같은
      # 자리에서 계속 멈춘다"는 보고를 받았다. 그 회차 planner 실패 14회가
      # 전부 "Starting point in lethal space" 였다.
      #
      # 원인은 회전 반경이다. 90도 L자 코너를 반경 R 의 호로 돌 때 필요한 통로
      # 폭을 padded footprint 스윕으로 구하면 이렇다(test_planner_contract 의
      # _min_corner_width 로 계산):
      #
      #     R 0.0 m(제자리)  1.350 m 필요    R 0.5 m   0.990 m   여유 +1 cm
      #     R 0.2 m          1.160 m         R 0.6 m   0.950 m   여유 +5 cm
      #     R 0.3 m          1.090 m         R 0.8 m   0.890 m   여유 +11 cm
      #                                      R 1.0 m   0.860 m   여유 +14 cm
      #
      # 직관과 반대로 **반경이 클수록 좁은 코너를 더 잘 지난다.** 급히 꺾으면
      # 회전 중심 뒤쪽 0.615 m 가 크게 휘둘리고, 완만히 돌면 차체가 앞으로
      # 나가면서 돌아 스윕 폭이 줄기 때문이다(외접반경 0.675 m, 앞 0.355 /
      # 뒤 0.615 로 뒤가 1.73배 길다).
      #
      # 0.5 m 격자의 여유는 1 cm 다. 벽 요철·AMCL 오차 중 하나만 있어도 실패한다.
      # 1 m 격자는 여유가 14 cm 로 14배가 된다.
      #
      # **제자리 회전 능력은 유지된다.** 두 격자의 primitive 를 세어 확인했다:
      #     0.5m 격자  112개 중 제자리 회전 32개
      #     1m   격자   96개 중 제자리 회전 32개
      # 좁은 곳에서 방향을 못 바꾸게 되는 것이 아니다. 넓은 곳에서는 그대로
      # 제자리로 돌고, 좁은 코너에서만 완만한 호를 쓴다.
      #
      # 대가: 코너 진입에 더 넓은 여유가 필요하다. 완만히 돌려면 미리 바깥으로
      # 벌어져야 하는데 코너 앞이 좁으면 그 공간이 없어 경로를 못 낼 수 있다.
      # primitive 가 112 -> 96개로 줄어 planner 계산은 오히려 가벼워진다.
      #
      # **실패 신호**: planner "Starting point in lethal space" 가 여전히 두
      # 자릿수면 반경으로는 못 푸는 것이다. 그때는 footprint_padding 축소나
      # 하드웨어(후방 오버행 21 cm 단축)로 넘어간다.
      #
      # ── 결과: 1m 격자 실패. 0.5m 로 되돌린다 (2026-08-02 실주행) ────────
      # 사용자 보고:
      #   "좁은 길은 아예 안 가고 우회하려고만 한다"
      #   "도는 반경이 넓어야 해서 제자리 회전을 거의 못 한다"
      #   "유턴할 때 공간을 너무 많이 써서, 원래 잘 유턴해서 나오던 곳도 못
      #    나온다. 복구 행동하려다 멈춰서 원격 주행 명령을 줘도 못 간다"
      #   "직진 구간에서도 좌우로 움직인다"
      #
      # 마지막 항목이 결정적이다. 격자가 크면 직진조차 큰 호를 이어붙여
      # 근사하게 되어 곧은 길에서도 좌우로 흔들린다. primitive 96개가 모두
      # 반경 1 m 기반이라 '거의 직선'을 만들 수단이 줄어든 것이다.
      #
      # 위 계산표가 놓친 것이 있다. _min_corner_width 는 **코너를 도는 순간의
      # 스윕**만 잰다. 반경 1 m 의 호에 올라타려면 그 전에 바깥쪽으로 미리
      # 벌어져야 하는데, 그 **진입 여유**는 계산에 들어있지 않다. 실내 좁은
      # 공간에는 그 여유가 없어서 planner 가 아예 다른 길을 골랐다.
      #
      # 제자리 회전 primitive 는 32개로 같았지만, 격자가 커지면 그 32개로
      # 이어붙일 수 있는 경로도 줄어든다. primitive 개수가 능력을 보장하지
      # 않는다 - 이것도 사전 계산이 놓친 부분이다.
      #
      # **교훈: 회전 반경은 이 문제의 축이 아니다.** 0.5m 는 코너 스윕 여유가
      # 1 cm 로 아슬아슬하지만, 1m 는 진입 자체를 못 한다. 두 실패는 방향이
      # 반대이고 사이에 앉힐 값이 없다(ObstacleFootprint.scale 때와 같은 구조).
      # 다음 축은 footprint 를 줄이는 쪽이다(padding 축소 또는 하드웨어).
      #
      # 되돌리려면 경로의 0.5m 를 1m 로 바꾼다. 다른 값은 건드리지 않았다
      # (실험 당시 inflation 0.50 · sim_time 2.5 · ObstacleFootprint.scale 0.15).
      # 주의: inflation 은 같은 날 늦게 0.50 -> 0.55 로 확정됐다. 현재 값은
      # 0.55 이며 이 문단의 0.50 은 1m 격자 실험 시점의 기록이다.
      lattice_filepath: "/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"

      # 후진 primitive로 확장하지 않는다. 위 DUBIN과 같은 이유다.
      allow_reverse_expansion: false
      # 제자리 회전 primitive에 붙는 비용. 낮추면 아무 데서나 돌고, 높이면
      # 되돌아서야 할 곳에서도 호로 우회한다. 이 값이 Lattice의 주 노브다.
      # [근거 없음] 왜 5.0 인지 적힌 곳이 없고, 다른 값을 시험한 기록도 없다
      # (2026-08-06 확인). "주 노브"라고 적어 두고 한 번도 돌려보지 않은
      # 항목이므로, 유턴·좁은 통로 문제를 다시 볼 때 1순위 후보다.
      # (Humble 의 Lattice 기본값이 얼마인지는 소스가 설치돼 있지 않아 이
      #  장비에서 확인하지 못했다.)
      rotation_penalty: 5.0

      # 아래는 위 GridBasedAlt 블록과 반드시 같은 값을 유지한다(A/B 전제).
      # (2026-08-06 정정: "위 GridBased 블록"이라 적혀 있었으나 여기가 곧
      #  GridBased 블록이라 자기 자신을 가리키는 문장이었다.)
      cost_penalty: 4.0
      cache_obstacle_heuristic: true
      tolerance: 0.2
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0

      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    # 2026-08-01: Spin 복구 회전을 주행 중 회전과 같은 속도로 맞춘다.
    # "도착 직전 천천히 가다가 훽 돌아버린다"는 실주행 보고 때문이다. 낙차를
    # 재보면 슬로우스탑 40 % 구간이 0.16 rad/s(9도/초)인데 Spin은 1.0(57도/초)로
    # 6.3배였다.
    #
    # min도 함께 내린다. spin.cpp가 clamp(sqrt(2*acc*remaining), min, max)이므로
    # min이 0.4로 남으면 남은 각도와 무관하게 늘 0.4가 나와 끝의 감속 곡선이
    # 사라진다.
    #
    # 대가는 0.30 rad Spin 한 번에 0.39 -> 0.75초다. RoundRobin 6회에서 Spin은
    # 2회뿐이라 총 0.7초 손해다.
    #
    # planner 비교와 무관한 공통 항목이다. NavFn 쪽 브랜치와 같은 값을 쓴다.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.15
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 2026-08-13: 직선 0.26 -> 0.5 (사용자 요구). 회전 1.0 은 그대로 둔다 —
    # DWB 는 자체 max_vel_theta(0.4)를 갖고 있어 여기가 회전 상한이 아니다.
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    # [x] 직선(-2.5): 회전에서 고친 것과 같은 정합 문제가 직선에도 있었다.
    #   -1.0일 때 DWB의 decel_lim_x(-2.5)와 2.5배 어긋나, DWB는 0.104 s에
    #   멈출 수 있다고 보고 궤적을 골랐지만 실제로는 0.26 s가 걸렸다.
    #   2026-07-28 주행에서 전방 우측 범퍼가 실제로 충돌했고, 그 순간 기록은
    #   명령 vx +0.010 m/s(정지 지시)인데 실제 vx +0.227 m/s였다. 정지거리를
    #   나누면 이렇다.
    #     CAN·드라이버 지연 300 ms 중 이동 : 0.227 x 0.3   = 6.8 cm
    #     -1.0으로 감속하며 이동           : 0.227^2/2.0  = 2.6 cm
    #     합계 9.4 cm  (footprint_padding은 5 cm)
    #   -2.5로 정합시키면 감속 거리가 1.0 cm로 줄어 정지거리 7.8 cm가 된다.
    #   여전히 padding보다 크다 — 지연 6.8 cm가 지배적이라 파라미터만으로는
    #   해결되지 않는다. 드라이버 가속 램프가 근본 과제다.
    #   승차감은 이 값이 아니라 Mission Manager의 approach_slowdown_distance_m
    #   (잔여거리 3 m에서 70 % 속도 상한)이 담당한다. 둘은 독립이다.
    # [yaw] 회전(-3.2): 승차감이 아니라 '조향 권한'이므로 완화하면 안 된다.
    #   -1.2였을 때 DWB의 decel_lim_theta(-3.2)와 2.7배 어긋나, DWB는 회전을
    #   0.125 s에 멈출 수 있다고 보고 궤적을 골랐는데 실제로는 0.333 s가 걸렸다.
    #   그 0.21 s(제어주기 4회분) 지연이 목표 방위를 지나치게 만들고, 반대로
    #   꺾었다가 또 지나치는 한계 진동 = 주행 중 비틀거림을 만들었다
    #   (2026-07-27 실주행 영상). DWB acc/decel_lim_theta와 정합시킨다.
    # [x] 직선 감속 2026-08-01: -2.5 -> -1.0. 사용자 승차감 요구다. 시각장애인이
    #   핸들을 잡고 걷기 때문에 정지 순간의 충격이 곧 안전이다.
    #   대가는 정지 거리다. 최고속도 0.26 m/s에서 감속 구간 이동이 1.35 -> 3.38 cm로
    #   2.0 cm 늘어난다. footprint_padding 0.05 m가 이를 덮으므로 DWB가 계획한
    #   정지선을 실제로 넘지 않는다. test_nav2_params_contract가 그 관계를 지킨다.
    #   회전(-3.2)은 위 문단대로 DWB와 그대로 맞춘다.
    #
    # [x] 직선 감속 2026-08-13: -1.0 -> -1.25. 속도를 0.5 로 올리면서 DWB 와의
    #   정합이 깨졌기 때문이다(위 decel_lim_x 주석의 계산). 승차감 요구로 정한
    #   -1.0 을 되돌리는 것이므로 대가가 있다 — **정지 충격이 25 % 커진다.**
    #   그 대신 산 것은 정지거리 2.5 cm(감속 구간 12.5 -> 10.0 cm)와, DWB 가
    #   계획한 정지선을 실제로 넘지 않는다는 보장이다. 핸들을 잡은 사람이 느끼는
    #   충격이므로 **실기에서 사람 기준으로 다시 판정한다**(judge-by-human-not-robot).
    #   되돌릴 때는 속도도 함께 내린다. 이 둘은 한 세트다.
    #
    # planner 비교와 무관한 공통 항목이다. NavFn 쪽 브랜치와 같은 값을 쓴다.
    max_decel: [-1.25, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # safety_supervisor_node의 cmd_timeout_sec(기본 0.5s)보다 짧게 유지해
    # controller_server 정지 시 감속 램프로 인한 Safety 탐지 공백을 줄인다.
    velocity_timeout: 0.4

# ===========================================================================
# collision_monitor (NAV2-B5) — 2026-08-15 dev(DWB) 에 도입
# ===========================================================================
#
# 왜 넣는가. 2026-08-15 run9 실측이 근거다. 사람이 정면 0.36 m 까지 붙자 DWB
# 궤적 419개가 전멸했고, 그 뒤 46초를 서 있었다. footprint 정면 경계가
# 0.355 m 이므로 5 mm 차이로 닿기 직전이었다.
#
# 빠져나오지 못한 이유는 앞이 아니라 뒤였다. 같은 회차의 방향별 costmap 실측:
#
#     시각      전방      후방      측면
#     199 s      63       100       100    사람이 지나가는 중
#     202 s       0       100        99    앞은 뚫렸는데 뒤가 막힘
#     241 s       0        99        99    46초 지속
#     244 s       0        41        45    뒤가 풀리자 곧바로 출발
#
# 손잡이 때문에 후방 반경이 0.546 m 다(정면 0.355 m 의 1.5배). 방향을 틀려면
# 손잡이가 그 반경을 쓸고 지나가므로, 뒤가 막히면 회전 궤적을 하나도 만들 수
# 없다. Lattice planner 는 시작점부터 궤적 전체를 footprint 로 검사하므로
# "Starting point in lethal space" 로 보고된다 — 로봇 바로 밑은 비어 있는데도.
#
# 갇힌 뒤에 푸는 수단은 이미 다 시험했고 전부 실패했다(복구 예산 다섯 조합,
# nvblox decay 양쪽). 애초에 그 거리까지 붙지 않게 하는 편이 확실하다.
#
# 폴리곤은 nav2/rpp 브랜치와 같은 값을 쓴다. 컨트롤러만 다른 A/B 비교를 하려면
# 나머지 조건이 같아야 한다.
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    # velocity_smoother 의 출력을 받아 Safety 입력으로 내보낸다. launch 에서
    # cmd_vel_smoothed -> /cmd_vel_req remap 을 제거해야 이 경로가 성립한다.
    # [2026-08-15 실기에서 고침] cmd_vel_smoothed 가 아니라 /cmd_vel 이다.
    # nav2_bringup 의 navigation_launch.py 가 velocity_smoother 를 띄우면서
    # 이미 cmd_vel_smoothed -> cmd_vel 로 remap 한다. 그래서 노드가 실제로
    # 발행하는 이름은 /cmd_vel 이고, 종전 launch 의
    # SetRemap(cmd_vel_smoothed -> /cmd_vel_req) 은 그 remap 위에 한 번 더
    # 얹혀 동작하던 것이었다.
    #
    # 처음에 "cmd_vel_smoothed" 로 적었다가 배선이 통째로 끊겼다. controller 는
    # /cmd_vel_nav 로 23.8 Hz 를 내고 있는데 /cmd_vel_smoothed 는 발행자가 없어
    # monitor 가 아무것도 못 받았고, /cmd_vel_req 와 /cmd_vel_safe 가 조용히
    # 비었다. 앱에는 "주행 중" 으로 보이는데 로봇은 한 발도 못 움직였다.
    # 확인법: ros2 node info /velocity_smoother 의 Publishers 를 직접 본다.
    cmd_vel_in_topic: "/cmd_vel"
    cmd_vel_out_topic: "/cmd_vel_req"
    # [주의] state_topic 은 이 버전에 없다. 설치된 1.1.20 의
    # libcollision_monitor_core.so 에 그 파라미터도 발행자 문자열도 없어서
    # 적어 두면 조용히 무시된다. 발동 여부는 로그로만 알 수 있다:
    #   grep -c "Robot to stop due to"      ~/.ros/log/collision_monitor_*.log
    #   grep -c "Robot to slowdown for"     ~/.ros/log/collision_monitor_*.log
    # 실주행 판정에서 이 두 숫자를 센다.

    transform_tolerance: 0.2
    # 이 시간 동안 관측이 없으면 소스를 stale 로 본다. /scan 은 12.5 Hz 다.
    source_timeout: 1.0
    # 관측 시점과 현재 사이의 로봇 이동을 odom 으로 보정한다.
    base_shift_correction: True
    # 정지 판정 뒤 이 시간 동안 0 을 계속 발행한다. Safety 의 cmd_timeout
    # 0.5 s 보다 길지만, 그 동안 '명시적 0'이 나가므로 위험하지 않다.
    stop_pub_timeout: 2.0

    polygons: ["PolygonStop", "PolygonSlow"]

    # points 는 [x1, y1, x2, y2, ...] 평면 배열이다(문자열이 아니다).
    # base_footprint 기준이며 +x 가 진행 방향이다.
    #
    # padded footprint 앞단이 +0.355 m 이므로 0.36 부터 시작해 차체와 겹치지
    # 않게 했다. 좌우 ±0.28 은 padded 반폭 0.275 에 5 mm 만 더한 값이라
    # 벽과 나란히 갈 때 걸리지 않는다.
    #
    # max_points 는 '이 개수를 초과하면 발동'이다. 2 로 두어 점 3개 이상일 때
    # 걸리게 했다 — 라이다 단발 노이즈로 급정지하지 않게 하는 값이다.
    # (거리 1 m, 각분해능 0.5도 -> 호 길이 0.9 cm 이므로 실제 물체라면
    #  10 cm 폭에 11개가 맞는다. 3개는 충분히 보수적이다.)
    PolygonStop:
      type: "polygon"
      points: [0.60, 0.28, 0.60, -0.28, 0.36, -0.28, 0.36, 0.28]
      action_type: "stop"
      max_points: 2
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True

    # 0.5 m/s 정지거리 25 cm 보다 멀리서 미리 줄인다. 앞 1.10 m 까지 본다.
    # slowdown_ratio 0.4 = 상한의 40 % (0.5 -> 0.2 m/s).
    PolygonSlow:
      type: "polygon"
      points: [1.10, 0.32, 1.10, -0.32, 0.36, -0.32, 0.36, 0.32]
      action_type: "slowdown"
      slowdown_ratio: 0.4
      max_points: 2
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True
