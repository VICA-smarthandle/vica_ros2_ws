amcl:
  ros__parameters:
    use_sim_time: false
    # --- 운동 모델 잡음 (DifferentialMotionModel) ---
    #   alpha1  회전 -> 회전 오차      alpha2  병진 -> 회전 오차
    #   alpha3  병진 -> 병진 오차      alpha4  회전 -> 병진 오차
    #
    # [닫힘] alpha1 0.4 는 2026-08-13 실기에서 실패했다. 되돌렸고 다시 올리지
    # 않는다.
    #
    # 올렸던 근거는 이랬다 — 이 로봇은 제자리 회전 직후 오차가 컸고, alpha1 을
    # 올리면 회전 시 입자 분산이 커져 스캔 매칭이 자세를 되돌릴 여지가 생긴다
    # (devlog/2026-07-31.md:29-50, t+86 의 AMCL 점프 -10.8도).
    #
    # 실제로는 주행 능력이 눈에 띄게 나빠졌다. 사용자 판정: "주춤거림·머뭇거림이
    # 눈에 띄게 늘었다." 입자를 넓게 퍼뜨리면 자세 추정이 그만큼 덜 확신하게 되고,
    # 그 흔들림이 controller 로 그대로 내려간다. 위치 오차를 줄이려던 값이
    # 주행 품질을 깎은 것이다. 판정 기준은 로봇이 통과하는가가 아니라 사람이
    # 따라올 수 있는가다.
    #
    # 회전 직후 오차라는 문제 자체는 남아 있다. 다만 그 해법이 운동 모델 잡음이
    # 아니라는 것이 이 회차의 결론이다.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # NAV2-B1 2단계. 60 -> 180. AMCL 이 한 번 갱신할 때 쓰는 라이다 빔 수다.
    # 60 은 유효 반사의 일부만 보는 것이라 좁은 곳에서 지형 특징을 놓친다.
    #
    # 방향은 update_min 과 같은 쪽이다 — "더 잘 보게" 만든다. 실패한 alpha1 0.4
    # 와는 성격이 다르다(그쪽은 "덜 확신하게" 만들어 planner 를 멈춰 세웠다).
    #
    # [미검증] 대가는 CPU 이고 이번 회차의 관건이 그것이다. 필터 갱신 비용이
    # 빔 수에 비례하므로 amcl CPU 가 3배 가까이 오를 수 있다. 이미 여유가 넉넉한
    # 편은 아니다:
    #   1단계 회차 실측  전체 346 % / 800 %  ·  amcl 7.6 %  ·  load 최대 13.8
    #   load average 13.8 은 코어 8개를 넘는다. 실행 대기 큐가 쌓였다는 뜻이다.
    #   alpha1 회차에서 제어주기 놓침이 0 -> 2 로 늘었다.
    #
    # 되돌리는 신호는 완주 실패가 아니라 이 둘이다:
    #   grep -c "missed its desired rate" ~/.ros/log/controller_server_*.log
    #   vica_drive_compare.py 의 amcl CPU 평균 · load average 최대
    # 되돌릴 때는 180 -> 120 -> 60 으로 내린다.
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # NAV2-B1 1단계. 0.2 / 0.25 -> 0.10 / 0.10 (a 는 각도 rad, d 는 거리 m 다.
    # 단위가 달라 뒤바꿔 적기 쉽다). "이만큼 움직이기 전에는 라이다를 보지
    # 않는다"는 문턱이고, 문턱이 고쳐야 할 오차보다 크면 영영 못 고친다 —
    # 2026-07-31 에 30 cm 어긋난 자세를 고치려고 25 cm 를 먼저 움직여야 했다.
    #
    # 2026-08-12 probe 측정으로 효과가 확인됐다(~/vica_amcl_logs, 21:01 -> 21:15):
    #   1 m 당 갱신     4.83 -> 10.04 회   (2.08배)
    #   무갱신 중앙값   1.05 -> 0.45 s     (0.43배)
    #   무갱신 p95      1.40 -> 0.65 s     (0.47배)
    # 다만 최악 무갱신은 2.75 -> 4.05 s 로 나빠졌고 8/11 기준(3 s 미만)에 못 미친다.
    # 비교 스크립트가 "CPU 포화를 의심하라"를 찍었다. max_beams 를 60 으로 두는
    # 이유가 이것이다 — CPU 를 더 얹기 전에 이 항목부터 갈라 봐야 한다.
    update_min_a: 0.10
    update_min_d: 0.10
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: "/scan"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # BT가 planner/controller 액션 서버의 접수(ack)·결과를 기다리는 시한(ms).
    # 20 -> 100 (2026-09-01): load 가 높으면 서버가 20ms 안에 접수를 못 해
    # "Timed out ... acknowledge goal request" / "Failed to get result in
    # node halt" 로 goal 이 ABORTED 가 됐다 — 로봇은 도착해 있는데 앱에는
    # 실패("Nav2 task failed")+관리자 호출 팝업이 뜨던 원인(실기 로그 3건).
    # 100ms 는 BT tick(10ms) 열 번 분량 — 지각은 참되, 서버가 진짜 죽은
    # 경우의 실패 판정은 유지된다.
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml'은 기본값을 쓴다:
    #   nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    #
    # 'default_nav_to_pose_bt_xml'은 vica_nav2의 커스텀 트리를 쓴다. 기본 트리에서
    # <BackUp backup_dist="0.30" backup_speed="0.05"/> 한 줄만 지운 것이다.
    # 실주행에서 핸들 뒤에 사람이 따라오는데(guideline/vica_scenario.md),
    # 2026-07-30 Hybrid 주행에서 BackUp이 실제로 0.30 m 후진을 실행했다.
    # planner를 DUBIN으로 바꿔도 막히지 않는다 — BackUp은 planner를 거치지 않고
    # behavior_server가 직접 발행하기 때문이다.
    #
    # 아래 값은 자리표시자다. RewrittenYaml은 '이미 존재하는 키'만 치환하므로
    # 키가 있어야 하고, 실제 경로는 nav2_map_test.launch.py가 설치된 share
    # 디렉터리로 덮어쓴다. 이 launch를 거치지 않고 이 yaml만 직접 쓰면
    # bt_navigator가 파일을 못 찾아 실패한다(조용히 기본 트리로 돌아가지 않는다).
    default_nav_to_pose_bt_xml: "SET_BY_VICA_NAV2_LAUNCH"
    #
    # 2026-07-28: 기본 BT에 SmoothPath가 없다는 것을 근거로 커스텀 BT를 넣어
    # smoother_server(simple_smoother)를 호출해 봤으나 실주행에서 악화되어
    # 되돌렸다. SimpleSmoother는 경로 길이를 줄이는 방향으로 부드럽게 만들어
    # 코너 안쪽으로 경로를 당긴다. 그 결과 측면 여유 중앙값이 0.476 -> 0.373 m로
    # 줄었고, DWB가 저속 궤적만 고를 수 있게 되어 코너 구간의 '절반 이하 속도'
    # 비율이 30.1 -> 52.8 %로 늘었다. 경로 꺾임 p95도 15.1 -> 24.0도로 나빠져
    # 얻은 것이 없었다(costmap 장애물 밀도는 두 주행이 동일했다).
    # 경로 각짐을 풀려면 smoother가 아니라 costmap을 아는 planner가 필요하다.
    plugin_lib_names:
      # ── 2026-09-16 Route Server(레일) 용 두 개를 추가한다 ───────────────
      # 이 둘이 없으면 BT XML 에 <ComputeRoute> 를 써도 bt_navigator 가
      # 트리 로드를 통째로 실패한다. 라이브러리는 ros-humble-nav2-route 가
      # /opt/ros/humble/lib 에 깔아 둔다.
      #
      # **이름에 'action' 이 없다.** 위아래 다른 항목은 전부
      # nav2_..._action_bt_node 인데 route 둘만 다르다. 2026-09-16 에
      # nav2_compute_route_action_bt_node 로 적었다가 bt_navigator 가
      # unconfigured 에서 멈췄고, 그 뒤 planner·controller 가 줄줄이 inactive 로
      # 남아 **목적지 요청을 받을 노드가 아예 없었다.** 로그에는 '거부'만 보인다.
      # test_bt_plugin_libraries_exist 가 이 실수를 잡는다.
      - nav2_compute_route_bt_node
      - nav2_compute_and_track_route_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - vica_is_rail_ahead_clear_condition_bt_node   # 2026-10-05 해결안 B: 레일 앞 조각 몸통 검사(레일 트리)
      # VICA 자작(vica_nav2_bt_plugins). 레일 경로가 점 1개이거나 로봇에서
      # 멀면 거른다. 2026-09-16 run1·3·5 'zero length' 사고의 직접 수리.
      - vica_is_route_path_usable_condition_bt_node
      # VICA 자작. 목적지 경로 끝점 방향을 목적지 방향으로(2026-09-30, run49 409호 교착).
      - vica_align_path_end_to_goal_action_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      # 2026-09-17 5판: 레일 앞 3 m 조각의 끝점(당근)을 꺼내 planner 목표로 준다.
      - nav2_get_pose_from_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    # [2026-09-21] 20.0 -> 10.0. **model_dt 와 반드시 짝이다**(아래 FollowPath).
    # optimizer.cpp setOffset(): controller_period > model_dt 이면 **runtime_error 로
    # 죽고**, 정확히 같아야 warm start 의 control sequence shifting 이 켜진다.
    #   1/10 = 0.1  →  model_dt 0.1 로 함께 간다.
    # 왜 낮추나: run27 에서 제어주기 놓침 225회(그 전 네 회차는 0). 그런데 local
    # costmap 은 애초에 초당 5회만 갱신된다 — 20 Hz 는 같은 지도를 네 번 다시 본다.
    # 잃는 것은 반응 지연 2.2 cm(0.44 m/s x 50 ms)뿐이고, 급정지는 collision_monitor
    # 가 별도 노드로 담당하므로 안전 경로는 이 값과 무관하다.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 컨트롤러가 궤적을 못 찾은 상태를 몇 초까지 참을지. 이 시간을 넘겨야
    # FollowPath 를 실패로 선언한다.
    #
    # 2026-08-16: 0.3 -> 10.0.
    #
    # 사람이 앞을 막으면 DWB 가 궤적을 전부 버리는 것은 **정상**이다. 로봇이
    # 사람 쪽으로 갈 궤적을 고르면 안 되기 때문이다. 그런데 0.3 초는 그 정상
    # 상태를 곧바로 '주행 실패'로 바꾼다. 실패로 선언되면 경로를 통째로 버리고
    # 복구동작(지도 지우기 -> Wait 1 s -> 경로 재작성)으로 넘어가는데, 그 절차가
    # 돌던 중에는 사람이 비켜도 절차를 마쳐야 다시 간다.
    #
    # run19 실측(2026-08-16). 좁은 모서리에서 27.6 초 정체:
    #
    #   No valid trajectories out of 419!   213회 / 27초
    #   복구 동작                             9회
    #   /cmd_vel_req                        1.1 Hz (주행 중 4.4 Hz)
    #   그동안 가장 가까운 장애물             0.85 m · +43도 로 8초간 ±3도 미만
    #
    # 즉 컨트롤러는 27초 내내 419개를 만들어 전부 버리고, 그 사이 복구가 9번
    # 돌았다. 사용자 관찰도 같다 - "사람이 길게 앞을 막고 있으면 컨트롤러가
    # 궤적을 모두 버린다".
    #
    # 10.0 이면 그동안 로봇은 **정지 명령을 내며 같은 경로를 들고 조용히
    # 기다린다.** 사람이 비키는 순간 다음 제어 주기(1/20 초)에 그대로 출발한다.
    # 지도를 지우지도, 경로를 다시 그리지도 않는다.
    #
    # 상한을 20 초 아래로 둔 이유: progress_checker 가 20 초/0.10 m 로 뒤를
    # 받친다. 사람이 아니라 진짜로 갇힌 것이면 그쪽이 복구를 띄운다. 순서가
    # 뒤집히지 않게 이 값은 그보다 작아야 한다.
    #
    # [되돌리기] 0.3 으로 되돌리면 nav2 기본 동작이다.
    # [함께 보지 말 것] sim_time 은 닫힌 축이다. 2026-08-02 실주행에서 2.5 ->
    # 2.0 으로 줄였더니 No valid trajectories 가 74 -> 168 회로 2.3배 나빠졌고
    # 좁은 경로를 한 번도 통과하지 못했다.
    failure_tolerance: 10.0
    progress_checker_plugin: "progress_checker"
    # 2026-10-07 대기 장소: position_goal_checker 추가(사용자 안내 도착 = 위치만 판정).
    # 판정기가 둘이면 Humble controller_server 는 이름 없는 FollowPath 를 실패시킨다 —
    # 그래서 모든 트리(behavior_trees/*.xml)의 FollowPath 에 goal_checker_id 를 적는다
    # (test_bt_goal_checker_contract.py 가 지킨다).
    goal_checker_plugins: ["general_goal_checker", "position_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 2026-07-31: 0.5/10.0 -> 0.10/20.0.
      #
      # SimpleProgressChecker는 "movement_time_allowance 안에
      # required_movement_radius 이상 움직였는가"만 본다. 구값 0.5/10.0은
      # 평균 0.05 m/s 이상을 끊임없이 유지하라는 뜻인데, 좁은 구간 서행이
      # 정확히 그 속도다. 즉 정상 주행을 실패로 오판한다.
      #
      # recovery가 있을 때는 이 오판이 Spin 한 번으로 흡수됐다. 복구를 끈
      # 지금은 오판이 곧 주행 종료이므로, 이 값을 고치지 않으면 좁은 구간에서
      # 거의 확실히 죽는다. '인내를 늘리는 것'이 아니라 '오탐을 없애는 것'이다.
      #
      # 도착 구간도 위험하다. Isaac 시뮬레이션 쪽 주석에 "저속 컨트롤러가 이미
      # 목표 허용범위 안에 멈춘 뒤에도 progress checker를 건드릴 수 있다"가
      # 있고, 실기는 StoppedGoalChecker라 도착 판정이 더 오래 걸린다.
      #
      # 20.0은 velocity_smoother 정지시간(max_vel_x/max_decel)보다 훨씬 커야
      # 한다는 test_nav2_params_contract의 계약도 함께 만족한다.
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    # Goal checker parameters
    general_goal_checker:
      # 2026-09-30 LatchedGoalChecker (run49 도착 교착 2/8 수리, 사용자 결정 B안 + xy 0.15).
      #
      # 끝점 0.15 m 안에 한 번 들어오면 위치에 도장을 찍고, 그 뒤로는 방향(yaw)과 정지만 본다.
      # 로봇이 끝점에서 0.5 m 넘게 멀어지거나 끝점이 0.5 m 넘게 옮겨질 때만 도장을 푼다.
      #
      # 기성 stateful: True 로는 안 된다. Humble controller_server 가 새 경로를 받을 때마다
      # (setPlannerPath) goal_checker->reset() 을 불러 기억을 지우는데, 레일 BT 는 1 Hz 로 경로를
      # 다시 준다. run49 는 정렬을 마친 채 0.25~0.35 m 띠에서 17~25 s 섰다.
      #
      # xy 를 0.25 -> 0.15 로 좁힌 것은 도장 뒤 위치를 다시 보지 않기 때문이다(사용자 결정).
      # VCC 는 이 값을 getTolerances 로 읽어 0.15 − arrive_margin(0.03) = 0.12 에서 선다.
      #
      # **되돌리기**: plugin 을 "nav2_controller::StoppedGoalChecker" 로, stateful: False 를 다시
      # 넣고, xy_goal_tolerance 를 0.25 로. unlatch_distance 는 지워도 되고 남겨도 무시된다.
      # **실패 신호**: 도착 판정까지 3 s 넘는 회차가 절반을 넘거나, 끝점 0.15 안에 못 들어가 선다.
      plugin: "vica_vcc_controller::LatchedGoalChecker"
      xy_goal_tolerance: 0.15
      unlatch_distance: 0.5              # = FollowPath.align_exit_dist
      # yaw_goal_tolerance 0.25 -> 0.15 (2026-08-25)
      #
      # 도착한 뒤 로봇이 바라보는 방향을 더 정확하게 맞추려는 것이다. 0.25 rad 는
      # 14.3도라 안내 로봇이 "저쪽입니다" 하고 선 방향이 눈에 띄게 어긋난다.
      # 0.15 rad 는 8.6도다.
      #
      # xy 는 건드리지 않는다. 한 번에 한 축만 움직인다.
      #
      # 대가는 도착까지 걸리는 시간이다. (당시) stateful 이 False 라 매 주기 yaw 를
      # 다시 보고, StoppedGoalChecker 라 rot_stopped_velocity 0.05 아래로
      # 느려질 때까지 기다린다. 남은 0.10 rad 를 RotateToGoal 이 줄여 놓은
      # 회전 속도(max_vel_theta 0.4 / slowing_factor 5.0 = 약 0.08 rad/s)로
      # 닫으면 대략 1~2초가 더 붙는다. progress checker 의
      # movement_time_allowance 20.0 s 에는 여유가 있다.
      #
      # [미검증] 위 1~2초는 계산이고 실기로 확인해야 한다.
      #
      # 되돌리는 신호는 '도착이 느리다'가 아니라 이 둘이다.
      #   - 도착 지점에서 좌우로 흔들리며 못 멈춘다(회전 진동)
      #   - progress checker 가 도착 직전에 주행을 실패로 끝낸다
      #     grep "Failed to make progress" ~/.ros/log/controller_server_*.log
      # 되돌릴 때는 0.15 -> 0.20 -> 0.25 로 올린다.
      # 2026-08-28 사용자 결정: 0.15 는 실기 검증 전이므로 0.25 를 유지한다.
      # 낮추는 실험은 위 절차(신호·되돌리기 경로)대로 별도 회차에서 한다.
      yaw_goal_tolerance: 0.25
      # 위치·방향뿐 아니라 실제 저속 상태까지 확인한 뒤 도착으로 판정한다.
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.05
    # 사용자 안내 도착 — 위치만 본다(2026-10-07, 인수인계 문서 '작업 계획' 탭 3. 주행).
    #
    # 도착해서 방향을 맞추려 제자리에서 돌면 손잡이를 잡은 사용자가 불안하고, 정렬 중
    # 위치 추정이 미끄러져 회전이 되풀이됐다(10-06 교실·화장실). 그래서 안내 도착은
    # 진행하던 방향 그대로 선다 — 입구 방향은 미션이 말(M1)로 알린다.
    #
    # general_goal_checker 와 같은 판정기(도장 0.15 m)이고 yaw 허용치만 반 바퀴 가까이 연다.
    # VCC 는 이 값을 getTolerances 로 매 주기 읽어 "방향 오차 > 허용치"일 때만 정렬(Align)
    # 하므로, 허용치가 거의 π 면 정렬에 들어가지 않는다.
    #
    # [함정] π(3.14159…)보다 크게 쓰지 않는다. getTolerances 가 허용치를 쿼터니언에 실어
    # 넘기고 VCC 가 getYaw 로 되읽는데, π 를 넘으면 음수로 감겨 '항상 방향 틀림'이 된다.
    # 3.141 이면 정반대(±0.0006 rad 안)로 도착할 때만 걸리고, 그것도 지금보다 나쁘지 않다.
    position_goal_checker:
      plugin: "vica_vcc_controller::LatchedGoalChecker"
      xy_goal_tolerance: 0.15            # = general_goal_checker
      unlatch_distance: 0.5              # = general_goal_checker
      yaw_goal_tolerance: 3.141
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.05
    # ═══════════════════════════════════════════════════════════════════════
    # MPPI (2026-09-18 전환). 되돌리려면 아래 FollowPath 블록을 지우고
    # FollowPathDWB 를 FollowPath 로 이름만 바꾸면 된다 — DWB 설정은 그대로 남겨 뒀다.
    #
    # ── 왜 바꾸나 ────────────────────────────────────────────────────────────
    # 레일(8판-3)까지 와서 남은 것이 controller 축이다. 09-17~18 실주행 8회에서
    # 코너 조향이 여전히 펄스로 남았고(버스트 3.9·부호 반전 2.7), 그 원인은
    # "1 Hz 로 바뀌는 planner 경로를 DWB 가 이산 속도 격자에서 매번 새로 쫓는 것"
    # 이었다. MPPI 는 이전 명령에 잡음을 얹어 궤적 수천 개를 굴리고 가중평균을
    # 내므로 경로가 조금 바뀌어도 명령이 튀지 않는다.
    # 2026-08-29 실측(4회차, 브랜치 nav2/mppi2 5a6acc7)에서 이미 확인됐다:
    #   손 횡속도 0.055 -> 0.018~0.029 · 회전 방향 반전 8.1 -> 1.1~1.6 회/분
    #   경로 이탈 0.043 -> 0.031 m · 제어주기 놓침 566 -> 95
    #
    # ── 그때 왜 못 썼나, 지금은 무엇이 다른가 ────────────────────────────────
    # 그때 미채택 사유는 "도착을 못 한다"였다. |w| 가 DWB 의 1/3(0.132 -> 0.043)
    # 이라 유턴을 못 했고, planner 가 **목적지까지** 그린 긴 경로를 따라가다
    # 금지구역에 들어가면 회복하지 못했다. 지금은 둘 다 조건이 다르다:
    #   * 레일 8판-3 이라 planner 목표는 3 m 앞 당근이다. 긴 경로를 쫓을 일이 없다.
    #   * 0903_d 는 복도 폭이 넓다(주행 중 벽 여유 평균 1.27 m).
    #   * 탐색 폭이 회전의 진짜 노브임을 그때 알아냈다(vx_std·wz_std).
    #
    # ── 안전 전제 [미해결·주의] ──────────────────────────────────────────────
    # inflation_radius 0.55 < padding 포함 외접반경 0.620 (09-15 base_link 이동으로
    # 08-29 에 풀렸던 전제가 되살아났다). 벽에서 0.55~0.62 m 구간은 costmap 비용이
    # 0 이라 어떤 critic 도 보지 않는다 — DWB 의 ObstacleFootprint 가 막고 있던
    # 사각지대다. MPPI 에서는 ObstaclesCritic.consider_footprint: true 로 메우되,
    # **로봇 중심 셀 비용이 0 이면 발자국 검사 자체를 건너뛴다**는 한계가 남는다
    # (회전 중 뒤쪽 모서리 0.570 m 가 벽에 닿는 경우). 그래서 이번 전환은
    # **넓은 복도(0903_d)에서만** 시험하고, 0630 같은 좁은 지도로 가기 전에
    # inflation 을 0.62 이상으로 올린다(사용자 결정 2026-09-18, backlog NAV2-B3).
    #
    # ── 사용자 요구 4가지를 어느 값이 맡는가 ─────────────────────────────────
    #   ① 좁은 곳에서 제자리 회전 말고 최소한의 호로 유턴
    #        PathAngleCritic.offset_from_furthest 4->6 · PathFollowCritic 5.0->6.0,
    #        offset 5->8 · TwirlingCritic 3.0->2.0 · vx_std 0.30->0.35 · wz_std 0.50->0.45
    #        (PreferForwardCritic 은 **후진에만** 벌점이라 vx_min 0.0 인 우리 설정에서
    #         제자리 회전을 못 막는다. 그래서 전진 유인은 PathFollow 쪽에 준다.)
    #   ② 코너에 붙지 않기        ObstaclesCritic.repulsion_weight 1.5 -> 2.2
    #   ③ 손잡이 좌우 흔들림 없기 MPPI 구조(가중평균·warm start) + temperature 0.3
    #   ④ 동적 장애물 회피 유지   critical_weight 20 · collision_cost 10000 ·
    #                            collision_margin_distance 0.10 (08-29 값 그대로)
    #   ⑤ 초음파 8개 예정        local costmap 의 range 레이어가 그대로 ObstaclesCritic
    #                            입력이 된다. 설치 후 trajectory_point_step(현재 2)을
    #                            내릴지 CPU 를 재고 정한다. 지금은 2개뿐이라 그대로.
    # ═══════════════════════════════════════════════════════════════════════
    # ══════════════════════════════════════════════════════════════════════
    # [2026-09-24] 자작 컨트롤러 VCC (vica_vcc_controller). 설계서:
    #   VICA-smarthandle docs/superpowers/specs/2026-09-24-vcc-controller-design.md
    # 평소 = RPP 식 레일 조준, 장애물 = 차선 13개 중 옮기기(0.10 m/s), 유턴 = R 0.2 -> 0.1 -> 제자리,
    # 도착 = 남은 각 한 번(모터 지연만큼 일찍 끊음, 최대 3회). 몸통 검사는 LETHAL 거리장 — inflation 과 무관.
    # 초음파는 이 플러그인이 /ultrasonic/* 를 직접 읽는다(1 s 안·연속 2회 일치). local costmap range 층은 끔.
    # [되돌리기] 이 블록 이름을 FollowPathVCC 로, FollowPathRPP 를 FollowPath 로. range 층 4개 enabled True.
    # ══════════════════════════════════════════════════════════════════════
    FollowPath:
      plugin: "vica_vcc_controller::VccController"
      # 경로 창(FeasiblePathHandler 개념, core/path_window). 가까운 점 찾기 범위 = 지금 RPP 와 같은 3.0.
      max_robot_pose_search_dist: 3.0
      reject_unit_path: false            # 1점 경로 거부. 켜면 run35 식 '1점 끝 방향 성공'이 '주행 불가'로 바뀐다(사용자 결정 대기)
      # 2026-10-01 0.5 -> 0.7(사용자 결정, run52 뒤 "느리다"). 0.5 에서 명령은 끝까지 0.5 를 냈고
      # 실제 이동 0.51~0.58 이었다(run50). velocity_smoother.max_velocity[0] 과 한 세트.
      # 함께 바꾼 것(1.4배 비율): linear_accel·curve_decel·slow_clearance. 그대로 둔 것: 출발 1단계
      # (0 -> 0.25 를 0.5 s, 0.7 m/s² 는 "급함" 기록), 제동 1.25, curve_min_radius 0.8(코너 1.4배 빨라짐
      # — 시험할 항목), approach 0.6. 되돌리기: 이 블록의 네 값과 smoother 를 0.5 기준 값으로.
      # 2026-10-05 0.7 -> 0.6(사용자 결정, 시연 준비). 0.5 기준 1.2배로 linear_accel 0.17·curve_decel 0.36.
      # slow_clearance 는 10-01 사용자 결정 0.35(0.5 시절 값) 그대로. smoother max_velocity[0] 도 0.6.
      # 2026-10-06 0.6 -> 0.5(사용자 결정, run66 "감속이 확"과 함께). 0.5 시절 값으로 되돌림:
      # linear_accel 0.143·curve_decel 0.3. smoother max_velocity[0] 도 0.5. 평상 감속 분리(planned_linear_decel)와 한 회차.
      # 2026-10-06 run67 뒤 0.5 -> 0.7(사용자 결정). 가감속은 0.5 기준 1.4배(10-01 0.7 때와 같은 비율):
      # linear_accel 0.2·curve_decel 0.42·planned_linear_decel 0.7. 그대로: 출발 1단계 0.25/0.5, 비상 1.25, slow_clearance 0.35.
      # 2026-10-08 run69 뒤 0.7 -> 0.5(사용자 결정, 시연장은 0.5 로 시연). 8884069 의 다섯 값을 0.5 기준으로
      # 함께 되돌림: planned_linear_decel 0.5·linear_accel 0.143·curve_decel 0.3·smoother max_velocity[0] 0.5.
      desired_linear_vel: 0.5
      lookahead_time: 2.5                # RPP 값 — run36 직진 최고
      min_lookahead_dist: 0.6            # run39
      max_lookahead_dist: 1.2            # run36: 레일 노드 1 m 를 건너뛴다
      transform_tolerance: 0.2
      max_angular_vel: 0.5               # smoother max_velocity[2] 와 같음
      max_angular_accel: 1.2             # RPP 값
      max_linear_decel: 1.25             # smoother max_decel[0] — 비상 제동(Hold·Turn 전 멈춤) 완화 금지
      # 2026-10-06 해결안 ①(사용자 결정): 평상 감속. Track 의 미리 계산된 상한(코너·차선 옮김·옆 여유·
      # 도착·속도 제한)만 이 기울기로 내린다. run66 감속 25번(14.9/분) 중 23번이 이 상한이었는데
      # 전부 1.25 로 내려 몸이 쏠렸다. 0.5 에서 최고 -> 0 이 0.4 s·0.10 m -> 1.0 s·0.25 m.
      # 정지거리 계산(motionCollides·경로 앞 검사)은 max_linear_decel 그대로라 안전 판단은 같다.
      # curve_decel(0.3) 이상이어야 코너 계획 곡선을 따라간다(test_nav2_params_contract).
      # 되돌리기: 이 줄을 지우면 max_linear_decel 과 같아진다.
      planned_linear_decel: 0.5          # 10-06 0.5(run67 "부드럽다") -> 0.7(최고 0.7) -> 10-08 0.5(최고 0.5 로 복귀): 최고 -> 0 이 1.0 s
      start_ramp_speed: 0.25             # 요구 8: 절반까지 살짝(0.5 s)
      start_ramp_accel: 0.5
      linear_accel: 0.143                # 10-01 0.143 -> 0.2(0.7 용), 10-05 -> 0.17(0.6 용), 10-06 -> 0.143(0.5) -> 0.2(0.7) -> 10-08 0.143(0.5 복귀): 0.25 -> 0.5 를 1.75 s. 출발 1단계는 그대로
      resync_margin: 0.15                # run48: 0.05 는 모터 지연 0.45 s 에 매번 되감겨 톱니(0 -> 0.25 에 0.85 s)
      min_speed: 0.12                    # RPP regulated_linear_scaling_min_speed
      # 앞 1.5 m 경로를 20 cm 간격 세 점으로 읽은 반경이 이보다 작으면 v = 최고속도 × 반경 / 이 값.
      # 2026-10-01 1.2 -> 0.8: run50 코너 6곳에서 레일을 반경 0.35~0.7 m 로 읽어 0.14~0.30 까지
      # 줄였지만, 실제로 돈 반경은 0.9~1.7 m(조준점이 꺾임을 깎음)였다 — 필요 이상 감속.
      # 사용자 "줄이는 게 심함, 0.6 은 너무 확" -> 0.8. 되돌리기 1.2.
      curve_min_radius: 0.8
      curve_decel: 0.3                   # 코너 미리 줄이기. 10-01 0.3 -> 0.42(0.7 용), 10-05 -> 0.36(0.6 용), 10-06 -> 0.3(0.5) -> 0.42(0.7) -> 10-08 0.3(0.5 복귀)
      preview_dist: 1.5
      slow_clearance: 0.35               # 직접 잰 거리. 10-01 0.35 -> 0.49 -> 0.35: run53 사람 앞 차체 0.86 m 부터 감속·0.74 m 부터 기어감(사용자 "너무 멀리 섬")
      approach_velocity_scaling_dist: 0.6
      # 목적지 0.6 m 안 거리 비례 감속(목표 속도 × 남은거리/0.6)이 이 값 밑으로는 안 줄인다.
      # 2026-10-01 0.05 -> 0.10: run52 409·테스트1 에서 휜 경로 끝(코너 감속 0.12 와 곱해짐)에서
      # 마지막 0.3 m 를 0.05 m/s 로 3~5 s 기어갔다. 다른 이유의 감속은 덮지 않는다(min 바깥).
      # 되돌리기 0.05.
      min_approach_linear_velocity: 0.10
      lane_max_offset: 0.6               # 요구 3
      lane_step: 0.1
      lane_shift_speeds: [0.3, 0.2, 0.1] # 차선 옮기는 동안 달릴 속도 후보 — 20 cm 가 나오는 가장 빠른 것
      avoid_horizon: 1.5                 # 요구 1: 먼 사람 무시
      target_clearance: 0.20             # 요구 4: 15~20 cm
      w_clear: 10.0                      # 가중치 근거: vica_vcc_controller test_lanes 시나리오
      w_rail: 1.0
      w_change: 0.5
      switch_margin: 0.05
      switch_persist_cycles: 3
      lane_rate: 0.10                    # 손잡이 0.115 m/s 탈락선 아래(backlog §11)
      return_clear_time: 1.0
      lane_resync_threshold: 0.15        # run48: 첫 구간 연장선 옆 오차가 2주기 연속 넘으면 d 재동기(가짜 되튐 75회)
      turn_enter_angle: 1.047            # 60도 (요구 2)
      turn_exit_angle: 0.436             # 25도
      pivot_start_angle: 0.611           # 35도 (정지 출발)
      # 앞에서부터 들어가는 첫 반지름을 쓴다(몸이 쓸고 가는 자리를 매 주기 검사). 2026-09-30 run50:
      # [0.2, 0.1] 이던 때 U턴 5회 전부 R 0.2 — 사용자 "U턴이 너무 작다". 필요 폭 R 0.4 = 1.53 m,
      # 0.3 = 1.35, 0.2 = 1.19(padded footprint 스윕 계산, 2026-08-29). 되돌리기: [0.2, 0.1].
      # 2026-10-01 run54 뒤 [0.4, 0.3, 0.2, 0.1] -> [0.3, 0.2, 0.1](사용자 결정, 최대 0.3).
      # 화장실 앞 R 0.4 는 앞면이 벽 쪽으로 쓸려 collision_monitor 감속에 6~8 s 걸려 U턴 11 s(R 0.2 는 6 s).
      # 복도에서도 R 0.4(6.1~7.9 s)가 R 0.2(6.7 s)보다 빠르지 않았다(회전 0.45 rad/s 고정이라 각만이 시간을 정함).
      turn_radii: [0.3, 0.2, 0.1]
      # U턴 호를 돌기 전에 끝까지 미리 돌려 보고, 도는 동안 몸 윤곽(padding 0.05 포함)이 막힌 칸에
      # 가장 가까워지는 순간의 거리가 이 값 이상인 첫 반지름(turn_radii 앞에서부터)을 고른다.
      # 2026-10-01 0.05 -> 0.15(실제 차체-벽 최소 간격 ≈ 0.10 -> 0.20 m). run51 사용자: 복도 R 0.4 는
      # 좋지만 화장실 통로는 "느리고 불안, 0.3 이어야" + 그 순간 collision ahead 2회. 5 cm 만 남아도
      # 큰 호를 고른 것으로 본다(bag 유실로 미확인). 되돌리기 0.05.
      # 2026-10-01 0.15 -> 0.30: run52 라이다 7장 중앙값으로 화장실 앞 R 0.4 여유 0.25 · R 0.3 0.41,
      # 407 앞 복도 R 0.4 0.45. 0.30 이면 화장실 앞만 0.3, 복도는 0.4(사용자: "그 통로는 0.3 이 맞다").
      # 409 앞(30.6, -0.4)은 기록이 흔들려(R 0.4 0.03~0.20) 0.3 이하로 내려갈 수 있다. 되돌리기 0.15.
      turn_clearance: 0.20
      # 2026-10-01 run54 뒤 고를 때 0.30 / 도는 중 0.15(turn_keep_clearance) -> 0.20 하나로 통일(사용자 결정).
      # 0.30 은 마지막 수단인 제자리 회전에도 걸려(화장실 앞 제자리 여유 ≈ 0.27) turn_blocked 10.6·13.7 s.
      # turn_keep_clearance 는 지웠다 — 없으면 turn_clearance 와 같다(도는 중에도 지금 반지름을 먼저 본다).
      turn_angular_vel: 0.45             # DWB U턴 실측 0.42~0.47
      # 2026-10-05 해결안 C: 유턴(Turn)의 끝을 정한다. run60 사람 접근 73 s·5바퀴, run63 시작→창구 28 s·687° —
      # Turn 은 방향을 잠그고 "조준각 < 25°" 에서 끝나는데 경로가 매초 로봇 자리에서 다시 그려지거나 레일↔당근으로
      # 바뀌어 조준점이 로봇과 함께 돌았다(꼬리 잡기). 넷 다 0/false 면 예전 동작.
      turn_lock_target: true             # 들어갈 때 조준 방향(지도 기준)을 붙들고 끝을 그 방향으로 본다
      turn_retarget_angle: 1.571         # 새 경로 조준이 90° 넘게,
      turn_retarget_persist: 0.5         #   0.5 s 넘게 다르면 다시 고른다(방향도 가까운 쪽으로)
      turn_max_rotation: 6.283           # 한 Turn 누적 360° 넘으면 Hold 로 멈추고 다시 판단
      turn_enter_persist: 0.3            # 조준각 60° 초과가 0.3 s 이어져야 Turn(경로 바뀌는 순간의 S 자 방지)
      # 2026-10-05 해결안 가: 경로 끝 연장. 끝점이 코앞이면 옆 4 cm 가 조준각 39°·회전 명령 최대가 되어 도착 직전
      # 엉뚱한 쪽으로 꺾었고, 도착 정렬이 그 회전을 되돌리느라 먼저 반대로 1~17° 돌았다(run62~64 도착 16번 중 9번).
      # 조준점을 경로 마지막 모양을 곧게 이은 선 위 0.6 m 에 둔다. 멈추는 자리는 그대로.
      end_extend: true
      end_extend_max_lateral: 0.08       # 연장선에서 옆 8 cm 넘으면 예전처럼 끝점 조준(지나침 방지)
      end_extend_min_length: 0.3         # 0.3 m 보다 짧은 경로(고리 등)는 연장하지 않는다
      pass_arrival: true                 # 끝점을 지나쳤어도 checker 원 안(0.135 m)이면 도착
      # 2026-10-08 run69 헛 정지 2회(205 s 사용자 손잡이 잡은 채, 1225 s): 새 경로가 온 첫 주기에 정지거리 검사가
      # 새 선·옛 차선 메모로 몸을 엉뚱한 곳에 놓고 '닿는다'를 냈다(실제 앞 2 m 빈 곳). 그 첫 주기만 다음 주기에
      # 한 번 더 나와야 선다(0.1 s·5 cm). 실제로 내보낼 (v, w) 호 검사는 그대로 바로. 끄기: false.
      new_path_collision_confirm: true
      # 2026-10-07 위치만 도착(position_goal_checker, yaw 3.141 = 사용자 안내)이면 checker 원(0.15)에 닿는 순간
      # 속도 0·곡률 0 으로 곧게 선다 — 마지막에 끝점을 조준해 꺾지 않는다. 원 경계 속도 약 0.13 m/s(최고 0.5)를
      # planned_linear_decel 0.5 로 내려 약 0.25 s·2 cm(급정지 아님). 끄기: 0.
      position_only_yaw_tol: 3.0
      pivot_angular_vel: 0.35            # RPP rotate_to_heading_angular_vel
      align_angular_vel: 0.35
      motor_lag: 0.35                    # run41 지연 0.3~0.5 s [추정] — 매 정렬 실측으로 갱신
      align_settle: 0.3
      align_max_attempts: 3
      # ── 도착 교착 수리 (2026-09-30, run49 교착 2/8) ─────────────────────
      align_rearm_time: 3.0              # Failed 뒤 이만큼 지나면 3번 기회를 다시. run49 409호 17 s Hold. failure_tolerance(10 s)보다 짧게
      align_exit_dist: 0.5               # = general_goal_checker.unlatch_distance. 0.35 에서 나오던 띠에서 정렬 뒤 섰다(run49)
      arrive_margin: 0.03                # 멈춤 반경 = checker xy − 0.03 = 0.12. checker 가 움직이는 동안 먼저 도장을 찍게
      min_state_time: 0.5
      clearance_window: 5.0              # 1.5 m 앞 + 몸 0.62 m 를 덮는다(local costmap 6 m 안)
      reset_gap: 1.5                     # 호출이 이보다 길게 끊기면 새 실행으로 보고 초기화. BT 복구 Wait 1 s·CPU 멈칫보다 길게
      # 2026-10-05 run66 시험(사용자 결정): VCC 만 초음파를 받지 않는다. run65 에서 초음파 호가 차선 옮김을
      # 20.2/분(run58 6.1)으로 늘려 멈칫이 4.7배였다 — 그때 호 151개 중 102개는 라이다로 빈 곳. 아무도 안 내는
      # 토픽 하나를 둔다(빈 목록 [] 은 rcl yaml 이 타입을 못 정해 위험). 핸들 드라이버·LED·서보·진동은 그대로.
      # 되돌리기: 아래 원래 네 토픽으로.
      #   ["/ultrasonic/front_left", "/ultrasonic/front_right", "/ultrasonic/left_wheel", "/ultrasonic/right_wheel"]
      # 2026-10-08 run69 뒤(사용자 결정): 앞쪽 2개만 다시 켠다. 바퀴 옆 2개는 끈 채로 둔다.
      # 2026-10-08 run71 뒤(사용자 결정): 앞바퀴 양옆 2개(left_wheel·right_wheel)도 켠다 — 10-05 원래 네 토픽.
      # run71 17:06:53 옆으로 빠진 물체를 앞 센서가 놓친 뒤 왼쪽 옆면이 스쳤다(left_wheel 0.03 m, VCC 미입력).
      # run65(같은 네 토픽)는 원호 허상으로 차선 옮김 20.2/분이었다 — 다음 주행에서 다시 잰다.
      # 끄기: "/ultrasonic/vcc_off" 한 개로.
      ultrasonic_topics: ["/ultrasonic/front_left", "/ultrasonic/front_right", "/ultrasonic/left_wheel", "/ultrasonic/right_wheel"]
      # 채널별 거리 상한(위 순서, 0 = 없음). 2026-10-08 사용자 결정: 바퀴 옆은 0.40 m 안만 — 몸에 붙은 것만.
      # 0.40 = slow_clearance 0.35 + 몸 여유 0.05: 더 먼 옆 값은 곧게 갈 때 속도를 못 바꾸고 차선·유턴 판단에만
      # 들어가 허상을 만든다(run71 달리는 중 옆 값의 약 95 % 가 0.4~1.5 m 의 벽·사람). us_near_confirm_range 와
      # 같은 경계라 남는 값은 한 번에 인정된다. 기억 규칙은 그대로. 끄기: [0.0, 0.0, 0.0, 0.0].
      us_max_range_per_topic: [0.0, 0.0, 0.40, 0.40]
      us_max_age: 1.0
      us_confirm_count: 2
      us_confirm_tol: 0.15
      us_near_confirm_range: 0.40        # run48: 이보다 가까운 값은 한 번에 인정(콘 0.33 을 두 번째 프레임 기다리다 놓침)
      us_memory_time: 1.5                # run48: 확인된 점을 1.5 s 기억 — 먼 반사 1.18 m 하나로 콘을 잊고 부딪혔다
      us_arc_points: 7
      publish_state: true
    # ══════════════════════════════════════════════════════════════════════
    # RPP (Regulated Pure Pursuit) — 2026-09-21. MPPI 는 FollowPathMPPI 로 보존.
    #
    # 왜 넘어왔나 (MPPI 열한 회차 뒤)
    #   MPPI 는 손잡이 진동의 **크기**·벽 여유·동적 장애물·CPU 에서 DWB 를 이겼지만
    #   비카가 가장 아쉬운 둘은 끝내 못 고쳤다.
    #     ① 방향 바뀜   DWB 35.8 회/분 vs MPPI 최선 37.5 (구조적 — 평균이라 명령이
    #                   거의 매 주기 바뀐다. 같은 값 유지 5 % vs DWB 76 %)
    #     ② U턴 제자리  DWB 38 % vs MPPI 50~61 % (어떤 값으로도 못 내렸다)
    #   `wz_std` 하나가 둘을 반대로 돌리고 분리할 값이 없다. run34(0.42)가 마지막
    #   절충이었는데 코너 제자리는 3 % 로 좋아졌지만 손잡이 흔들림이 0.071 -> 0.107
    #   로 **DWB(0.084)보다 나빠졌다**(wz_std 1.2배에 흔들림 1.51배 — 비례보다 빠름).
    #
    # RPP 가 다른 점 (공식 README)
    #   "소비자·산업·서비스 로봇의 필요에 초점". 두 가지 조절이 기본이다.
    #     곡률 감속 — 급한 회전에서 알아서 늦춘다. 코너 멈칫의 반대다.
    #     근접 감속 — 장애물에 가까울수록 늦춘다. run28 의 "벽과 나란히 0.5 m/s
    #                 전속" 이 구조적으로 안 난다.
    #   그리고 충돌 검사를 **조건 없이 몸통 전체**로 한다(MPPI 는 중심 셀 비용이 0 이면
    #   발자국 검사를 건너뛴다) — 미해결 inflation 0.55 < 외접 0.620 사각지대에서 더 안전.
    #
    # 08-13 철회의 진짜 원인과 지금 다른 점
    #   그때 회전 반전 6.1 -> 24.3 회/분. 범인은 `rotate_to_heading` 임계 진동이다.
    #   소스: |atan2(carrot_y, carrot_x)| > min_angle 이면 linear_vel = 0 으로 끊고
    #   제자리 회전. **히스테리시스가 없다.** 당시 planner 가 목적지까지 그린 경로가
    #   1 Hz 로 통째로 바뀌어 조준점 각도가 임계 근처를 오갔다 → 매초 뒤집혔다.
    #   lookahead 를 1.5 -> 2.5 로 늘려도 24.7 로 그대로였던 이유: lookahead 는
    #   조준점의 *거리*를 바꾸지만 이 판정은 *각도*만 본다.
    #   **지금은 레일 8판-3 이라 planner 목표가 3 m 앞 당근이고, 앞 3 m 가 비면 레일
    #   경로를 그대로 쓴다(RailDirect). 경로가 통째로 안 흔들린다.**
    #
    # [한계·미리 알고 간다] 공식 README: "순수 추종 컨트롤러는 동적 장애물에 관심도
    #   걱정도 없이 경로만 따라간다." **RPP 는 사람을 피하지 못한다. 멈출 뿐이다.**
    #   회피는 레일 BT 가 맡는다(앞 3 m 막힘 -> 당근 모드 -> planner 우회).
    #   **레일 옆 0.2~0.5 m 에 비껴 선 사람은 IsPathValid 도 못 거른다 — 판정 1순위.**
    #
    # [되돌리기] FollowPathMPPI 를 FollowPath 로 이름만 바꾸면 된다. DWB 는
    #   FollowPathDWB 로 그대로 있다.
    # ══════════════════════════════════════════════════════════════════════
    # [2026-09-24] VCC 전환으로 보존. 되돌리기: 이 이름을 FollowPath 로, 아래 VCC 블록을 FollowPathVCC 로.
    FollowPathRPP:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # MPPI vx_max 와 같은 값 — A/B 가 성립하려면 물리 상한이 같아야 한다.
      desired_linear_vel: 0.5

      # 조준점(carrot). 08-24 실측: 1.5 는 도착 실패 10회·timeout 47 이었고 2.5 는 0/1.
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 2.5
      # [2026-09-21 run35 후] max 0.75 -> 1.20. **고칠 자리는 min 이 아니라 max 였다.**
      # 조준거리 = v x lookahead_time 을 [min, max] 로 자른다. 순항 0.44 m/s 면
      # 0.44 x 2.5 = 1.10 m 인데 **max 0.75 에 걸려 잘리고 있었다**(0.30 m/s 이상은 전부).
      # 레일 노드 간격은 1.00 m 다. 조준점이 그보다 짧으면 한 구간 안에만 머물다가
      # **노드를 넘을 때마다 방향이 한 번씩 꺾인다** — run35 직진 흔들림의 파장이
      # 1.25 m 로 노드 간격과 맞았다(사용자 관찰 "곡선으로 노드를 따라가려 한다").
      # 1.20 으로 올리면 순항 조준거리가 1.10 m 가 되어 **항상 노드를 건너뛴다**.
      #
      # **min 은 0.45 그대로 둔다.** 느릴 때(코너·유턴) 조준점이 짧아야 호를 따라간다.
      # min 을 올리면 코너에서 경로를 질러가 버린다.
      #
      # 덤: 조준점이 멀수록 그쪽을 보는 각이 작아져 rotate_to_heading(1.3 rad) 문턱을
      # 덜 넘는다 → 제자리 회전도 조금 준다. 다만 유턴은 저속이라 min 에 걸리므로
      # **유턴 제자리(42 %)는 이 값으로 크게 안 바뀐다** — 그건 다음 축이다.
      # [대가] 코너를 더 크게 질러간다. 벽 여유 최소(run35 0.51 m)를 함께 볼 것.
      # [2026-09-24] 0.45 -> 0.6. 복귀 호 반지름 = L^2/(2*옆이탈): 옆이탈 0.5 m 에서 0.20 -> 0.36 m,
      # 조준각 90 -> 56 도라 레일로 돌아올 때 제자리 회전 대신 호를 그린다(run36 재계산).
      # 장애물 감지와는 무관 — 충돌 예측은 min(1.2 s, 조준점 거리)라 조준점을 늘려도 짧아지지
      # 않고, 사람·벽은 costmap/collision_monitor 가 본다. 대가: 코너 안쪽 자르기(R 1.0 호 4.5 cm),
      # 0.24 m/s 아래선 속도비례 조준이 죽는다. 0.30 은 잔경로를 추종해 흔들렸다.
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.20
      use_interpolation: true

      # 곡률 감속. min_radius 를 올리면 감속이 일찍·세게 걸려 더 조밀한 호가 된다.
      # 0.9(08-24) -> 1.2. 회전 상한 0.5 와의 정합:
      #   R 1.0 -> v 0.42·w 0.42 / R 0.5 -> 0.21·0.42 / R 0.3 -> 0.13·0.43
      #   R 0.24 -> 0.12(하한)·0.50 = 실현 최소 반경
      # **낮추면 부등식이 깨져 planner 호를 못 따라가고 "직선에서도 흔들린다" 가 난다.**
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.2
      regulated_linear_scaling_min_speed: 0.12

      # 근접 감속 — 장애물에 가까울수록 늦춘다. MPPI 에 없던 안전장치다.
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.35
      cost_scaling_gain: 1.0
      # **costmap 의 cost_scaling_factor 와 반드시 같아야** 비용->거리 역산이 맞다.
      inflation_cost_scaling_factor: 3.5

      # 제자리 회전. 1.0(08-24) -> 1.3 rad = 74.5° 까지는 호로 돈다(요구 ①).
      # 끄면 안 된다 — 조준점이 정확히 뒤일 때 carrot_y≈0 -> 곡률 0 -> **벽으로 직진**.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.3
      rotate_to_heading_angular_vel: 0.35    # 손잡이 끝 0.22 m/s
      max_angular_accel: 1.2                 # 제자리 회전 시작·정지 충격
      allow_reversing: false                 # 뒤에 사람. use_rotate_to_heading 과 동시 true 불가

      # 충돌 예측. 0.5 x 1.2 = 0.60 m, 정지거리 27.5 cm 의 2배.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.2

      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

    FollowPathMPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      # [2026-09-21 2차] 56 -> 28, model_dt 0.05 -> 0.1. **지평 2.8 s 는 그대로다**
      # (28 x 0.1 = 2.8). 제어주기를 10 Hz 로 낮추면서 model_dt 를 0.1 로 맞춰야
      # 하므로(setOffset 강제), 같은 지평을 유지하려면 step 수를 절반으로 줄인다.
      #   초당 궤적 점 2,240,000 -> 560,000 (x1/4). 주기 예산은 50 -> 100 ms.
      #   점당 시간 여유가 4배가 되므로 run27 의 놓침 225회는 사라져야 한다.
      # 대가: 궤적을 0.1 s 간격으로 찍어 거칠어진다(0.44 m/s 에서 4.4 cm 간격).
      #   로봇 폭 0.45 m 라 발자국 충돌 검사에는 충분하다.
      # 공식 README: 지평(steps x dt) x vx_max 가 costmap 반경보다 크면 인위적으로
      #   제한된다. 2.8 x 0.5 = 1.4 m < local costmap 반경 3 m 이므로 안전하다.
      #
      # [이전] 36 -> 56(nav2 기본). 지평 1.8 -> 2.8 s.
      # run26 에서 일반 코너 속도가 DWB 0.464 대 MPPI 0.407 로 12 % 낮았다. 원인은
      # 근시다 — 1.8 s 궤적(0.8 m)으로 1.5 m 창의 굽은 경로를 따라가려니 속도를
      # 줄이는 수밖에 없었다. 지평을 늘리면 코너를 미리 보고 빠른 선을 고른다.
      # 궤적이 닿는 거리 0.8 -> 1.4 m 로, local costmap 반경 3 m 안이라 안전하다
      # (공식 README: 지평이 costmap 보다 커지면 인위적으로 제한된다).
      # **대가는 계산량이다** — batch 와 곱해져 궤적 점이 36,000 -> 112,000(x3.11).
      time_steps: 28
      model_dt: 0.1
      # [2026-09-21 잡음 축] 1000 -> 2000. 표본 잡음은 1/√N 로 준다(7.1 식) → x0.71.
      # 08-29 실측: batch 1000 이 DWB 의 2.5배 계산량인데 제어주기 놓침은 6배 적었다
      # (점당 비용이 다르다).
      # **CPU 주의** — time_steps 56 과 곱해져 controller 몫이 18.3 -> 약 57 %,
      # 전체 47.6 -> 약 86 %(95분위 91 %) 로 뛴다. 제어주기 놓침이 0 이 아니면
      # 이 회차는 오염된 것이니 batch 부터 1000 으로 되돌린다.
      batch_size: 2000
      iteration_count: 1
      # ── 손잡이 잔떨림의 정본 원인 (2026-09-18 run25 로 확정) ──────────────
      # MPPI 출력은 궤적 1000개의 **가중평균**이라 표본 잡음이 남는다. 실측:
      #     주기당 |Δw| ≈ 1.9 x wz_std / √batch_size
      #   run24 wz_std 0.45 → 0.0271 (예측 0.0142, 배수 1.91)
      #   run25 wz_std 0.50 → 0.0298 (예측 0.0158, 배수 1.89)
      # 배수가 두 회차에서 같다 = 잡음 모형이 맞다. N_eff = 1000/1.9² ≈ 277.
      # 이 잔떨림이 warm start 로 누적돼 2.8 초짜리 좌우 파도(진폭 0.24)가 된다.
      # 0.0298 x √(2.8/0.05) = 0.22 ≈ 실측 0.239. 사슬이 수치로 닫힌다.
      #
      # temperature 는 softmax 가중치의 평평함을 정한다 — 올리면 더 많은 표본이
      # 평균에 실제로 참여해(N_eff ↑) 잔떨림이 준다. **CPU 를 한 푼도 안 쓴다.**
      # 0.3 -> 0.6: N_eff 277 -> 500~700 기대, 잔떨림 x0.68, 직진 반전 48 -> 33 회/분.
      # [되돌리기] 0.3 이 nav2 기본값이다.
      # [함께 보지 말 것] critic 가중치는 이 축이 아니다 — run24→run25 에서 7개를
      #   되돌렸는데 직진 반전은 46.3 -> 47.9 로 그대로였다.
      # [2026-09-21 2차] 0.6 -> 1.2. run27 에서 실효 표본이 986/1000 -> 578/2000 으로
      # 무너졌다 — temperature 는 절대값이 아니라 **궤적 비용 규모 대비** 값이라
      # time_steps 가 바꾼다. 지평을 늘리자 점수 차가 벌어져 심사가 까다로워졌다.
      # **주의**: 이번에 step 수를 56 -> 28 로 줄였으므로 합산 비용도 대략 절반이 되어
      # 선택성이 이미 상당히 돌아온다. 1.2 는 그 위에 얹는 것이라 run26(98.6 %)보다
      # 더 평평해질 수 있고, 지나치면 평균이 비용을 거의 안 보게 된다(둔해진다).
      # 실효 표본을 bag 에서 재어 1500~2000/2000 이면 과하다 — 0.6~0.8 로 내린다.
      # [2026-09-21 2차·run28 후] 1.2 -> 0.9. run28 에서 실효 표본이 1412/2000 까지
      # 돌아왔고 손잡이 잔떨림은 DWB 급(좌우속도 0.072 vs 0.084)이 됐다. 그런데
      # **너그러운 평균은 부드러움과 경계심을 같이 돌린다** — 같은 회차에 로봇이
      # 레일에서 0.63 m 벗어나 벽 0.43 m 까지 갔고(외접 0.620) `start_lethal` 12회,
      # 완주 7/8 이었다. 레일 자체는 그 자리에서 벽 1.06 m 로 멀쩡했다
      # (레일 간선 최소 0.92 m, 0.62 m 미만 0개 — scripts/vica_route_repair.py 로 확인).
      # 0.9 면 실효 표본 1000 근처로 경계심을 얼마간 되찾으면서 잔떨림은 크게 안 나빠진다.
      temperature: 0.9
      # [2026-09-21 3차] 0.015 -> 0.05. **아직 한 번도 안 건드린 축이다.**
      # 소스(optimizer.cpp updateControlSequence)에서 비용에 이 항이 더해진다:
      #     gamma / wz_std² × Σ(지금 명령 × 잡음)
      # 즉 **직전 명령에서 벗어나는 표본에 값을 물린다.** 올리면 평균이 직전 명령
      # 쪽에 더 머물러 조향이 덜 뒤집힌다. 공식 문서도 "부드러움과 에너지 효율의
      # 맞바꿈"이라 적고, 소스상 올릴수록 보수적·안정적이 된다.
      #
      # 노리는 것: 손잡이 **방향 바뀜** 37.5 회/분 → DWB 35.8 급.
      #   크기(좌우속도 0.071)는 이미 DWB(0.084)보다 낫다. 남은 건 바뀜 횟수뿐이다.
      # 대가: 새 요구에 덜 민감해진다 — 사람이 튀어나왔을 때 반응이 굼뜨면 이 값이다.
      #   사람 첫 포착 거리와 사건당 정지 시간을 함께 볼 것.
      # **CPU 를 안 쓴다**(비용 항 하나 추가일 뿐).
      # [되돌리기] 0.015 가 nav2 기본값이다.
      # [2026-09-21 5차] **gamma 축 종료 — 0.015(nav2 기본값)로 되돌린다.**
      # 0.015 · 0.03 · 0.05 세 점을 실주행으로 확보했다.
      #   0.05  각짐 심함 + 직진 더 비틀거림
      #   0.03  둘 다 중간
      #   **어느 값에서도 코너의 흔들림·멈칫은 그대로였다** → 코너는 gamma 축이 아니다.
      # 변수를 하나 줄이고 유턴 축(wz_std)으로 넘어간다.
      gamma: 0.015
      # [2026-09-21 시야 축] 1.5 -> 3.0. MPPI 가 보는 경로 길이다(DWB 는 costmap
      # 전체 3 m). 두 가지를 동시에 고친다.
      #   ① 코너를 미리 보고 빠른 선을 고른다(time_steps 56 과 같은 목적).
      #   ② **1.4 m 스위치 문제가 사라진다** — PathFollowCritic 은 경로 끝이
      #      threshold_to_consider(1.4 m) 안이면 꺼지고 GoalCritic 은 같은 1.4 m 에서
      #      켜진다. 창이 1.5 m 라 10 cm 옆에 살고 있었다. 3.0 이면 멀어진다.
      # local costmap 이 6x6(반경 3 m)이라 실효 상한이 3.0 이다. 더 올려도 소용없다.
      prune_distance: 3.0
      transform_tolerance: 0.2
      visualize: false
      reset_period: 1.0
      motion_model: "DiffDrive"

      # 속도·가속 상한은 DWB 와 같은 값을 쓴다(A/B 성립 조건, 2026-08-29).
      vx_max: 0.5
      vx_min: 0.0          # 후진 금지 — 뒤에 사람이 손잡이를 잡고 서 있다
      vy_max: 0.0
      wz_max: 0.5
      ax_max: 2.0
      ax_min: -2.0
      az_max: 2.0

      # ── 탐색 폭: 회전의 진짜 노브 (2026-08-29 §6.6) ──────────────────────
      # MPPI 는 '지금 명령 + 잡음'으로 후보를 만든다. 잡음 폭에 없는 동작은
      # critic 을 아무리 조정해도 고를 수 없다.
      #
      # [2026-09-18 run24 후 되돌림] 0.35/0.45 로 '호 유턴'을 유도하려 했으나
      # 유턴은 나아지지 않고(제자리 38 -> 51 %) 직진만 망가졌다. 08-29 실측
      # 조합(0.3/0.5)으로 되돌렸다.
      #
      # [2026-09-21 잡음 축] wz_std 0.5 -> 0.35. 표본 잡음은 wz_std 에 **비례**한다
      # (7.1 식) → x0.70. batch 2000 과 합쳐 주기당 잡음 0.0159 -> 0.0079 예상이고,
      # 그게 DWB 수준(직진 조향 반전 17 회/분)에 닿는 유일한 조합이다.
      # **대가**: 회전 후보의 폭이 준다 = 회전 권한 감소. 08-29 에 MPPI 를 접은
      # 이유가 "유턴을 못 해 도착 실패" 였으므로 완주 실패가 첫 중단 신호다.
      # 다만 이번엔 time_steps·prune_distance 가 유턴을 **반대 방향으로** 돕는다 —
      # 그래서 U턴 제자리 비율이 안 좋아져도 **누구 탓인지 모른다**(의도된 맞바꿈).
      # [2026-09-21 5차] wz_std 0.35 -> 0.5 로 되돌린다. **이번 회차의 유일한 변수다.**
      # 이 값은 회전 후보의 폭이다 — 넓히면 '확 꺾는' 답이 후보에 들어와 유턴을 호로
      # 돌 수 있고, 좁히면 잔떨림이 준다. **둘을 반대로 움직이는 단일 노브**라 지금까지
      # 잔떨림 쪽에 붙여 뒀다(run27~32). 이제 잔떨림은 DWB 급(손잡이 좌우속도 0.071 vs
      # 0.084)까지 왔으므로 유턴 쪽으로 되돌려 대가를 잰다.
      # 볼 것: U턴 제자리 비율(run30 61 %)이 얼마나 내려가고 잔떨림이 얼마나 돌아오는지.
      vx_std: 0.3
      vy_std: 0.0
      # [2026-09-21 6차] 0.5 -> 0.42. 0.35 와 0.5 의 중간이다.
      #   0.35(run32)  제자리 15.9 % · 일반코너 33 % · 손잡이 0.072 · 벽여유 0.89
      #   0.50(run33)  제자리  5.6 % · 일반코너  0 % · 손잡이 0.096 · 벽여유 0.30
      # 일반 코너의 제자리 회전은 0.5 가 확실히 고쳤다(33 -> 0 %). 대가는 잔떨림
      # +33 % 와 벽여유였다. 0.42 로 그 사이를 찾는다.
      # **U턴 제자리는 55 -> 50 % 뿐이라 이 축으로는 안 고쳐진다** — 유턴은 별개 축.
      wz_std: 0.42

      AckermannConstraints:
        min_turning_r: 0.5          # DiffDrive 에서는 참조되지 않는다

      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # 장애물. consider_footprint 가 이 설정의 안전 축이다(위 전제 문단).
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        # [2026-09-18 run24 후 되돌림] 2.2 로 올려 일반 코너 벽 여유를
        # 0.73 -> 0.95 m 로 벌었지만(요구 ② 유일한 성공), 같은 회차에 직진
        # 흔들림이 17.3 -> 46.3 회/분으로 터졌다. 공식 README 가 "장애물 critic 이
        # 잘 조율되지 않으면 심하게 흔들린다"고 경고하는 값이라 함께 되돌린다.
        # 다만 직진 구간 벽 여유가 평균 1.31 m(> inflation 0.55)라 이 값이
        # 직진 흔들림의 주범일 수는 없다 — 코너 쪽 몫만 되돌리는 것이다.
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.10
        near_goal_distance: 0.5
        # 아래 둘은 costmap 의 inflation_layer 와 **반드시 같아야** 한다.
        # critic 이 이 값으로 비용에서 거리를 역산하기 때문이다.
        inflation_radius: 0.55
        cost_scaling_factor: 3.5

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        # 경로의 5 % 넘게 점유되면 정렬을 포기한다 — 레일 위에 사람이 섰을 때
        # 억지로 경로에 붙지 않고 ObstaclesCritic 이 이기게 하는 장치다.
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      # 경로 위 '앞 점'을 향해 나아가는 힘. (PreferForward 는 후진에만 벌점이라
      # 이 역할을 못 한다 — 이 판단 자체는 run24 에서도 유효했다.)
      #
      # [2026-09-18 run24 후 되돌림] 6.0/offset 8 은 실패했다. offset 은 '미터'가
      # 아니라 **경로 점 개수**이고 우리 경로 점 간격은 5 cm 다. 게다가 기준점은
      # 로봇이 아니라 **궤적이 닿는 가장 먼 경로점**에서 재므로, 제자리에서 돌면
      # 궤적이 안 나아가 기준점이 1.2 m -> 0.4 m 로 무너진다. 코앞을 보면 크게
      # 돌라는 답이 나오고, 크게 돌면 또 안 나아간다(제자리가 제자리를 부른다).
      #
      # [함께 보지 말 것] threshold_to_consider 1.4 는 "경로 끝이 1.4 m 안이면
      # 이 critic 을 끈다"는 뜻이고, GoalCritic 은 같은 1.4 m 에서 **켜진다**.
      # prune_distance 가 1.5 m 라 그 스위치에서 10 cm 옆에 산다. 이 축을 건드릴
      # 거면 threshold 가 아니라 prune_distance 를 늘려야 한다(3순위 후보).
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0            # 08-29 실측값
        offset_from_furthest: 5     # 08-29 실측값 (nav2 기본은 6)
        threshold_to_consider: 1.4

      # 로봇 방향과 '앞 점' 방향의 차이에 벌점. 유턴처럼 각이 클 때 강하게 걸려
      # **제자리에서 빨리 돌라**는 압력이 된다.
      # [2026-09-18 run24 후 되돌림] offset 6 은 PathFollow 와 같은 덫에 걸린다.
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4     # 08-29 실측값
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

      # 후진에만 벌점(vx_min 0.0 이라 사실상 보험). 제자리 회전과는 무관하다.
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5

      # 모든 회전에 벌점 → 손잡이 흔들림을 잡는 **감쇠**이자 유턴을 막는 장치다.
      # nav2 기본은 10.0. 08-29 에 10 -> 3 으로 낮춰 |w| 가 0.043 -> 0.056 이 됐다.
      #
      # [2026-09-18 run24 후 되돌림] "흔들림이 늘면 여기부터 되돌린다"고 적어 뒀고,
      # 실제로 늘었다(17.3 -> 46.3 회/분). 3.0 으로 되돌린다.
      # 제어의 기본이다 — 따라가는 힘(PathFollow)을 올리면서 감쇠(여기)를 같이
      # 낮추면 반드시 진동한다. run24 는 그 둘을 동시에 반대로 돌린 대가였다.
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0            # 08-29 실측값

    # ── 이전 controller (되돌릴 때 이름을 FollowPath 로 바꾼다) ──────────────
    # DWB parameters
    FollowPathDWB:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      # 2026-08-13: 0.26 -> 0.5. 사용자 요구다 — 안내 보행 0.8~1.1 m/s 에 비해
      # 너무 느렸다. 회전(max_vel_theta)은 이번에 건드리지 않는다. 한 번에 한
      # 축이고, 회전은 별도 병목으로 따로 잰다.
      max_vel_x: 0.5
      max_vel_y: 0.0
      # 2026-08-29: 0.4 -> 0.5 (NAV2-B7 3단계). 8/13 에 직진을 0.26 -> 0.5 로
      # 올리며 "회전은 따로 재겠다"고 미뤄둔 뒤 처음 건드린다.
      #
      # 상한이 실제 병목임을 bag run1241 로 확인했다.
      #   이동 중 105.7 s,  |w| 중앙 0.160,  p90 0.400 = 상한
      #   상한(0.38 이상)에 붙어 있던 시간 18.4 s = 이동 시간의 17.4 %
      # 열 번 중 한 번은 상한에 눌려 있다. 5 % 수준이었다면 올려도 소용없었다.
      #
      # 0.55 가 아니라 0.5 인 것은 변화 폭 때문이다(25 % vs 37.5 %). 위험으로는
      # 둘 다 안전하다 — 손잡이가 받는 횡속도(|w| x 0.415)가 0.047 -> 0.059 m/s
      # 인데 RPP 탈락선이 0.115 였다. 효과가 확인되면 다음 회차에 0.6 으로 올린다.
      #
      # **유턴 폭은 이 값으로 안 줄어든다.** 작게 도는 것은 원래도 가능하다
      # (r = v / w 이므로 v 를 낮추면 반경이 준다). 막고 있는 것은 DWB 점수표이고
      # 그쪽은 B7 2단계다. 이 값이 바꾸는 것은 '같은 궤적을 더 빨리 지나가는 것'이다.
      #
      # 되돌릴 신호: 손잡이가 휘둘린다는 사람 판정. 로그보다 그쪽이 우선이다.
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.0 # 2.5 주행 시작 시 너무 튀어나가서 줄임
      acc_lim_y: 0.0
      acc_lim_theta: 2.0 # 3.2 회전 시작 속도 줄임
      # 장애물 회피·취소·controller 정지 등 모든 상황의 실제 제동력이므로 전역
      # 최대치를 유지한다. 도착 시 완만함은 velocity_smoother.max_decel에서만
      # 별도로 완화한다 (guideline/vica_scenario.md 참고). E-stop 0 출력은
      # Safety가 별도 처리한다.
      #
      # 2026-08-13: -2.5 -> -1.5. 속도를 0.5 로 올리면서 smoother 와의 정합이
      # 깨지기 때문이다. DWB 는 이 값으로 "여기서 설 수 있다"를 계산하는데,
      # 실제 감속은 smoother 가 낸다. 낙관적으로 계획할수록 계획한 정지선을
      # 넘는다:
      #   0.5 m/s, DWB -2.5 / smoother -1.0  ->  초과 7.5 cm   padding 5 cm 넘음
      #   0.5 m/s, DWB -1.5 / smoother -1.25 ->  초과 1.7 cm   덮인다
      # 제동력을 줄인 것이 아니라 계획을 보수적으로 만든 것이다. 실제 제동은
      # smoother 가 -1.25 로 이전보다 오히려 세다. 계약은
      # test_velocity_smoother_linear_decel_matches_dwb 가 지킨다(하한 1.0 도 있다).
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      # 2026-08-02: 1.7 -> 2.5. DWB가 내다보는 거리를 늘린다.
      #
      # DWB는 '거리'가 아니라 '시간'을 내다본다. sim_time x max_vel_x 가 궤적
      # 길이이므로 지금 값은 이렇게 계산된다.
      #
      #   1.7 x 0.26 = 0.44 m  + footprint 앞단 0.355 m = 검사 도달 0.80 m
      #   2.5 x 0.26 = 0.65 m  + 0.355 m               = 검사 도달 1.01 m
      #
      # obstacle_max_range 는 3.0 m 인데 DWB 는 0.80 m 앞만 검사했다. 즉 costmap 에
      # 찍힌 2.2 m 분을 controller 가 한 번도 읽지 않았다. run1104 에서 의자가
      # 1.5 m 앞에 찍히고 4초 뒤 LETHAL 이 됐는데 그 4초 동안 감속이 없었던 이유다.
      #
      # ObstacleFootprint.scale 은 0.15 그대로 둔다. 같은 날 0.6 을 시험했다가
      # 궤적 전멸이 152회로 뛰어 되돌렸다(위 critic 주석 참고). '거부 세기'가
      # 아니라 '보는 거리'만 바꾸는 것이 이번 변경의 취지다.
      #
      # **대가는 계산량이다.** 궤적당 자세 수가 sim_time/granularity 에 비례해
      # 약 1.5배가 된다. 궤적 400개 x 자세 68개 -> 100개. run1104 에서 이미
      # "Control loop missed its desired rate of 20 Hz" 가 19회 나왔으므로,
      # 주행 후 이 횟수를 먼저 센다:
      #   grep -c "missed its desired rate" ~/.ros/log/controller_server_*.log
      # 크게 늘면 sim_time 을 2.0 으로 낮추거나 vx_samples/vtheta_samples 를 줄인다.
      #
      # 또 하나. 궤적이 길어지면 그만큼 LETHAL 을 밟을 확률도 올라가므로
      # "No valid trajectories" 가 함께 늘 수 있다. scale 0.6 때(152회)만큼
      # 뛰면 이 방향도 통로 폭에 막힌 것이다.
      #
      # ── 2026-08-02: 2.5 -> 2.0. 위 우려가 실제로 나타났다 ─────────────────
      # padding 0.04 회차에서 No valid trajectories 가 74회였고, 거부 사유 30회가
      # "궤적의 100 % 가 장애물에 걸림"이었다. 좁은 통로에서 1.00 m 앞까지
      # 안전한 경로를 요구하니 그린 궤적이 전부 벽·가구 다리에 닿는다. 실제로는
      # 20~30 cm 씩 조금씩 움직이면 빠져나올 수 있는 자리다.
      #
      #   1.7 x 0.26 + 0.355 = 0.80 m 검사   <- 의자에 박던 값
      #   2.0 x 0.26 + 0.355 = 0.87 m        <- 이번. 여전히 1.7 보다 멀리 본다
      #   2.5 x 0.26 + 0.355 = 1.00 m        <- 좁은 곳에서 불리
      #
      # 두 요구가 정면으로 부딪힌다. 멀리 보면 장애물을 미리 피하고(넓은 곳),
      # 짧게 보면 좁은 곳에서 해를 찾는다. DWB 는 이 값 하나로 둘 다 정하므로
      # 상황별로 바꿀 수 없다. 그 한계를 넘으려면 controller 자체를 바꿔야
      # 한다(MPPI 는 별도 브랜치에서 시험).
      #
      # **실패 신호**: 의자·사람 앞에서 감속이 늦어 다시 부딪히면 되돌린다.
      # 되돌릴 값은 2.5 다.
      #
      # ── 결과: 2.0 은 역효과. 2.5 로 되돌린다 (2026-08-02 16:36 실주행) ────
      #   No valid trajectories  74 -> **168회**  2.3배 악화
      #   좁은 경로는 한 번도 통과하지 못했다
      #
      # 예측이 틀렸다. "짧게 보면 좁은 곳에서 해를 찾는다"고 봤는데 반대였다.
      # 궤적이 짧아지면 **장애물을 피해 돌아나가는 곡선을 그릴 여유가 없어진다.**
      # 0.88 m 앞만 보면 "이 앞은 막혔다"만 보이고, 그 너머로 빠져나가는 경로를
      # 못 그린다. 우회 궤적은 멀리 봐야 나온다.
      #
      # ═══ 2026-08-30: 2.0 으로 간다. 위 8/02 실패와 조건이 다르다 ═══
      #
      # 위 기록은 max_vel_x 가 0.26 이던 때다. 그 뒤 0.5 로 올렸으므로 같은
      # sim_time 이라도 실제로 검사하는 거리가 다르다.
      #
      #   8/02 실패한 2.0   2.0 x 0.26 + 0.355 = 0.875 m
      #   8/02 되돌린 2.5   2.5 x 0.26 + 0.355 = 1.005 m
      #   2026-08-30  2.5   2.5 x 0.50 + 0.355 = 1.605 m
      #   2026-08-30  2.0   2.0 x 0.50 + 0.355 = 1.355 m  <- 8/02 의 2.5 보다 멀다
      #
      # 즉 지금의 2.0 은 8/02 에 "안전하다"고 판정한 거리보다 35 % 멀리 본다.
      # 그때 실패한 조건이 아니다. 위 문단의 "우회 궤적은 멀리 봐야 나온다"는
      # 여전히 옳고, 지금 2.0 이 그 조건을 만족한다.
      #
      # ── A/B 실주행 3회 (같은 날, 같은 구역) ───────────────────────────
      #                    run0918(2.5)  run0928(2.0)  run0948(2.0)
      #   이동거리            23.2 m        57.8 m        36.3 m
      #   --- 10 m 당으로 정규화 ---
      #   3초 이상 정지        4.3 건        2.2 건        3.3 건
      #   정지 누적           56.5 초       36.7 초       38.2 초
      #   lethal 로그         16.4 회        8.7 회        3.9 회
      #   No valid traj        0.0 회        0.5 회        0.6 회
      #   움직인 시간 비율       32 %          38 %          39 %
      #
      # **갇혀 있는 시간이 3분의 2로 줄고 움직이는 비율이 32 -> 39 % 로 올랐다.**
      # 2.0 두 회차가 서로 일관되므로 우연이 아니다. 사용자 체감도 "좁은 길을 더
      # 잘 다닌다" 였다. 정지 '건수'만 늘었는데 누적 시간은 그대로라, 오래 갇히는
      # 대신 짧게 멈췄다 가는 쪽으로 바뀐 것으로 읽는다. 회전 속도는 이 값과 무관하다 -- 목적지 접근 감속(/speed_limit 60 %)이
      # 상한을 정하므로 sim_time 으로는 안 바뀐다(제한 0 % 일 때 28.6 도/초,
      # 60 % 일 때 17.2 도/초로 **둘 다 상한을 꽉 쓴다**).
      #
      # **실패 신호 - 이것이 늘면 2.5 로 되돌린다**
      #   No valid trajectories 가 10 m 당 1회를 넘는다 (2.0 두 회차 0.5·0.6회로
      #   안정적이다. 8/02 실패 때는 168회였으니 규모가 다르다)
      #   좁은 곳 통과 실패가 는다
      # 되돌릴 값은 2.5 다.
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: True
      stateful: True
      # BaseObstacle은 "원형 로봇"을 가정하고 궤적 각 자세에서 중심 셀 하나만
      # 조회한다. VICA footprint는 x -0.595~+0.305, y ±0.2275(길이 0.900, 폭
      # 0.455)이라 padding 0.05 적용 후 inscribed 0.2775 m와 circumscribed
      # 0.6506 m가 2.3배 차이난다.
      # 중심이 free여도 후방 0.595 m나 전방 0.305 m가 장애물에 들어가 있을 수
      # 있고, inflation은 방향 무관 등방성이라 이 방향 의존성을 표현하지 못한다.
      # 최협 통로 반폭 0.35 m < circumscribed 0.6506 m이므로, 그곳에서 제자리
      # 회전하면 후방이 부딪히는데 BaseObstacle로는 이를 걸러낼 수 없다.
      # (2026-08-06 수치 갱신: 이 문단은 원래 사각형 footprint 기준으로
      #  x -0.60 / inscribed 0.277 / circumscribed 0.692라 적혀 있었다. 2026-08-02
      #  육각형 전환으로 외접이 0.675 -> 0.651로 줄었다. 결론은 그대로다.)
      # ObstacleFootprint는 궤적 각 자세에 footprint를 놓고 변을 순회한다.
      #
      # 교체만으로 서행이 11.0 -> 7.9 s로 줄었고 제어주기도 버텼다(중앙값
      # 50.1 ms, 75 ms 초과 1.0 %). short_circuit_trajectory_evaluation이
      # True라 조기 탈락이 유지되는 덕이다.
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # critic은 '충돌하면 무효'라는 하드 판정만 정확하게 만든다. '장애물에서
      # 멀어지려는 선호'의 세기는 scale이 정한다. 0.08에서는 무게가 이랬다:
      #   ObstacleFootprint 최대 기여 = 253 x 0.08 = 20.2
      #   PathDist 경로 이탈 1셀(5 cm) = 32
      # 장애물 비용을 최대로 물어도 경로에서 3 cm 벗어나는 것보다 싸서, 경로가
      # 벽에 붙어 있으면 그대로 따라갔다(측면 여유 0.415 -> 0.411 m, 무변화).
      # inflation 곡선 cost = 253*exp(-3.5*(d-0.277))로 계산하면 벽 이격을
      # 0.35 -> 0.45 m로 옮기는 이득이 58이고 대가가 경로 이탈 2셀 = 64이라
      # 손익분기 scale이 약 1.1이다.
      #
      # 0.3으로 올렸더니 좁은 곳에서 로봇이 갇혔다(2026-07-28). 전방 여유가
      # 0.146 m(중심 기준 0.451 m)인 지점에서 46초간 한 발도 못 나갔고,
      # /plan은 계속 나오는데 /cmd_vel_nav에 5.2초짜리 공백이 반복됐다.
      # 경로는 멀쩡한데 controller가 유효 궤적을 하나도 못 찾은 것이다.
      # inflation_radius 0.45가 최협 통로 반폭 0.35 m보다 커서 좁은 곳은 전부
      # 비용 지대인데, scale 0.3이 그 비용을 무겁게 쳐 모든 궤적이 탈락했다.
      # 회피 선호는 남기되 궤적이 전멸하지 않도록 0.15로 낮춘다.
      # 이래도 갇히면 다음은 inflation_radius를 0.45 -> 0.38로 낮춰 최협
      # 통로에 비용 0인 중앙선을 만드는 것이다.
      #
      # 2026-07-30: 0.15 -> 0.5. 이유는 '회피 선호'가 아니라 planner와 controller의
      # '충돌 임계값 비대칭'을 닫는 것이다. 기계어로 확인했다:
      #   dwb_critics ObstacleFootprintCritic::pointCost
      #       cmp w1, #0xfe (254 LETHAL) / cmp w1, #0xff (255 UNKNOWN) -> 예외
      #       0xfd(253 INSCRIBED) 비교가 없다 -> 253은 통과시킨다
      #   nav2_smac_planner GridCollisionChecker::inCollision
      #       cmp w1, #0xfc (252 초과 = 253 이상) -> 충돌 (footprint 전체)
      # 즉 253 밴드는 controller에게 합법이고 planner에게 금지다. DWB가 footprint를
      # 253 밴드에 넣으며 정상 주행하다가, 그 자리에서 planner가
      # "Starting point in lethal space"로 아무 경로도 못 내고 굳는다. 부딪히지도
      # 않았고 나갈 공간이 있는데 멈춘다.
      # 2026-07-30 주행 실측(bins36_people): 정지 지점의 로봇 중심 셀 값이 74~79
      # (경사 안, 합법)였고 중심이 99 이상인 샘플은 36개 중 0개였는데,
      # planner "Starting point in lethal space"가 22회, DWB "No valid"는 3회였다.
      # 대부분의 순간 셀은 253이었고 DWB만 괜찮다고 한 것이다.
      #
      # scale은 253 진입 비용을 정한다. PathDist.scale 32가 경로 1셀(5 cm) 이탈
      # 비용이므로 무게 비교는 이렇다:
      #   0.15 -> 253 x 0.15 =  38  = 경로 1.2셀   (싸다. 자유롭게 들어간다)
      #   0.5  -> 253 x 0.5  = 127  = 경로 4.0셀   <- 채택
      #   1.0  -> 253 x 1.0  = 253  = 경로 7.9셀
      # 2026-07-28에 0.3이 나빴던 기록은 planner가 SmacPlanner2D(점 로봇)로
      # 경로 자체가 달랐던 때다. 그때는 planner가 253 밴드를 지나는 경로를
      # 냈으므로 controller가 그것을 거부하면 전멸했다. 지금은 planner가
      # 253을 피한 경로를 내므로 controller가 같은 기준을 따르는 것이 정합이다.
      #
      # 2026-07-30 실측 (같은 코스 방2 -> 화장실 -> 안내소, 7회):
      #   scale 0.15  lethal space  1~25회 / DWB 무효   3~4회   완주 3/3 (사람 없음)
      #   scale 0.25  lethal space     28회 / DWB 무효     1회   완주 1/3
      #   scale 0.5   lethal space      2회 / DWB 무효   133회   완주 1/3
      # 0.5는 궤적이 전멸했고(44배), 0.25는 lethal space가 오히려 최다였다.
      # 완주한 것은 0.15뿐이므로 되돌린다.
      #
      # 임계값 비대칭(DWB 254 vs planner 253)은 여전히 열린 문제다. scale로는
      # 두 실패 모드 사이에 앉히지 못했다 - 0.15에서 lethal space가 1회(사람 없음)와
      # 25회(사람 있음)로 갈리므로, 이 값은 환경이 정하고 scale이 정하지 않는다.
      #
      # ── 2026-08-02: 0.15 -> 0.6. Lattice에서 다시 연다 ─────────────────
      # 위 7회 실측은 planner가 **Hybrid**일 때다. 이 브랜치는 Lattice이고,
      # 같은 주석 위 문단(2026-07-28 0.3 실패 기록을 무효로 본 대목)이 이미
      # "planner가 바뀌면 전제가 바뀐다"고 적었다. Lattice는 footprint 전체로
      # 253을 피한 경로를 내므로, controller가 같은 기준을 따르는 것이 정합이다.
      #
      # 오늘 실주행(run1104)에서 이 값이 왜 문제인지 실측으로 드러났다.
      # 의자에 정면으로 박은 구간을 bag으로 열어 보면:
      #
      #   11:10:36  전방 1.5 m 에 비용 79 로 찍힘        속도 0.20 m/s
      #   11:10:38  전방 1.0 m 에 비용 72               속도 0.22 m/s  감속 없음
      #   11:10:40  전방 0.5 m 가 LETHAL(99)            속도 0.24 m/s  감속 없음
      #   11:10:42  ─ 이제야 정지 ─                     속도 0.04 m/s
      #
      # 감지는 4초 전부터 되고 있었다. 피하지 않은 이유는 점수다:
      #   장애물 비용 79 x 0.15          =  11.8점
      #   경로에서 0.5 m 이탈 = 10셀 x 32 = 320점
      # 회피가 27배 손해라 직진이 이겼다. 로봇은 정확히 계산했고 저울이 틀렸다.
      #
      # 0.6이면 79 x 0.6 = 47점이 되어 경로 1.5셀(7.5 cm) 이탈과 맞먹는다.
      # "조금 비켜 간다"가 선택지가 된다.
      #
      # **관찰할 실패 신호**: Hybrid 때 0.5가 무너진 방식은 궤적 전멸이었다
      # (DWB "No valid trajectories" 3~4회 -> 133회, 44배). 주행 후 이걸 먼저 센다:
      #   grep -c "No valid trajectories" ~/.ros/log/controller_server_*.log
      # 두 자릿수로 뛰면 통로가 좁아 회피 유인을 감당 못 하는 것이므로 되돌린다.
      # 되돌리는 값은 0.15다. 중간값 0.25는 Hybrid에서 갇힘이 오히려 최다(28회)였다.
      #
      # ── 결과: 0.6 실패. 0.15로 되돌린다 (2026-08-02 12:00 실주행) ────────
      #   No valid trajectories       몇 회 -> 152회   (Hybrid 0.5의 133회보다 나쁘다)
      #   planner "lethal space"       4회 -> 56회
      #   거부 사유 67회가 "1.00 ObstacleFootprint" = 궤적의 100 %가 장애물로 거부
      #   Goal 성공 3 / 실패 2. 멈췄다 복구했다를 반복하다 6회 재시도를 소진해 종료
      #
      # 다만 **부딪힘은 실제로 사라졌다**(사용자 보고). 회피 방향 자체는 옳았다.
      #
      # 이로써 scale로는 못 푼다는 것이 **두 planner에서** 확인됐다.
      #   Hybrid  0.5 -> 궤적 전멸 133회
      #   Lattice 0.6 -> 궤적 전멸 152회
      # planner를 바꿔도 같은 실패가 나므로 원인은 planner가 아니라 통로 폭이다.
      # 1.0 m 통로에서 inflation 0.45면 비용 0인 폭이 10 cm뿐이라, 회피 유인을
      # 세게 주면 모든 궤적이 비용 지대를 지나 전멸한다. 파고들기(0.15)와
      # 멈춰서기(0.6) 사이에 앉힐 값이 없다.
      #
      # 다음 시도는 scale이 아니라 **더 일찍 보기**다(sim_time). 거부 세기를
      # 건드리지 않으므로 궤적 전멸이 늘지 않는다.
      ObstacleFootprint.scale: 0.15
      # ── 2026-08-29: PathAlign 32 -> 48, GoalAlign 24 -> 36 (NAV2-B7 2단계) ──
      # 유턴할 때 DWB 가 제자리 회전을 고르지 않는 이유는 점수 구조다.
      #   전진 궤적    PathDist(32)+GoalDist(24)+PathAlign(32)+GoalAlign(24) = 112점
      #   제자리 회전  위치가 안 변해 PathDist·GoalDist 가 0점 -> 56점만 경쟁
      # sim_time 2.5 s 뒤 전진 궤적은 1.25 m 앞에 있고 제자리 회전은 그 자리다.
      # 그래서 위치 기반 두 critic 에서 구조적으로 진다. 방향 정렬 배점을 1.5배로
      # 올려 크게 틀어진 자리에서 회전이 이길 수 있게 한다.
      #
      # PathDist/GoalDist 를 낮추지 않는 이유: 그 둘이 '앞으로 가라'고 시키는 유일한
      # critic 이다. 낮추면 전진 유인 자체가 사라져 제자리에서 방향만 맞추고 안 간다.
      #
      # 위험: 배점이 직진 구간에도 적용되어 미세 조향이 는다. 2026-07-28 에 경로가
      # 굽은 지점에서 '앞 1 m 누적 꺾임 31~2639도'로 로봇이 조향을 강요받은 기록이
      # 있다(§planner 주석).
      # **되돌릴 신호: 회전 반전이 9.8 -> 12 회/분을 넘으면 실패다**(run1326 기준.
      # 이 지표는 /cmd_vel_safe 로만 재므로 사람이 로봇을 옮겨도 오염되지 않는다).
      # 성공 신호: 주행 중 제자리 회전 최장이 3 s(70도) 이상.
      # [실주행 미검증] 되돌리려면 32.0 / 24.0.
      PathAlign.scale: 48.0
      # forward_point_distance는 "로봇 앞 이 거리의 점"을 경로에 정렬시키는
      # 기준점이다. 0.1은 footprint 전방(0.305) 안쪽, 즉 차체 내부라서
      # PathAlign이 PathDist와 하는 일이 겹쳐 방향 정렬 정보가 사라진다.
      # 그러면 코너를 미리 보고 꺾지 못하고 도달해서야 반응하므로 감속한다.
      # 2026-07-28 주행에서 코너 구간의 |wz|-vx 상관이 -0.389였다(코너 없는
      # 구간은 -0.116). Nav2 기본값 0.325로 되돌린다.
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 36.0   # 위 PathAlign 문단 참고 (24 -> 36, 같은 1.5배)
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      # [근거 없음] nav2 기본값은 3×3이다. 6×6으로 키운 경위를 적은 주석도
      # devlog 기록도 없다. 2026-08-06 전수 점검에서 확인했다.
      #
      # 판단에 쓸 수 있는 재료만 적어 둔다(추정이며 검증되지 않았다):
      #   - rolling_window 이므로 6×6 은 로봇 중심 반경 3.0 m 를 담는다.
      #     아래 raytrace_max_range 3.5 m 는 그래도 맵 밖으로 나간다.
      #   - DWB 가 실제로 검사하는 거리는 sim_time 2.5 × 0.26 + footprint 앞단
      #     0.355 = 1.01 m 라 3×3(반경 1.5 m)로도 담기기는 한다.
      #   - 대가는 셀 수다. 6 m/0.05 = 120셀 → 14,400셀로 3×3(3,600셀)의 4배다.
      #     update_frequency 5.0 Hz 로 갱신하므로 CPU 여유를 볼 것.
      # 줄이려면 raytrace_max_range 와 함께 판단해야 한다.
      width: 6
      height: 6
      resolution: 0.05
      # robot_radius: 0.22
      # footprint는 vica_description/meshes/base_link.stl의 XY 투영 실측값이다.
      # URDF collision origin이 z만 오프셋(xyz="0 0 -body_center_z")이라 STL x/y는 base_link
      # 좌표와 직접 대응한다. 실측 bbox: x -0.505~+0.305, y ±0.227.
      #   전방 +0.305 : 구값 +0.15은 실제보다 15.5 cm 짧아 커브 중 전방 범퍼가
      #                 costmap상 free 영역을 쓸고 지나가 실제 충돌이 발생했다
      #                 (2026-07-27 화장실 주행). LiDAR(+0.185)·카메라(+0.287)·
      #                 전방 캐스터(+0.252)가 모두 구값 바깥이었던 것이 방증이다.
      #   좌우 ±0.227 : 구값 ±0.1875는 각 4 cm 짧았다.
      #   후방 -0.565 : 2026-07-29 줄자 실측(중심 -> 핸들 끝 56.5 cm). STL은 -0.505로
      #                 6 cm 짧아 후방부를 신뢰할 수 없다. 같은 날 핸들 기둥 위치도
      #                 CAD(-0.265~-0.305) 대비 실측(-0.205)이 7~10 cm 어긋났다.
      #                 구값 -0.60은 STL만 보고 "안전 여유"로 얹은 3.5 cm였는데,
      #                 실측이 -0.565로 나와 근거가 사라졌다. 전방·좌우와 같이
      #                 실측 + padding 0.05로 통일한다.
      #
      #                 효과는 외접반경 0.707 -> 0.675 m다. 지도 free 면적 106.4 m2 중
      #                 제자리 회전 가능 면적이 42.0 -> 44.0 %가 된다(+2.2 m2).
      #                 다만 이것으로 갇힘이 풀리지는 않는다. planner가 보는 면적은
      #                 내접 0.277 기준 74.9 %라 격차가 여전히 30.9 %p다.
      # test_footprint_contract가 이 값과 실측의 정합을 감시한다.
      #
      # ── 2026-08-02: 사각형 -> 육각형. 손잡이를 실제 폭으로 표현한다 ──────
      # 줄자 재실측: **손잡이 제외 차체 61 cm · 손잡이 돌출 29 cm · 합계 90 cm**
      #              가로 45.5 cm · 손잡이 가장 넓은 곳 **7 cm**
      #              손잡이는 높이 80 cm · 라이다 포함 차체 높이 38 cm
      #
      # base_link(구동륜 축) 기준으로 앞 +0.305, 차체 뒤 -0.305(=61 cm 대칭),
      # 손잡이 끝 -0.595(=차체 뒤에서 29 cm 더). 즉 차체는 앞뒤 대칭이고 뒤로
      # 29 cm 더 나온 것은 손잡이 하나다. 그런데 사각형 footprint 는 그 29 cm 를
      # **차체 폭 45.5 cm 로 꽉 찬 것**으로 다뤘다. 실제로는 폭 7 cm 막대다.
      #
      # 이 과대평가가 코너 통과를 막고 있었다. R=0.5 호로 1.0 m 코너를 돌 때
      # 필요한 폭(padded footprint 스윕):
      #
      #     사각형   0.990 m   1.0 m 코너 여유 +1 cm    <- 벽 요철 하나에 막힌다
      #     육각형   0.750 m                 +25 cm
      #
      # 2026-08-02 실주행에서 "1 m 폭 구간에서 코너 돌아 빠져나올 때 못 나오고
      # 같은 자리에서 계속 멈춘다"가 이 1 cm 였다.
      #
      # **손잡이를 뺀 것이 아니다.** 여전히 footprint 안에 있고 뒤로 56.7 cm 를
      # 차지한다. 폭만 실제값(7 cm)으로 줄였다. 손잡이 높이 80 cm 는 사람 허리
      # 높이이고 책상 상판 72 cm · 의자 등받이 75 cm 도 그 대역이라, 후방 보호를
      # 없애면 회전할 때 사람을 친다. Nav2 는 2D footprint 하나만 쓰므로
      # "낮은 장애물엔 무시, 높은 것엔 적용"을 할 수 없다.
      #
      # 외접반경은 0.675 -> 0.651 m 로 거의 그대로다. 손잡이 끝이 여전히 가장
      # 먼 점이기 때문이다. 즉 **제자리 회전 능력은 나아지지 않는다**(필요 폭
      # 1.35 -> 1.30 m). 좋아지는 것은 호로 돌 때의 스윕 폭이다.
      #
      # 대가: 내접반경이 0.277 -> 0.085 m 로 줄어든다. 내접원은 "어디든 이 안은
      # 무조건 안전"이라 빠른 판정에 쓰이는데, 뒤가 뾰족해지니 작아진다.
      #   좋은 면 - planner 의 "Starting point in lethal space" 판정이 완화된다
      #             (2026-08-02 회차마다 14회씩 나던 갇힘의 직접 원인)
      #   나쁜 면 - 매번 육각형 변을 훑어야 해서 planner/controller 가 무거워진다
      #             [미검증] Control loop missed 가 늘면 이 대가가 큰 것이다
      #
      # 볼록 다각형이다(꼭짓점 6개, 외적 부호 일정). Nav2 costmap 이 요구한다.
      #
      # ── 2026-08-13: 하드웨어 최종 실측. 손잡이가 29 -> 19 cm 로 짧아졌다 ──
      #
      #   차체 61 cm(앞뒤 대칭 ±0.305) · 손잡이 19 cm · 총 세로 80 cm
      #   반폭 0.225(전체 폭 45 cm) · 손잡이 최대폭 7 cm
      #
      # 후방 -0.495 = -0.305 - 0.19 이다. 폭은 0.2275 -> 0.225 로 1.5 mm 줄었다.
      # STL(±0.2265)보다 1.5 mm 작지만 CAD 보다 줄자를 우선한다 — 후방부가 6 cm
      # 틀렸던 전례가 있다(위 2026-07-29 문단). test_footprint_contract 가 그
      # 차이를 1 cm 까지만 허용하므로, CAD 와 실물이 더 벌어지면 시험이 잡는다.
      #
      # padding 0.05 포함 효과:
      #   내접  0.2775 -> 0.275 m    통과 가능성. 거의 그대로다
      #   외접  0.651  -> 0.552 m    제자리 회전. 10 cm 줄었다
      #   제자리 회전 필요 직경  1.30 -> 1.10 m
      #   L자 코너 최소 통로     0.728 -> 0.670 m (스윕 시뮬레이션)
      # 손잡이가 외접반경을 지배하므로 뒤를 줄인 효과가 회전에 그대로 나타난다.
      #
      # ── 2026-08-29: 손잡이가 다시 짧아졌다. 19 -> 11 cm (사용자 실측 확정) ──
      #
      #   차체 61 cm(앞뒤 대칭 ±0.305, 그대로) · 손잡이 11 cm · 총 세로 72 cm
      #   반폭 0.225(전체 폭 45 cm, 그대로) · 손잡이 최대폭 7 cm
      #
      # 후방 -0.415 = -0.305 - 0.11 이다. 앞(+0.305)과 폭(±0.225)은 손대지 않았다.
      #
      # padding 0.05 포함 효과:
      #   내접  0.275 -> 0.275 m    통과 가능성. **바뀌지 않는다** - 내접은 가장
      #                             가까운 변까지의 거리이고 그 변은 차체 좌우 변이라
      #                             뒤를 아무리 줄여도 움직이지 않는다(2026-08-02 확인)
      #   외접  0.552 -> 0.473 m    제자리 회전. 7.9 cm 더 줄었다
      #   제자리 회전 필요 직경  1.10 -> 0.95 m
      #
      # 그래서 inflation_radius 0.56 은 손대지 않는다. 상·하한 [0.395, 0.650]
      # 판정이 내접에서만 나오기 때문이다. 외접 축소는 순수한 여유 증가다 -
      # 0.56 이 외접 0.473 을 이전(0.552)보다 넉넉히 덮는다.
      # L자 코너 최소 통로 0.670 m 는 2026-08-13 스윕 시뮬레이션 값이고 이번에는
      # 다시 돌리지 않았다. 세로가 8 cm 줄었으니 실제로는 이보다 작을 것이다.[미측정]
      #
      # 이 파일의 다른 곳에 남은 -0.595 · 0.495 · 0.2275 · 0.651 · 0.552 · 0.2775 는
      # 각각 2026-08-02 · 08-13 기준 기록이며 그때의 판단 근거로 남긴다.
      # 현재 값은 이 문단이다.
      #
      # 되돌리려면 아래 한 줄을 사각형으로 바꾼다:
      #   "[[0.305, 0.225], [0.305, -0.225], [-0.415, -0.225], [-0.415, 0.225]]"
      # 그러면 손잡이 11 cm 를 차체 폭으로 꽉 찬 것으로 다루게 되어 코너 통과
      # 폭이 다시 커진다. 육각형으로 바꾼 이유가 그것이다.
      # ── 2026-09-15 base_link 원점이 구동륜 축으로 15.4 cm 앞으로 옮겨졌다 ──
      # 모양·치수는 하나도 안 바뀌었다. 좌표 기준점만 바뀌어 x 가 전부 -0.154 다.
      #   앞  +0.305 -> +0.151   뒤 -0.415 -> -0.569   반폭 ±0.225 그대로
      # 근거는 VICA.xacro 의 axle_offset_x 주석. 줄자 실측값(앞 0.305 / 뒤 -0.415)은
      # test_footprint_contract.py 가 차체 중심 기준으로 그대로 들고 있고, 거기서
      # axle_offset_x 를 빼서 이 값과 대조한다.
      #
      # 이 한 줄로 바뀌는 판정 두 가지:
      #   내접 0.275 -> 0.201 m  (가장 가까운 변이 옆면에서 앞면으로 바뀐다)
      #   외접 0.4727 -> 0.6248 m  (제자리 회전 필요 폭 0.945 -> 1.250 m)
      # 뒤쪽이 실제로 쓸고 가던 15.4 cm 를 이제 검사한다. 대신 좁은 곳 제자리
      # 회전을 정당하게 거절하게 되므로 유턴 위치는 B8 에서 따로 푼다.
      footprint: "[[0.151, 0.225], [0.151, -0.225], [-0.459, -0.225], [-0.569, -0.035], [-0.569, 0.035], [-0.459, 0.225]]"
      # padding은 유일한 '하드 여유'다. inscribed radius = 0.227 + padding 이고
      # planner는 벽에서 그 거리까지 통과 가능으로 본다. padding 0.03이면 차체
      # 가장자리가 벽에 정확히 닿는 지점까지 경로가 허용되어 여유가 0이었고,
      # AMCL 오차만큼 그대로 충돌로 이어졌다. 0.06으로 3 cm 하드 여유를 준다.
      # 맵 최협 구간 반폭이 0.35 m라 inscribed 0.287에도 통과 여지가 남는다.
      # 2026-08-02: 0.05 -> 0.03. planner 의 "Starting point in lethal space" 를
      # 줄이려는 유일한 소프트웨어 수단이다.
      #
      # 그 판정은 **내접반경**이 정한다. Smac 의 GridCollisionChecker 는 로봇 중심
      # 셀이 253(INSCRIBED) 이상이면 **footprint 모양을 보지도 않고** 충돌로
      # 끝낸다. 그 253 밴드를 inflation_layer 가 칠하는 범위가 내접반경이다.
      #
      #   내접반경 = 차체 반폭 0.2275 + padding
      #     padding 0.05 -> 0.2775 m
      #     padding 0.03 -> 0.2575 m   (2 cm 얇아진다)
      #
      #   1.0 m 통로(반폭 0.50)에서 로봇 중심이 있어도 되는 폭
      #     0.05 -> 0.445 m      0.03 -> 0.485 m   (4 cm 넓어진다)
      #
      # 같은 날 footprint 를 육각형으로 바꿔 봤지만 이 판정에는 아무 영향이
      # 없었다(lethal space 14회 -> 14회). 내접반경은 '가장 가까운 변'까지의
      # 거리인데 육각형에서도 그 변은 여전히 차체 좌우 변이라 값이 그대로다.
      # 뒤를 뾰족하게 만드는 것은 2단계(실제 모양 검사)에만 효과가 있고,
      # 1단계(중심 셀 253 판정)는 좌우 폭이 정한다.
      #
      # 대가: 차체와 costmap 사이 하드 여유가 5 -> 3 cm 다. AMCL 오차·바닥
      # 미끄러짐이 3 cm 를 넘으면 그대로 접촉이다. costmap 해상도가 5 cm 라
      # 격자 반올림에 묻힐 가능성도 있다 [미검증].
      #
      # **실패 신호**: 벽·의자에 스치기 시작하면 되돌린다. 되돌릴 값은 0.05 다.
      # test_padding_keeps_a_hard_clearance_margin 이 0.05 하한을 요구하므로
      # 그 시험도 함께 고쳤다 - 근거는 그 시험 주석에 적었다.
      #
      # ── 결과: 0.03 실패. 0.05 로 되돌린다 (2026-08-02 15:16 실주행) ──────
      # 노린 효과는 나왔다. planner "lethal space" 14 -> 0회, 1 m 폭 구간을
      # 처음으로 통과했고 Goal 8개를 전부 달성했다. 그런데 대가가 컸다.
      #
      #   Control loop missed  0 -> 838회   (RViz·VS Code 종료 후에도 345회)
      #   사용자 보고: "직진 구간에서도 좌우로 움직인다" -> 다음 회차 "부딪혔다"
      #
      # 인과는 이렇다. padding 이 작아지면 내접반경이 줄어 Smac 의 '빠른 통과
      # 판정'(중심 셀이 내접원 안이면 footprint 검사 생략)이 덜 먹는다. 그만큼
      # 매 궤적마다 footprint 변 전체를 훑게 되어 20 Hz 제어 주기를 놓친다.
      # 반응이 늦어지면 0.26 m/s 로 4 cm 를 더 가는데, 여유가 3 cm 뿐이라
      # 그대로 접촉이다. **여유를 깎은 것이 계산을 무겁게 만들고, 무거워진
      # 계산이 여유를 잡아먹는** 되먹임이었다.
      #
      # 검사 비용을 둘레 기준으로 추정하면(궤적 400 x 자세 100):
      #   육각형 + 0.03  100 %      <- 부딪힘
      #   사각형 + 0.03  108 %      사각형은 뒤가 넓어 둘레가 길다. 더 무겁다
      #   육각형 + 0.05   77 %      <- 채택. 여유 회복 + 계산 23 % 감소
      #   사각형 + 0.05   83 %
      # 즉 되돌릴 축은 footprint 모양이 아니라 padding 이다. 꼭짓점 개수가
      # 아니라 둘레 길이가 비용을 정하기 때문이다.
      #
      # 1 m 구간은 다시 못 갈 것이다. 그 구간은 **계산을 먼저 가볍게 만든 뒤**
      # (궤적 샘플 축소 등) 다시 도전한다. 순서를 거꾸로 해서 사고가 났다.
      #
      # ── 2026-08-02 16:02: 부하가 풀렸다. 0.05 -> 0.04 로 다시 내린다 ──────
      # IMU 어댑터를 50 Hz 로 스로틀한 회차에서 부하 문제가 사라졌다.
      #
      #   Control loop missed  382 -> **0회**
      #   load average         17.1 -> 4.28 (코어 8개)
      #   ekf_node CPU         25.7 -> 4.5 %   (IMU 입력이 줄어 함께 가벼워졌다)
      #
      # 사용자 보고: "다 잘 갔는데 마지막 1 m 통로 구간에서 또 못 가고 섰다.
      # 코너만 나오면 완벽했다." 그 회차 planner lethal space 는 31회였다.
      #
      # 역설처럼 보이지만 설명된다. 제어가 제때 나가니 로봇이 계획 경로를 그대로
      # 따라가고, 그 경로가 좁은 통로 한가운데를 지나 253 판정에 걸린다. 부하가
      # 있던 회차에는 반응이 늦어 어정쩡하게 다니느라 그 자세에 덜 들어갔다.
      #
      # 'Starting point in lethal space' 를 줄이는 축은 **padding 뿐**이다.
      # 253(INSCRIBED) 밴드 반경 = 차체 반폭 0.2275 + padding 이고,
      # inflation_radius 는 253 바깥의 감쇠 비용만 정해 이 판정과 무관하다.
      # 오히려 inflation 을 낮추면 벽 근처가 덜 비싸져 로봇이 더 붙어 다니고
      # 253 진입이 늘 수 있다(0.45 회차의 벽 붙음이 그 방향이다).
      #
      #   padding   253 반경    1.0 m 통로 중심 허용폭   실측
      #    0.05     0.2775 m         0.445 m          lethal 5~31회
      #    0.04     0.2675 m         0.465 m          <- 이번 시험
      #    0.03     0.2575 m         0.485 m          lethal 0회 (부하 폭증 동반)
      #
      # 0.03 은 효과가 이미 확인됐지만(1 m 구간 통과·Goal 8개 전부 성공) 그때는
      # 계산이 무거워져 missed 838회가 났고 그 지연이 충돌로 이어졌다. 지금은
      # missed 0회라 여유가 있지만, 얼마나 남았는지는 모른다. 절반만 가서
      # **missed 가 0을 유지하는지 먼저 본다.** 유지되면 그때 0.03 을 검토한다.
      #
      # **실패 신호 둘.** (1) missed 가 다시 두 자릿수 이상 -> 계산이 감당 안 되는
      # 것이니 되돌린다. (2) 벽·의자에 스침 -> 여유 4 cm 가 부족한 것이니 되돌린다.
      # 되돌릴 값은 0.05 다.
      #
      # ── 결과: 0.04 는 문제를 planner 에서 controller 로 옮겼을 뿐이다 ──────
      # 2026-08-02 16:17 실주행.
      #
      #   planner lethal space   31 -> **0회**    노린 효과는 완벽히 나왔다
      #   No valid trajectories  12 -> **74회**   6배 폭증
      #   Control loop missed     0 -> 3회        부하는 문제없다
      #   Goal                성공2/실패1 -> 성공3/실패0
      #
      # 사용자 보고: "1 m 구간은 무시하고 지나갔는데, 안 서던 곳에서 유턴할 때
      # 장시간 서고 코너 정체가 심해졌다."
      #
      # 원인은 두 계층의 임계값 비대칭이다.
      #   planner(Smac)  253 이상 = 충돌   <- padding 이 정한다. 완화됐다
      #   controller(DWB) 254 만 충돌      <- 코드에 박혀 있어 못 바꾼다
      # padding 을 줄이면 planner 만 완화되어, **로봇이 planner 허락을 받고
      # 들어간 자리에서 DWB 가 움직일 방법을 못 찾는다.** 거부 사유 30회가
      # "궤적의 100 % 가 장애물에 걸림"이었고 복구 Spin 2회는 모두 실패했다.
      #
      # 사용자 판정: "패딩은 0.3~0.5 를 다 해봤는데 0.5 가 가장 안정적이다."
      #
      # 0.04 + sim_time 2.0 조합도 시험했으나 더 나빴다(No valid 74 -> 168회,
      # 좁은 경로 한 번도 통과 못 함). 0.05 로 확정한다.
      #
      # **그리고 이 회차에서 새 기준이 나왔다.** 사용자 관찰:
      #   "패딩을 줄이니까 유턴해서 나올 때 회전 반경이 넓어져서
      #    이용자가 위험할 것 같다"
      #
      # padding 이 작으면 넓은 공간이 합법이 되어 planner 가 **큰 호**를 고른다.
      # 로봇에게는 부드러운 경로지만, 뒤에 사람이 핸들을 잡고 따라온다. 크게 돌면
      # 핸들 끝(뒤 59.5 cm)이 그리는 호가 더 커지고, 사람이 훨씬 많이 움직여야
      # 하며 다음 동작을 예측하기 어렵다. 옆 가구에 사람이 부딪힐 수 있다.
      #
      # **로봇에게 좋은 경로가 사람에게 나쁜 경로다.** 그동안의 판정은 전부
      # "로봇이 통과하는가"였고 "사람이 따라올 수 있는가"는 계산에 없었다.
      # padding 은 회전 반경을 억제하는 역할도 한다 - 이 축에서도 0.05 가 낫다.
      #
      # 이로써 이 축도 양쪽 실패로 닫혔다.
      #   0.05 planner 가 막는다(lethal 31회)  0.04 DWB 가 막는다(No valid 74회)
      #   0.03 DWB 26회 + 계산 폭증 -> 충돌
      # ObstacleFootprint.scale · inflation · 회전반경에 이어 네 번째다. 남은
      # 축은 controller 교체(MPPI)이며 별도 브랜치에서 시험한다.
      footprint_padding: 0.05
      # nvblox_layer: LiDAR가 놓치는 3D 장애물을 보조로 반영한다. slice는 Docker의
      # nvblox_node가 odom frame으로 발행하므로 nav2_costmap_global_frame(odom)과
      # 정합해 TF 없이 병합된다. Host에 nvblox_nav2 plugin이 없으면 이 layer 때문에
      # local costmap configure가 실패한다(test_nvblox_dependency_contract가 감시).
      # 2026-08-28 사용자 판정: nvblox 를 빼고 라이다 단독으로 주행한다.
      # 카메라 잔상(6~30 s) 문제로 nvblox 노드를 안 띄운 채 운용해 왔고, 층만
      # 남긴 구성은 데이터 없이 굶은 눈이었다 — 구성을 현실과 일치시킨다.
      # 대가: 라이다 평면(지면 0.382 m) 밖 장애물은 이제 어떤 층도 못 본다.
      # 낮은 상자·책상 상판을 피하지 못한다(같은 날 실기에서 충돌 보고).
      # 시험 구역에서 그 높이의 물체를 치우고 운용한다.
      # 복귀는 이 리스트에 "nvblox_layer" 한 줄을 되살리면 된다 — 아래 블록은
      # 그대로 남겨 둔다 (test_nvblox_layer_contract 가 블록 존재를 감시한다).
      # 2026-08-31: range_sensor 레이어(전방 초음파) 추가. inflation 은 항상
      # 마지막이어야 한다(팽창은 다른 층이 다 그린 뒤에 한다).
      #
      # 센서별로 레이어를 분리한 이유(같은 날 실주행 usonic_drive03 실측):
      # 한 레이어에 두 토픽을 넣으면 확률 장부를 공유한다. 60도 부채꼴은
      # 0.185m 부터 겹치는데, 상자 옆면에 소리가 비껴 맞은 센서가 거짓
      # "에코 없음"을 내면 clear_on_max_reading 이 겹침 구역의 이웃 센서
      # 마크까지 지웠다 — LETHAL 109→0→109 깜빡임, 로봇이 상자를 밀고 감.
      # 레이어를 나누면 clear 는 자기 장부만 지우고, master 는 max 결합이라
      # 한쪽이라도 "장애물"이면 남는다. (사용자 제안, 2026-08-31)
      plugins: ["voxel_layer",
                "range_sensor_front_left", "range_sensor_front_right",
                "range_sensor_left_wheel", "range_sensor_right_wheel",
                "range_sensor_right_rear_wheel", "range_sensor_rear_right",
                "range_sensor_rear_left", "range_sensor_left_rear_wheel",
                "inflation_layer"]
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: odom  # local costmap global_frame과 일치해야 함
        # nvblox가 mapping_type: dynamic이면 정적/동적을 나눠 관리하고
        # combined_map_slice로 둘을 합쳐 발행한다. static_map_slice를 그대로
        # 두면 사람 같은 동적 장애물이 costmap에 들어오지 않는다.
        # 근거와 배경은 vica_nvblox_bringup/config/vica_nvblox_overrides.yaml 주석.
        #
        # 2026-07-30: local은 combined, global은 static으로 '분리'한다.
        # 두 costmap의 역할이 다르기 때문이다.
        #   local  <- combined_map_slice : 정적 + 동적. DWB가 사람을 실시간 회피한다.
        #   global <- static_map_slice   : 정적만. planner가 유령에 막히지 않는다.
        # 하나의 슬라이스로는 둘을 만족시킬 수 없다. 정적을 붙잡으려면 사람도
        # 붙잡히고, 사람을 놓으려면 정적도 놓친다.
        #
        # 근거(2026-07-30 실측): static_tsdf 하나로 global까지 먹이니 사람이 static
        # TSDF에 쌓여, 장애물이 사라진 뒤에도 global costmap에 중앙값 9 s / p95 46 s
        # 남았다(일시 LETHAL 셀 7,693 -> 33,138개). 그 유령이 통로를 막아
        # "Starting point in lethal space"가 22회 났다.
        # TSDF 무게는 소거마다 x0.95이고 1e-3 밑에서 소멸하므로
        #   n = ln(1e-3)/ln(0.95) = 134.7 스텝,  2.5 Hz -> 53.9 s
        # 실측 p95 46 s와 맞는다. 즉 유령의 정체는 '사람이 static에 들어간 것'이다.
        #
        # combined_map_slice는 dynamic 계열 mapping_type에서만 발행된다
        # (nvblox_node.cpp advertiseTopics: isUsingHumanOrDynamicMapper 분기).
        # 짝이 어긋나면 nvblox_layer가 아무것도 받지 못한 채 조용히 무해해진다.
        # test_nvblox_layer_contract.py가 이 짝을 감시한다.
        #
        # 2026-07-30 되돌림: combined -> static_map_slice.
        # 슬라이스 분리(local=combined / global=static)를 시험했으나 유령 지표를
        # 개선하지 못했다 -- 일시 LETHAL 셀 지속 p95가 47.0 s에서 43.0 s로 사실상
        # 그대로였다. mapping_type도 static_tsdf로 되돌리므로 combined는 발행되지
        # 않는다. 두 costmap이 같은 슬라이스를 쓴다.
        #
        # ===== 2026-08-15: human 모드에서도 이 값을 그대로 둔다 =====
        # mapping_type 을 human_with_static_tsdf 로 바꿔도 **여기는 안 바꾼다.**
        # human 모드에서는 마스크가 사람을 전경(사람 전용 mapper)으로 보내므로
        # static_map_slice 에 사람이 애초에 들어가지 않는다. 즉 슬라이스를 나누지
        # 않아도 nvblox 지도에서 사람이 빠진다 -- 이 시험이 노리는 것 자체다.
        #
        # combined_map_slice 로 옮기는 안도 있었으나 택하지 않았다. 그러면 local 만
        # 사람을 보고 global 은 못 봐서 planner 와 DWB 의 장애물이 갈린다.
        # planner 가 사람을 뚫고 경로를 내고 DWB 가 거부하는 형태로 굳을 수 있다
        # (test_both_costmaps_use_the_same_slice 가 막는 결함이다).
        #
        # 사람이 안 보이게 되는 것이 아니다. 라이다(voxel_layer)가 계속 본다.
        # laser_frame 이 0.382 m 라 사람 다리는 스캔 평면을 지나고, 레이트레이싱이
        # 사람이 비키는 즉시 지운다. 오래 기억해야 하는 낮은 장애물만 nvblox 가
        # 맡는 분업이 된다.
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: True
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        # 2026-08-29: 24 로 올렸다가 16 으로 되돌렸다. 깊이를 2D 스캔으로 눌러
        # 넣게 되면서 높은 격자가 필요 없어졌다 -- 라이다는 0.382 m, 깊이 스캔은
        # 지면 층만 쓴다. 격자를 낮추면 그만큼 CPU 도 준다.
        z_voxels: 16
        max_obstacle_height: 2.0
        # [근거 없음] nav2 기본값 0에서 1로 바꾼 경위가 기록돼 있지 않다
        # (2026-08-06 확인). z 컬럼에 마크된 복셀이 이 수 이상일 때만 2D costmap에
        # 표시한다. LiDAR가 단일 평면(0.382 m)이라 컬럼당 복셀이 많지 않으므로
        # 이 값을 올리면 표시가 사라질 수 있다. 되돌릴 때는 0으로.
        mark_threshold: 1
        # ===== 2026-08-29: D455 깊이를 두 번째 관측원으로 넣는다 =====
        # 라이다는 지면 0.382 m 단 하나의 평면만 본다. 그 위아래 물체 -- 책상
        # 다리·상판·낮은 상자 -- 는 어떤 층에도 안 들어온다. 실제로 8/29 주행에서
        # "방 -> 경유지2 / 입구" 구간이 테이블 다리 충돌로 두 번 막혔다.
        # nvblox 를 되살리지 않고 voxel_layer 에 직접 붙인다. 이유는 동적 회피다:
        # nvblox 는 TSDF 에 쌓았다가 x0.95 감쇠로 지우므로 사람이 비켜도 최대
        # 30 s 유령이 남지만(2026-07-30 실측 p95 46 s), voxel_layer 는 광선이
        # 통과하는 즉시 지운다.
        observation_sources: scan depth_scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # [근거 없음] 아래 네 값은 nav2 기본값(3.0 / 0.0 / 2.5 / 0.0)에서
          # 바뀌었으나 경위를 적은 주석도 devlog 기록도 없다(2026-08-06 확인).
          # 아는 것은 둘뿐이다:
          #   - raytrace(소거) > obstacle(표시) 관계는 유지해야 한다. 표시 범위가
          #     소거 범위보다 넓으면 지워지지 않는 마크가 남는다.
          #   - 그래서 obstacle_max_range 를 올릴 때는 raytrace_max_range 도 함께
          #     올린다. 안 그러면 유령 장애물을 새로 만든다
          #     (devlog/2026-07-31.md 270-274행).
          # min_range 0.12 / 0.05 의 근거는 확인되지 않았다. 내접반경 0.2775 m
          # 보다 작으므로 '자기 차체 필터링'이 목적이라면 값이 부족할 수 있다 —
          # 이는 추정이며 검증되지 않았다.
          raytrace_max_range: 3.5
          raytrace_min_range: 0.05
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          # 관측을 보관하는 시간. 0.0이면 한 프레임만 놓쳐도 즉시 지워진다.
          # LiDAR는 0.382 m 단일 평면이라 의자·테이블 다리처럼 얇은 기둥에는
          # 점이 1~2개만 맞는다(거리 1 m, 각분해능 0.9도 -> 호 길이 1.6 cm).
          # 그래서 검출이 프레임마다 들락날락하고, 0.0에서는 그 간헐성이 그대로
          # costmap 깜빡임이 된다. 코너에서는 측면 물체의 각속도가 커서 더 심하다.
          # 2026-07-28 주행에서 경로는 그대로인데(연속 /plan 변화 0.03~0.13 m,
          # 전체 최대 2.64 m) DWB가 저속 궤적만 골라 3.43 s까지 기어가는 구간이
          # 4회 있었다. 0.5 s를 보관해 얇은 다리를 안정적으로 유지한다.
          # 주의: 다리 하나에도 inflation_radius(현재 0.55)가 적용되므로, 안정적으로
          # 잡힐수록 서행 자체는 길어질 수 있다. 이는 실주행으로 확인한다.
          # (2026-08-06 정정: 이 문장은 0.45라 적혀 있었다. 그 뒤 0.50을 거쳐
          #  2026-08-02에 0.55로 확정됐으므로 이 주의는 오히려 더 커졌다.)
          observation_persistence: 0.5
          # [근거 없음] 둘 다 nav2 기본값(0.0 / false)에서 바뀌었으나 경위가
          # 기록돼 있지 않다(2026-08-06 확인).
          #   expected_update_rate 0.2 = "5 Hz 보다 느리면 이 관측원을 stale로 본다".
          #     stale이 되면 costmap이 isCurrent()=false가 되는데, Nav2가 그때
          #     로봇을 멈추는지 자체가 [미검증]이다
          #     (devlog/2026-07-30-nvblox-ghost-obstacle.md:63).
          #   inf_is_valid true = LiDAR의 inf(반사 없음)를 range_max로 바꿔
          #     raytrace 소거에 쓴다. false면 빈 공간이 지워지지 않는다.
          expected_update_rate: 0.2
          inf_is_valid: true

        # ===== D455 깊이를 2D 스캔으로 눌러 넣는다 (2026-08-29 5차) =====
        # 종전에는 포인트클라우드를 그대로 3D 격자에 넣었다. 그러자 **찍은 것을
        # 지우지 못하는** 문제가 구조적으로 남았다. bag 실측(run2017, 846초):
        #     0.9~1.8 m (깊이가 찍는 구간)  3,833칸  수명 중앙 21.6초
        #     1.8 m 밖  (라이다 구간)          451칸  수명 중앙  0.6초
        # 즉 깊이가 찍은 칸만 20초 넘게 남았다. 최대 191초.
        #
        # 원인은 카메라 높이다. 지면 1.025 m 에서 그보다 낮은 칸을 지우려면
        # 그 칸을 스치는 광선이 훨씬 먼 바닥까지 닿아야 하는데(1.8 m·0.75 m
        # 칸이면 6.7 m), 실내에서는 3~4 m 앞에 벽이 있어 그만큼 먼 바닥이
        # 애초에 안 보인다. raytrace_max_range 를 8 m 로 늘려도 볼 바닥이
        # 없으면 소용이 없었다(전반 28.7초 -> 후반 10.2초에서 멈춤).
        #
        # 그래서 높이를 버리고 **평면으로 누른다.** 0.30~1.05 m 띠에 있는 점을
        # "이 방향 이 거리에 뭔가 있다"는 LaserScan 으로 바꿔 넣으면, 마킹도
        # 청소도 같은 평면에서 일어난다 -- 라이다가 0.5초에 지워지는 것과
        # 같은 이치다. 스캔은 base_footprint(지면 z=0) 기준으로 만든다.
        #
        # 띠를 0.30~1.05 m 로 넓게 잡는다. 3D 때는 높은 칸일수록 지우기가
        # 어려워 0.60~0.75 로 좁힐 수밖에 없었지만, 평면으로 누르면 그 제약이
        # 사라진다. 경계의 근거는 이렇다.
        #   아래 0.30 m  차체가 흔들려도 바닥이 안 걸리는 선. 표시거리 3 m 에서
        #                5.7도까지 견딘다. 그 아래는 라이다(0.382 m)가 맡는다.
        #   위   1.05 m  로봇의 최고점(카메라 마스트)이다. 그보다 높은 물건은
        #                로봇 위로 지나가므로 볼 필요가 없다.
        # 이 띠 하나에 문턱·책상 다리·상판·의자·사람이 전부 들어온다.
        #
        # 잃는 것: 높이 정보. 테이블 상판이 잡히면 그 아래가 뚫려 있어도 막힌
        #          것으로 본다. 이 로봇은 손잡이 때문에 어차피 못 지나가므로
        #          실질적 손해가 아니다.
        # 얻는 것: 지우기가 라이다와 같아진다. 포인트클라우드를 costmap 이
        #          매번 훑지 않으므로 CPU 도 준다.
        depth_scan:
          topic: /camera/depth_scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          # 스캔은 지면 평면(z=0)에서 나온다. 그 층만 쓰도록 좁게 연다.
          # 라이다는 0.382 m 층을 쓰므로 서로 다른 층이고 간섭하지 않는다.
          #
          # 아래끝을 0.0 이 아니라 -0.05 로 둔다. nav2 는 관측점을 global_frame
          # (odom) 으로 옮긴 뒤 `pz < min_obstacle_height` 로 거르는데, 스캔이
          # 정확히 z=0 이라 경계에 걸린다. TF 의 미세한 오차나 부동소수 반올림
          # 하나로 통째로 버려질 수 있다. 실제로 2026-08-29 첫 시도에서 스캔은
          # 빔의 95 % 에 물체를 잡는데 costmap 은 0~1칸이었다.
          min_obstacle_height: -0.05
          max_obstacle_height: 0.15
          # 2D 가 되었으므로 거리를 다시 넓힐 수 있다. 바닥 오검출은 스캔을
          # 만드는 단계에서 높이로 이미 걸러졌고, 3D 때처럼 "먼 바닥이 보여야
          # 지워진다"는 제약도 사라졌다.
          obstacle_max_range: 3.0
          obstacle_min_range: 0.30
          raytrace_max_range: 3.5
          raytrace_min_range: 0.30
          # 라이다의 0.5 s 와 달리 0 이다. 깊이는 한 물체에 점이 수백 개라
          # 검출이 깜빡이지 않는다. 보관하면 비켜준 사람만 남는다.
          observation_persistence: 0.0
          # stale 판정을 하지 않는다. 카메라가 끊겨도 주행이 멎으면 안 된다.
          expected_update_rate: 0.0
          # 스캔에 물체가 없는 방향은 inf 로 온다. 그것을 최대거리로 바꿔
          # 빈 공간 청소에 쓴다. false 면 빈 곳이 안 지워진다.
          inf_is_valid: true
      # 초음파 8개 (DYP-A22, 지면 91.3mm 수평 장착, 물리 빔 50도·발행 fov 30도).
      # 라이다(0.382m 층)와 depth_scan(0.30~1.05m 띠)이 못 보는 지면~0.30m
      # 낮은 장애물, 그리고 유리를 맡는다. 발행원은 user_guidance_driver_node
      # (스마트핸들 ESP32U 경유). 설계·근거: docs/handoff_jetson_ultrasonic_i2c.md §6.5.
      # global costmap 에는 넣지 않는다 — 방위 분해능이 없어 저장 지도를 뭉갠다.
      #
      # 2026-09-16 두 채널 enabled False 는 그 회차들에 초음파가 미연결이었기 때문
      # (51213e7). 2026-09-23 보드를 ESP32U 로 바꾸고 8개를 붙이면서 전부 True 로.
      # 채널당 약 2.4Hz (4라운드 × 105ms). 센서별 레이어 분리는 08-31 확정(한 레이어에
      # 여러 토픽을 넣으면 한 센서의 clear 가 다른 센서의 mark 를 지운다).
      # 공식 문서(docs.nav2.org Range Sensor Parameters): topics·clear_on_max_reading·
      # input_sensor_type 이 기본 축이고, 부채꼴 폭은 Range 메시지의 field_of_view 를 쓴다
      # (드라이버 ultrasonic_fov_rad 0.524). phi(1.2)·inflate_cone(1.0)은 기본값.
      # 자리↔주소·URDF frame: vica_description/urdf/VICA.xacro 초음파 절.
      # 공통 설정 주석 (여덟 레이어 동일):
      # - clear_on_max_reading true: 드라이버가 "에코 없음"을 range=max_range 로
      #   발행하면 그 부채꼴을 지운다. false 면 유령이 rolling window 밖으로
      #   나갈 때까지 남는다.
      # - no_readings_timeout 0.0: 초음파가 죽어도 costmap 을 stale 로 만들지
      #   않는다(보조 센서라 fail-open). 단절 진단은 /vica/smart_handle_state.
      # - clear/mark_threshold 는 기본값. 실기 후 조정한다.
      range_sensor_front_left:   # 2번 앞 왼쪽
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: False   # 2026-09-24 VCC 가 초음파를 직접 읽는다(1 s 안 값만). 이 층의 지워지지 않는 표시가 run43 정지 9회의 원인
        topics: ["/ultrasonic/front_left"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_front_right:   # 3번 앞 오른쪽
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: False   # 2026-09-24 VCC 가 초음파를 직접 읽는다(1 s 안 값만). 이 층의 지워지지 않는 표시가 run43 정지 9회의 원인
        topics: ["/ultrasonic/front_right"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_left_wheel:   # 1번 왼쪽 바퀴 옆
