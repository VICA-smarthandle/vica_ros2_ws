controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "position_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: "vica_vcc_controller::LatchedGoalChecker"
      xy_goal_tolerance: 0.15
      unlatch_distance: 0.5
      yaw_goal_tolerance: 0.25
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.05
    position_goal_checker:
      plugin: "vica_vcc_controller::LatchedGoalChecker"
      xy_goal_tolerance: 0.15
      unlatch_distance: 0.5
      yaw_goal_tolerance: 3.141
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.05
    FollowPath:
      plugin: "vica_vcc_controller::VccController"
      max_robot_pose_search_dist: 3.0
      reject_unit_path: false
      desired_linear_vel: 0.5
      lookahead_time: 2.5
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.2
      transform_tolerance: 0.2
      max_angular_vel: 0.5
      max_angular_accel: 1.2
      max_linear_decel: 1.25
      planned_linear_decel: 0.5
      start_ramp_speed: 0.25
      start_ramp_accel: 0.5
      linear_accel: 0.143
      resync_margin: 0.15
      min_speed: 0.12
      curve_min_radius: 0.8
      curve_decel: 0.3
      preview_dist: 1.5
      slow_clearance: 0.35
      approach_velocity_scaling_dist: 0.6
      min_approach_linear_velocity: 0.10
      lane_max_offset: 0.6
      lane_step: 0.1
      lane_shift_speeds: [0.3, 0.2, 0.1]
      avoid_horizon: 1.5
      target_clearance: 0.20
      w_clear: 10.0
      w_rail: 1.0
      w_change: 0.5
      switch_margin: 0.05
      switch_persist_cycles: 3
      lane_rate: 0.10
      return_clear_time: 1.0
      lane_resync_threshold: 0.15
      turn_enter_angle: 1.047
      turn_exit_angle: 0.436
      pivot_start_angle: 0.611
      turn_radii: [0.3, 0.2, 0.1]
      turn_clearance: 0.20
      turn_angular_vel: 0.45
      turn_lock_target: true
      turn_retarget_angle: 1.571
      turn_retarget_persist: 0.5
      turn_max_rotation: 6.283
      turn_enter_persist: 0.3
      end_extend: true
      end_extend_max_lateral: 0.08
      end_extend_min_length: 0.3
      pass_arrival: true
      new_path_collision_confirm: true
      position_only_yaw_tol: 3.0
      end_straight_lateral: 0.08
      pivot_angular_vel: 0.35
      align_angular_vel: 0.35
      motor_lag: 0.35
      align_settle: 0.3
      align_max_attempts: 3
      align_rearm_time: 3.0
      align_exit_dist: 0.5
      arrive_margin: 0.03
      min_state_time: 0.5
      clearance_window: 5.0
      reset_gap: 1.5
      ultrasonic_topics: ["/ultrasonic/vcc_off"]
      us_max_range_per_topic: [0.0, 0.0, 0.40, 0.40]
      us_max_age: 1.0
      us_confirm_count: 2
      us_confirm_tol: 0.15
      us_near_confirm_range: 0.40
      us_memory_time: 30.0
      us_pass_memory: true
      us_pass_margin: 0.2
      us_pass_max_dist: 2.0
      us_memory_slots: 4
      us_arc_points: 7
      publish_state: true
    FollowPathRPP:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5

      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 2.5
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.20
      use_interpolation: true

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.2
      regulated_linear_scaling_min_speed: 0.12

      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.35
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.5

      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.3
      rotate_to_heading_angular_vel: 0.35
      max_angular_accel: 1.2
      allow_reversing: false

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.2

      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

    FollowPathMPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 28
      model_dt: 0.1
      batch_size: 2000
      iteration_count: 1
      temperature: 0.9
      gamma: 0.015
      prune_distance: 3.0
      transform_tolerance: 0.2
      visualize: false
      reset_period: 1.0
      motion_model: "DiffDrive"

      vx_max: 0.5
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.5
      ax_max: 2.0
      ax_min: -2.0
      az_max: 2.0

      vx_std: 0.3
      vy_std: 0.0
      wz_std: 0.42

      AckermannConstraints:
        min_turning_r: 0.5

      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.10
        near_goal_distance: 0.5
        inflation_radius: 0.55
        cost_scaling_factor: 3.5

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5

      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0

    FollowPathDWB:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.15
      PathAlign.scale: 48.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 36.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.151, 0.225], [0.151, -0.225], [-0.459, -0.225], [-0.569, -0.035], [-0.569, 0.035], [-0.459, 0.225]]"
      footprint_padding: 0.05
      plugins: ["voxel_layer",
                "range_sensor_front_left", "range_sensor_front_right",
                "range_sensor_left_wheel", "range_sensor_right_wheel",
                "range_sensor_right_rear_wheel", "range_sensor_rear_right",
                "range_sensor_rear_left", "range_sensor_left_rear_wheel",
                "inflation_layer"]
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: True
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 1
        observation_sources: scan depth_scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.05
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          observation_persistence: 0.5
          expected_update_rate: 0.2
          inf_is_valid: true

        depth_scan:
          topic: /camera/depth_scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          min_obstacle_height: -0.05
          max_obstacle_height: 0.15
          obstacle_max_range: 3.0
          obstacle_min_range: 0.30
          raytrace_max_range: 3.5
          raytrace_min_range: 0.30
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: true
      range_sensor_front_left:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/ultrasonic/front_left"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_front_right:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/ultrasonic/front_right"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_left_wheel:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: False
        topics: ["/ultrasonic/left_wheel"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_right_wheel:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: False
        topics: ["/ultrasonic/right_wheel"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_right_rear_wheel:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: False
        topics: ["/ultrasonic/right_rear_wheel"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_rear_right:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: False
        topics: ["/ultrasonic/rear_right"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_rear_left:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: False
        topics: ["/ultrasonic/rear_left"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_left_rear_wheel:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: False
        topics: ["/ultrasonic/left_rear_wheel"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      footprint: "[[0.151, 0.225], [0.151, -0.225], [-0.459, -0.225], [-0.569, -0.035], [-0.569, 0.035], [-0.459, 0.225]]"
      footprint_padding: 0.05
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer", "obstacle_layer",
                "range_sensor_front_left", "range_sensor_front_right", "obstacle_inflation_layer"]

      range_sensor_front_left:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/ultrasonic/front_left"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      range_sensor_front_right:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/ultrasonic/front_right"]
        clear_on_max_reading: True
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8

      obstacle_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.30

      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"

      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: map
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.05
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
          observation_persistence: 0.5
          expected_update_rate: 0.2
          inf_is_valid: true

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

route_server:
  ros__parameters:
    use_sim_time: false
    graph_filepath: ""

    graph_file_loader: "GeoJsonGraphFileLoader"
    GeoJsonGraphFileLoader:
      plugin: "nav2_route::GeoJsonGraphFileLoader"

    edge_cost_functions: ["DistanceScorer", "PenaltyScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    PenaltyScorer:
      plugin: "nav2_route::PenaltyScorer"

    max_planning_time: 2.0

    radius_to_achieve_node: 0.6

    smooth_corners: false
    smoothing_radius: 1.0
    path_density: 0.05
    tracker_update_rate: 50.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBasedAlt:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      motion_model_for_search: "DUBIN"

      minimum_turning_radius: 0.5

      cost_penalty: 4.0

      downsample_costmap: false
      downsampling_factor: 1
      angle_quantization_bins: 72
      cache_obstacle_heuristic: true

      tolerance: 0.2
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0

      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"

      lattice_filepath: "/home/ji_w/VICA-smarthandle/vica_ros2_ws/install/vica_nav2/share/vica_nav2/config/lattice/output_r010_diff.json"

      allow_reverse_expansion: false
      rotation_penalty: 5.0

      cost_penalty: 4.0
      cache_obstacle_heuristic: true
      tolerance: 0.2
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0

      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.15
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.5]
    min_velocity: [-0.5, 0.0, -0.5]
    max_accel: [2.5, 0.0, 2.0]
    max_decel: [-1.25, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.4

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "/cmd_vel"
    cmd_vel_out_topic: "/cmd_vel_req"

    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0

    polygons: ["PolygonStop", "PolygonSlow"]

    PolygonStop:
      type: "polygon"
      points: [0.446, 0.28, 0.446, -0.28, 0.206, -0.28, 0.206, 0.28]
      action_type: "stop"
      max_points: 2
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True

    PolygonSlow:
      type: "polygon"
      points: [0.946, 0.32, 0.946, -0.32, 0.206, -0.32, 0.206, 0.32]
      action_type: "slowdown"
      slowdown_ratio: 0.4
      max_points: 2
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True

keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    topic_name: "/keepout_filter_mask"
    frame_id: "map"

keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0
    filter_info_topic: "/keepout_costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
