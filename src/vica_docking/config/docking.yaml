# vica_docking_node 설정. 값은 11-17·18 실기 결과로 정했다(~/vica_data/docking_plan/README.md).
vica_docking:
  ros__parameters:
    # 미션과 같은 목적지 파일 경로를 준다 — 같은 폴더에 dock.yaml 을 둔다(home.yaml 옆, 지도당 1개).
    destinations_path: ""
    map_id: ""                    # 비우면 destinations_path 의 폴더 이름
    auto_initial_pose: true       # 켜질 때 도크 안이면 저장된 도크 위치로 AMCL 초기 위치를 잡는다
    boot_check_s: 20.0            # 켜질 때 도크 확인. 부하가 크면 새 프로세스의 첫 스캔이 7.5 s 걸렸다(11-18 실측)
    trace_dir: ""                 # 비우면 시험 기록을 남기지 않는다

    approach:
      target_cm: 14.0             # 도착 범퍼→꼭짓점(11-18 사용자 "1cm만 더")
      stage_cm: 100.0             # 준비 위치 범퍼→꼭짓점
      lead: 0.0136                # 정지 명령 앞당김 m(11-17 넘침 평균 1.34 cm)
      vmax: 0.10
      vfinal: 0.05
      max_time: 60.0
      lost_timeout_s: 3.0         # 통로가 비었는데 V자를 이만큼 못 보면 실패(11-19 사용자 1.5 → 3 s). 가려진 것이면 막힘으로 30 s 까지 기다린다

    undock:
      until_cm: 85.0              # 이 거리(범퍼→꼭짓점)까지 후진(11-18 사용자: 80 은 회전 끝에 초음파 0.23 m)
      clear_pre: 0.80             # 출발 전 뒤가 비어야 하는 거리 = 뒤 초음파 상한(11-18 사용자 0.8 m)
      lead_back: 0.024
      lead_turn_deg: 5.4
      turn_dir: 1                 # 1 반시계 / -1 시계
      wait_timeout: 30.0
      turn_done_deg: 10.0         # 회전 중 멈췄을 때 남은 각이 이 안이면 다 나온 것으로 본다(11-19 사용자)
