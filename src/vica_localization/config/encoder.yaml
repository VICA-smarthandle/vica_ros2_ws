encoder_feedback:
  ros__parameters:
    can_iface: can1
    driver_id: 1
    driver_response_id: 1793  # 0x701
    ticks_per_rev: 61.2
    wheel_radius_m: 0.065
    # 회전각을 정하는 값이다.  회전각 = (오른바퀴 - 왼바퀴) / wheel_base_m x 시간
    # 이 값이 실제보다 작으면 회전각이 크게 나온다.
    #
    # 이력
    #   CAD 실측        0.3596   (바퀴 중심 사이 줄자)
    #   회전 시험 보정   0.37     오도메트리를 맞추려고 올린 값이다. CAD 와 다른
    #                            것이 정상이며 통일 대상이 아니다(스펙 3.1.1).
    #   2026-08-30      0.387    아래 실측
    #
    # 2026-08-30 bag 실측 (run0918, 242초 · 23.2 m)
    #   1초 넘게 이어진 회전 구간 10개에서 IMU 와 휠의 회전각을 견줬다.
    #   자이로 편향은 빼고 잰다(정지 구간 평균 +0.013 도/초).
    #
    #     IMU / 휠 비율   구간별 0.902 ~ 0.973,  가중평균 0.9527
    #     총 회전 550도에서 26도 차이
    #
    #   10개 구간이 모두 같은 방향이라 우연이 아니라 계통 오차다. 자이로의 스케일
    #   오차는 보통 1 % 이내이므로 **휠이 4.7 % 과대평가**하는 쪽으로 본다.
    #   0.37 x 1.047 = 0.387.
    #
    #   근거가 하나 더 있다. AMCL 이 EKF yaw 를 -1.8 도/분으로 계속 되돌리고 있는데,
    #   자이로 편향이 만드는 각도(243초에 3.07도)로는 42 %밖에 설명되지 않았다.
    #   나머지가 이 스케일 오차다.
    #
    # ── 실주행 검증 (run1139, 194초 · 26.8 m) ───────────────────────────
    #
    #   bag        AMCL yaw 보정 추세   보정 최대   IMU/휠   wheel_base
    #   run0918        -1.81 도/분        12.24     0.9527     0.37
    #   run0928        -1.84              39.35     0.9542     0.37
    #   run0948        -0.84              11.15     0.9399     0.37
    #   run1016        -1.22              17.91     0.9660     0.37
    #   run1139        -1.16               7.94     1.0098     0.387  <- 이번
    #
    # **IMU/휠 비율이 0.953 -> 1.010 으로 1 % 안에 들어왔다.** 두 센서가 같은
    # 각도를 말한다. 예측대로 휠이 과대평가하고 있었다.
    # AMCL 보정 최대값도 12~39도에서 7.94도로 절반 이하가 됐다.
    #
    # 다만 **보정 추세(도/분)는 -1.16 으로 거의 안 변했다.** 이는 예상된 것이다.
    # 추세는 시간에 비례하는 성분이고 그 원인은 자이로 편향(+0.013 도/초)이다.
    # 스케일 오차는 회전한 양에 비례하므로 최대값 쪽에 나타난다. 원인이 둘이었고
    # 이번에 하나를 잡았다. 남은 편향은 ZUPT(정차 중 편향 재추정)의 몫이다.
    #
    # 되돌릴 값은 0.37 이다. 실패 신호는 AMCL yaw 보정 추세가 오히려 커지는 것.
    #
    # 정석은 UMBmark(정사각형 왕복)로 절대 기준을 잡는 것이다. 이 값은 "IMU 가
    # 맞다"는 가정 위에 있다. 실주행이 그 가정을 지지했으므로 당장 급하지는
    # 않으나, 직진 거리(wheel_radius_m)는 아직 확인되지 않았다 — UMBmark 는
    # 회전과 직진을 함께 잡는다.
    wheel_base_m: 0.387
    right_sign: 1.0
    left_sign: 1.0
    odom_frame: odom
    base_frame: base_footprint
    odom_topic: /wheel/odom

    # EKF is the only odom -> base_footprint TF publisher.
    publish_tf: false

    # During driving, the motor node requests C5 feedback with RET_TYPE_ODOM=5.
    # Enabling this option sends a separate zero-RPM request and is bench-only.
    request_position_feedback: false
    request_hz: 20.0
