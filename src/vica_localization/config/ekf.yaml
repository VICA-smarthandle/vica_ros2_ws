ekf_filter_node:
  ros__parameters:
    frequency: 30.0

    # [실측 2026-08-01] 0.1에서 0.2로 올린다.
    #
    # `/wheel/odom`의 실효 주기는 **9.45 Hz = 105.8 ms**다. MDROBOT 드라이버가 C5 응답을
    # 약 105 ms마다 뭉쳐서 보내기 때문이며 encoder_feedback의 request_hz를 올려도 변하지
    # 않는다(devlog 2026-07-31-health-monitor-implementation.md 14.14).
    #
    # 즉 기존 0.1(100 ms)은 **모든 주기마다 timeout을 넘겼다.** robot_localization은
    # sensor_timeout이 지나면 그 센서가 끊겼다고 보고 **보정 없이 예측만** 수행한다.
    # 필터가 상시로 눈을 감고 도는 셈이다.
    #
    # 0.2는 실효 주기의 약 2배로, 정말 끊겼을 때만 걸린다.
    sensor_timeout: 0.2

    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # robot_localization 자체 진단을 끈다. 2026-08-01 실기에서 이것이 상시 거짓
    # ERROR를 냈고, 앱에 "주행 불가 · 위치추정 오류"로 떠서 원인을 한참 찾았다.
    #
    #   name: 'ekf_filter_node: odometry/filtered topic status'
    #   message: No events recorded.
    #   Events since startup: 0        <- 기동 이후 단 한 번도 세지 않았다
    #   Actual frequency: 0.000000
    #   Minimum acceptable: 25.2 Hz
    #
    # `Events since startup: 0`이 핵심이다. 주기가 낮은 것이 아니라 카운터가 아예
    # 돌지 않는다. 실제 `/odom`은 같은 시각에 24.7 Hz로 정상 발행 중이었다.
    # robot_localization의 .cpp가 설치돼 있지 않아 정확한 기전은 확인하지 못했다.
    # 다만 **한 번도 참인 적이 없는 진단**이므로 끄는 것이 맞다.
    #
    # 주기 감시는 우리 계층이 이미 한다 — vica_system_monitor의 probes.yaml이
    # `/odom`을 min 20 / max 35 Hz로 본다. 그쪽이 정본이며, 2026-08-01에 RViz가
    # 두 개 떠 CPU가 모자랐을 때 15.5 Hz로 떨어진 것을 실제로 잡아냈다.
    print_diagnostics: false

    # Canonical source: src/vica_localization/config/ekf.yaml
    # encoder_feedback publishes raw wheel odometry without TF.
    odom0: /wheel/odom
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, true,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false

    # [2026-08-19 임시 비활성] 카메라(IMU 내장)가 마스트(지면 1.075 m)로
    # 올라간 뒤 기둥 진동이 자이로 vyaw 에 섞여 yaw 가 크게 틀어진다.
    # 기구를 완전히 고정하기 전까지 IMU 융합을 끄고 바퀴 오도메트리만 쓴다.
    # odom0 이 vx·vy·vyaw 를 전부 공급하므로 구멍은 없다.
    #
    # 대가: 자이로가 잡아 주던 회전 정밀도를 잃는다(바퀴 yaw 는 미끄러짐에
    # 약하고, 장기 표류는 AMCL 이 지도로 보정). 제자리 회전 정확도가 다소
    # 떨어질 수 있다. 부수 효과로 기동 시 25초 자이로 정지 보정은 주행에
    # 영향이 없어진다(어댑터는 계속 돌지만 EKF 가 안 읽는다).
    #
    # [되돌리기] 마스트 강성 확보 후 아래 6줄의 주석을 푼다.
    # imu0: /imu/base_link
    # imu0_config: [
    #   false, false, false,
    #   false, false, false,
    #   false, false, false,
    #   false, false, true,
    #   false, false, false
    # ]
    # imu0_differential: false
    # imu0_relative: false
    # imu0_remove_gravitational_acceleration: true


