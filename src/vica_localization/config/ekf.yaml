ekf_filter_node:
  ros__parameters:
    frequency: 30.0

    # [실측 2026-08-01] 0.1에서 0.2로 올린다.
    #
    # `/wheel/odom`의 실효 주기는 **9.45 Hz = 105.8 ms**다. MDROBOT 드라이버가 C5 응답을
    # 약 105 ms마다 뭉쳐서 보내기 때문이며 encoder_feedback의 request_hz를 올려도 변하지
    # 않는다(devlog 2026-07-31-health-monitor-implementation.md 14.14).
    #
    # 즉 기존 0.1(100 ms)은 **모든 주기마다 timeout을 넘겼다.** robot_localization은
    # sensor_timeout이 지나면 그 센서가 끊겼다고 보고 **보정 없이 예측만** 수행한다.
    # 필터가 상시로 눈을 감고 도는 셈이다.
    #
    # 0.2는 실효 주기의 약 2배로, 정말 끊겼을 때만 걸린다.
    sensor_timeout: 0.2

    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # robot_localization 자체 진단을 끈다. 2026-08-01 실기에서 이것이 상시 거짓
    # ERROR를 냈고, 앱에 "주행 불가 · 위치추정 오류"로 떠서 원인을 한참 찾았다.
    #
    #   name: 'ekf_filter_node: odometry/filtered topic status'
    #   message: No events recorded.
    #   Events since startup: 0        <- 기동 이후 단 한 번도 세지 않았다
    #   Actual frequency: 0.000000
    #   Minimum acceptable: 25.2 Hz
    #
    # `Events since startup: 0`이 핵심이다. 주기가 낮은 것이 아니라 카운터가 아예
    # 돌지 않는다. 실제 `/odom`은 같은 시각에 24.7 Hz로 정상 발행 중이었다.
    # robot_localization의 .cpp가 설치돼 있지 않아 정확한 기전은 확인하지 못했다.
    # 다만 **한 번도 참인 적이 없는 진단**이므로 끄는 것이 맞다.
    #
    # 주기 감시는 우리 계층이 이미 한다 — vica_system_monitor의 probes.yaml이
    # `/odom`을 min 20 / max 35 Hz로 본다. 그쪽이 정본이며, 2026-08-01에 RViz가
    # 두 개 떠 CPU가 모자랐을 때 15.5 Hz로 떨어진 것을 실제로 잡아냈다.
    print_diagnostics: false

    # Canonical source: src/vica_localization/config/ekf.yaml
    # encoder_feedback publishes raw wheel odometry without TF.
    odom0: /wheel/odom
    # [2026-09-03 회전(vyaw)을 바퀴에서 뺀다 — 방향은 자이로가 맡는다]
    #
    # 복도 매핑 bag(cm3_corridor, 14.5분, 출발점 복귀 = 정답 360°)에서 센서별
    # 누적 회전: 자이로 +361.1° · 바퀴 +334.9°(7 % 과소) · EKF +343.8°.
    # EKF 가 바퀴 쪽을 더 따라(자이로 쪽으로 34 %만) 복도 24 m 마다 약 4° 씩
    # 휘어 그려졌다(두 회차 동일, 실측 폭은 양쪽 같음). 바퀴 과소는 모든 속도
    # 에서 나타났고(비 0.87~0.97), wheel_base_m 은 8월 다른 바닥에서 이미 한 번
    # 맞춘 값이라 장소마다 다시 틀어진다 — 강건한 축은 yaw 를 자이로에 맡기는 것.
    #
    # 바꾼 것: 아래 12번째 항목(vyaw) true -> false. 직진·횡(vx·vy)은 그대로.
    # 자이로 편향은 어댑터가 기동 시 + 정차마다 재추정한다(이번 bag 120회).
    # 판정: 제자리 10바퀴 벤치에서 EKF 누적 3600°±5° → 매핑 1회에서 복도 휨 소멸.
    # 되돌리기: vyaw 를 true 로. 실패 신호는 정차 후 재출발에서 yaw 가 튀는 것
    # (편향 재추정 오류)이다.
    #
    # [벤치 결과 2026-09-03] 제자리 9바퀴(자이로 3244.7° = 9.01바퀴) 175초:
    #   자이로 +3244.7° · 바퀴 +3084.5°(−4.8 %) · EKF +3244.5°
    #   EKF−자이로 −0.3° → 합격. 바퀴의 −160° 과소가 더 이상 EKF 에 안 들어온다.
    #   bag: ~/vica_data/bags/yaw_bench_10L. 남은 검증은 복도 매핑 1회(휨 소멸).
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false

    # [이력] 2026-08-19 마스트 진동이 자이로 vyaw 를 흔든다고 보고 IMU 융합을
    # 껐다(02c1fae). 바퀴 단독 실주행에서 나아진 점이 없었고 지도 틀어짐이
    # 보여 2026-08-20 사용자 결정으로 복원했다. 마스트 진동은 기구 고정으로
    # 풀고, IMU 융합은 유지한다.
    imu0: /imu/base_link
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true


