ekf_filter_node:
  ros__parameters:
    frequency: 30.0

    sensor_timeout: 0.2

    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    print_diagnostics: false

    odom0: /wheel/odom
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/base_link
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
