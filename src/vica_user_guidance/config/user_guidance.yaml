# Smart Handle 사용자 안내 파라미터
#
# [중요] 최상위 키는 launch의 Node(name=...)와 정확히 일치해야 한다.
# 다르면 파라미터가 조용히 무시되고 전부 기본값으로 동작한다.

turn_guide_node:
  ros__parameters:
    odom_topic: /odom

    # 회전 판정 임계값. 2026-07-29 실주행(방2·화장실·안내소 순회)으로 25도를
    # 확정했다. 실제 회전 8회가 전부 25.0~26.6°에서 걸렸고, v=0.26 m/s 40초 연속
    # 직진 구간에서 오탐이 0회였다. 정지 상태 창 누적은 0.060°다
    # (진단: yaw_drift_check). 실내 90도 코너 기준으로 45도는 반응이 늦다.
    #
    # 2026-08-02: 사용자 지시로 25 -> 20도. 안내를 더 일찍 내보낸다.
    #
    #   진입 시점    30°/s로 도는 자극 기준 0.83 -> 0.67초 (0.16초 빨라진다)
    #   직진 오탐    정지 시 창 누적 0.060°에 대해 여유 417배 -> 333배. 여전히 넓다
    #   놓치는 회전  실제 회전 8회의 최솟값이 25.0°였으므로 늘지 않는다
    #
    # [미검증] 히스테리시스 폭이 15도에서 10도로 좁아진다(exit는 10.0 유지).
    # 코너에서 경로가 진동하면(2026-08-01 NavFn 지그재그) 안내가 켜졌다 꺼졌다
    # 할 수 있다. 그러면 exit를 8도로 내리거나 min_duration_sec을 올린다.
    window_sec: 1.5
    enter_threshold_deg: 20.0 #좌우회전각도
    exit_threshold_deg: 10.0     # hysteresis. enter보다 작아야 채터링이 없다
    min_duration_sec: 0.6        # 짧은 자세 보정을 회전으로 오판하지 않게 한다

    odom_timeout_sec: 0.5        # 초과 시 source_stale=True, 누적 폐기
    publish_rate_hz: 20.0
    cue_valid_sec: 2.0           # valid_until 표시용 (판정에는 쓰지 않는다)

user_guidance_driver_node:
  ros__parameters:
    # udev 규칙(udev/99-vica-smart-handle.rules)이 부여하는 고정 이름이다.
    # /dev/ttyUSB* 번호는 USB 재열거 순서에 따라 바뀌므로 직접 쓰지 않는다.
    # 규칙 미설치 장비에서는 FAULT_PORT_OPEN이 된다 — README의 udev 절을 따른다.
    serial_port: /dev/vica_smart_handle
    baudrate: 115200             # 펌웨어 Serial.begin(115200)과 반드시 일치

    send_rate_hz: 10.0           # 펌웨어 워치독 1500ms 대비 15배 여유
    diag_rate_hz: 2.0            # 진단은 전송보다 느리게 (대역폭 절약)

    # write_timeout이 없으면 USB 버퍼가 찰 때 write()가 블로킹되어
    # 단일 스레드 executor에서 노드 전체가 멈춘다. 전송 주기의 절반으로 둔다.
    write_timeout_sec: 0.05

    cue_timeout_sec: 1.0
    estop_timeout_sec: 1.0

    # true면 /estop_state가 끊겨도 ESTOP으로 다룬다(fail-safe).
    # emergency_stop_node 없이 개발할 때만 false로 둔다.
    estop_required: true

    reconnect_interval_sec: 2.0

    # 펌웨어 도착 애니메이션이 스스로 복귀할 때까지 3.5초가 걸린다.
    #   ARRIVE_BLINK_MS(500) x (2 x ARRIVE_BLINK_COUNT(3) + 마지막 소등 1) = 3500ms
    # 3.0으로 두면 마지막 프레임이 잘려 "2.5회 점멸"로 보인다(2026-07-28 프레임 추적).
    # 10Hz 전송 양자화와 클록 드리프트 마진 0.5초를 더한 값이다.
    # 펌웨어 상수를 바꾸면 이 값도 함께 바꾼다 — test_protocol.py가 관계를 고정한다.
    arrival_hold_sec: 4.0

    enable_serial: true

    # ── 초음파 (DYP-A22 IIC x2, 2026-08-31) ─────────────────────────────
    # 설계 정본: docs/handoff_jetson_ultrasonic_i2c.md §6.4
    # 같은 포트의 상향 8B 프레임(약 4.8Hz)을 읽어 sensor_msgs/Range 로 발행한다.
    ultrasonic_enabled: true
    ultrasonic_rate_hz: 20.0     # 폴링 주기. 프레임 4.8Hz 의 4배
    # 채널 순서 고정: [front_left(I2C 0x68), front_right(0x74)] — 실측 확정
    ultrasonic_topics: [/ultrasonic/front_left, /ultrasonic/front_right]
    # URDF 링크 이름과 반드시 일치해야 한다. 다르면 TF 를 못 찾아 costmap 이 버린다.
    ultrasonic_frame_ids: [usonic_front_left, usonic_front_right]
    # 2026-08-31 실험(사용자 요청): 레벨 1(30도)/0.30m -> 레벨 4(60도)/0.80m.
    # 계산상 60도 수평 장착은 바닥 에코가 0.13~0.16m 부터지만, 이 바닥(매끈한
    # 재질)이 정반사로 에코를 안 돌려주는 것이 실측돼 시험한다. 빈 전방에서
    # 유령이 생기면 0.524/0.30 으로 되돌린다. 펌웨어 US_ANGLE_LEVEL 과 일치 필수.
    #
    # 0.50 -> 0.80 (같은 날 2차): usonic_drive02 bag 실측 — 첫 감지 0.28m 에서
    # 정지명령까지 0.5초로 반응은 정상이나, max_vel 0.5 의 제동거리 0.32m 보다
    # 짧아 물리적으로 못 멈추고 충돌했다. 제동(0.32)+반응(~0.25) < 0.8 성립.
    # 속도 인하는 사용자가 보류(0.5 유지).
    # 실주행 이력(2026-08-31): 60도+1.5m 과잉 봉쇄(6차) / 60도+1.1m 회피 짧음(7차)
    # / 40도+1.5m 양립 통과(8차).
    # 2026-09-01: 50도+1.5m 시험(9차) 통과 후 "과잉 봉쇄 체감"으로 40도에
    # 잠시 복귀했으나, 봉쇄 원인이 초음파가 아니라 라이다에 잡힌 바닥 모니터
    # 선으로 판명(사용자 확인)되어 50도로 재확정. 봉쇄 증상이 또 보이면
    # 각도를 의심하기 전에 라이다가 보는 실물(선·틈)부터 확인할 것.
    # 펌웨어 US_ANGLE_LEVEL 0x03 과 일치.
    ultrasonic_fov_rad: 0.873    # 지향각 레벨 3(50도)
    ultrasonic_min_range_m: 0.02
    ultrasonic_max_range_m: 1.50
    # 순차 발사라 채널별 측정 시점이 다르다. 펌웨어 GAP 5+WAIT 100ms 기준.
    # 트리거 명령을 바꾸면(0xBC->다른 것) 펌웨어 US_WAIT_MS 와 함께 바꾼다.
    ultrasonic_measurement_delay_ms: [210, 105]
    ultrasonic_stale_warn_sec: 2.0
