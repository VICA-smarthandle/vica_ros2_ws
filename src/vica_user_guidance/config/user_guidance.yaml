turn_guide_node:
  ros__parameters:
    odom_topic: /odom

    window_sec: 1.5
    enter_threshold_deg: 20.0
    exit_threshold_deg: 10.0
    min_duration_sec: 0.6

    odom_timeout_sec: 0.5
    publish_rate_hz: 20.0
    cue_valid_sec: 2.0

user_guidance_driver_node:
  ros__parameters:
    serial_port: /dev/vica_smart_handle
    baudrate: 115200

    send_rate_hz: 10.0
    diag_rate_hz: 2.0

    write_timeout_sec: 0.05

    cue_timeout_sec: 1.0
    estop_timeout_sec: 1.0

    estop_required: true

    reconnect_interval_sec: 2.0

    arrival_hold_sec: 4.0

    enable_serial: true

    ultrasonic_enabled: true
    ultrasonic_rate_hz: 20.0

    uplink_rate_hz: 20.0

    touch_enabled: false

    touch_stale_sec: 0.5

    touch_publish_min_interval_sec: 0.1
    ultrasonic_topics: [/ultrasonic/front_left, /ultrasonic/front_right]
    ultrasonic_frame_ids: [usonic_front_left, usonic_front_right]
    ultrasonic_fov_rad: 0.524
    ultrasonic_min_range_m: 0.02
    ultrasonic_max_range_m: 1.50
    ultrasonic_measurement_delay_ms: [210, 105]
    ultrasonic_stale_warn_sec: 2.0
