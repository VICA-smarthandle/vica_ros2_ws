# Smart Handle 사용자 안내 파라미터
#
# [중요] 최상위 키는 launch의 Node(name=...)와 정확히 일치해야 한다.
# 다르면 파라미터가 조용히 무시되고 전부 기본값으로 동작한다.

turn_guide_node:
  ros__parameters:
    odom_topic: /odom

    # 회전 판정 임계값. 2026-07-29 실주행(방2·화장실·안내소 순회)으로 25도를
    # 확정했다. 실제 회전 8회가 전부 25.0~26.6°에서 걸렸고, v=0.26 m/s 40초 연속
    # 직진 구간에서 오탐이 0회였다. 정지 상태 창 누적은 0.060°다
    # (진단: yaw_drift_check). 실내 90도 코너 기준으로 45도는 반응이 늦다.
    #
    # 2026-08-02: 사용자 지시로 25 -> 20도. 안내를 더 일찍 내보낸다.
    #
    #   진입 시점    30°/s로 도는 자극 기준 0.83 -> 0.67초 (0.16초 빨라진다)
    #   직진 오탐    정지 시 창 누적 0.060°에 대해 여유 417배 -> 333배. 여전히 넓다
    #   놓치는 회전  실제 회전 8회의 최솟값이 25.0°였으므로 늘지 않는다
    #
    # [미검증] 히스테리시스 폭이 15도에서 10도로 좁아진다(exit는 10.0 유지).
    # 코너에서 경로가 진동하면(2026-08-01 NavFn 지그재그) 안내가 켜졌다 꺼졌다
    # 할 수 있다. 그러면 exit를 8도로 내리거나 min_duration_sec을 올린다.
    window_sec: 1.5
    enter_threshold_deg: 20.0 #좌우회전각도
    exit_threshold_deg: 10.0     # hysteresis. enter보다 작아야 채터링이 없다
    min_duration_sec: 0.6        # 짧은 자세 보정을 회전으로 오판하지 않게 한다

    odom_timeout_sec: 0.5        # 초과 시 source_stale=True, 누적 폐기
    publish_rate_hz: 20.0
    cue_valid_sec: 2.0           # valid_until 표시용 (판정에는 쓰지 않는다)

    # ── 레일 예고 (2026-09-28) ─────────────────────────────────────────────
    # Route Server 레일(/rail_plan)에서 45° 이상 꺾이는 코너를 몸이 돌기 약 2초 전에
    # 미리 알린다. 위의 yaw 사후 판정(20°)은 그대로 돈다 — 레일 밖(장애물 회피·
    # 목적지 2 m 안)의 변화는 지금처럼 돈 뒤에 알린다(사용자 결정 B안).
    # 핸들·펌웨어는 바뀌지 않는다. 예고도 같은 코드 1/2(왼쪽/오른쪽)로 나가고, 예고한
    # 회전을 실제로 돌면 신호가 끊기지 않고 이어진다.
    #
    # 되돌리기: enable_rail_forecast 를 false 로. 레일 구독·TF 조회를 아예 안 만들어
    # 이 변경 전과 완전히 같다.
    #
    # 09-02 에 롤백한 /plan 예고와 다른 점: /plan 은 매초 새로 계산돼 예고 방향이
    # 57~73 % 어긋났다. 레일은 고정 그래프라 같은 목적지면 같은 선이다.
    # 오프라인 계산(scripts/vica_rail_turn_offline.py, 모든 목적지 쌍, 0.4 m/s):
    #   0903_d  예고 10 전부 실제 회전으로 이어짐 · 반대 방향 0 · 같은 회전 두 번 0
    #   0630    예고 33 · 반대 방향 0 · 같은 회전 두 번 0 (지금 방식은 10)
    # [미검증] 실주행 0회. 장애물·사람 상황은 계산에 없다.
    enable_rail_forecast: true
    rail_topic: /rail_plan       # route_server 의 plan 을 launch 에서 이 이름으로 옮겼다
    rail_timeout_sec: 2.5        # BT 가 1 Hz 로 보낸다. 끊기면 새 예고만 멈춘다
    map_frame: map
    base_frame: base_footprint

    rail_corner_threshold_deg: 45.0   # 사용자 결정. 0903_d 복도 ±18° 지그재그는 빠진다
    rail_lead_time_sec: 2.0           # 사용자 결정. '몸이 돌기 시작하기' 전 시간
    rail_max_offtrack_m: 0.8          # BT NearRailGate 와 같은 값 — 이 밖은 레일 모드가 아니다
    rail_handoff_m: 2.0               # BT handoff_dist_to_goal — 목적지 2 m 안 코너는 예고 안 함
    rail_merge_gap_m: 1.2             # 같은 방향 꺾임이 이 안에 이어지면 한 코너(두 번 알림 방지)
    rail_goal_change_m: 0.5           # 레일 끝이 이만큼 옮겨지면 새 목적지로 보고 기억을 비운다

    # 컨트롤러가 코너를 얼마나 일찍 돌기 시작하나 = 조준거리 clamp(v x time, min, max).
    # nav2_params.yaml FollowPath(VCC)의 lookahead_time·min/max_lookahead_dist 와 같은
    # 값이어야 한다. 빼면 "2초 전"이 실제로는 0.3초 전이 된다(오프라인 계산).
    controller_lookahead_time_sec: 2.5
    controller_lookahead_min_m: 0.6
    controller_lookahead_max_m: 1.2

user_guidance_driver_node:
  ros__parameters:
    # udev 규칙(udev/99-vica-smart-handle.rules)이 부여하는 고정 이름이다.
    # /dev/ttyUSB* 번호는 USB 재열거 순서에 따라 바뀌므로 직접 쓰지 않는다.
    # 규칙 미설치 장비에서는 FAULT_PORT_OPEN이 된다 — README의 udev 절을 따른다.
    serial_port: /dev/vica_smart_handle
    baudrate: 115200             # 펌웨어 Serial.begin(115200)과 반드시 일치

    send_rate_hz: 10.0           # 펌웨어 워치독 1500ms 대비 15배 여유
    diag_rate_hz: 2.0            # 진단은 전송보다 느리게 (대역폭 절약)

    # write_timeout이 없으면 USB 버퍼가 찰 때 write()가 블로킹되어
    # 단일 스레드 executor에서 노드 전체가 멈춘다. 전송 주기의 절반으로 둔다.
    write_timeout_sec: 0.05

    cue_timeout_sec: 1.0
    estop_timeout_sec: 1.0

    # true면 /estop_state가 끊겨도 ESTOP으로 다룬다(fail-safe).
    # emergency_stop_node 없이 개발할 때만 false로 둔다.
    estop_required: true

    reconnect_interval_sec: 2.0

    # 펌웨어 도착 애니메이션이 스스로 복귀할 때까지 3.5초가 걸린다.
    #   ARRIVE_BLINK_MS(500) x (2 x ARRIVE_BLINK_COUNT(3) + 마지막 소등 1) = 3500ms
    # 3.0으로 두면 마지막 프레임이 잘려 "2.5회 점멸"로 보인다(2026-07-28 프레임 추적).
    # 10Hz 전송 양자화와 클록 드리프트 마진 0.5초를 더한 값이다.
    # 펌웨어 상수를 바꾸면 이 값도 함께 바꾼다 — test_protocol.py가 관계를 고정한다.
    arrival_hold_sec: 4.0

    enable_serial: true

    # ── 초음파 (DYP-A22 IIC x8, 2026-08-31 2개 → 2026-09-23 8개) ────────────
    # 설계 정본: docs/handoff_jetson_ultrasonic_i2c.md §6.4, 8채널 확장은
    # devlog/2026-09-23-초음파-8채널.md. 같은 포트의 상향 20B 프레임(AA 57, 약 2.4Hz)을
    # 읽어 sensor_msgs/Range 로 채널마다 발행한다. 펌웨어가 호환용으로 같이 보내는
    # 옛 8B 프레임(AA 55)은 이 판의 파서가 무시한다.
    ultrasonic_enabled: true
    ultrasonic_rate_hz: 20.0     # (남겨둔 값 — 실제 읽기 주기는 uplink_rate_hz 다)

    # ── 상향 공통 (2026-09-04) ──────────────────────────────────────────
    # 시리얼은 한 스트림이라 초음파와 터치가 각자 read 하면 서로 바이트를 뺏는다.
    # 읽기는 uplink_loop 한 곳에서만 하고 두 누적기에 같은 바이트를 먹인다.
    uplink_rate_hz: 20.0

    # ── 터치센서 (D11, 2026-09-05) ──────────────────────────────────────
    # active-low 센서(idle HIGH / 터치 LOW). 극성과 '터치 중 튐'은 펌웨어가
    # 시간 브리지(200ms)로 정리해 프레임 bit0 로 올린다. 이 노드는 그 비트만 믿는다.
    #
    # **판정은 여기서 하지 않는다.** 모드 진입 3초와 손 놓음 0.5초는
    # mission_manager 몫이다(2단계). 이 노드는 "그 순간 잡고 있나"까지만 말한다.
    #
    # false 로 두면 uplink_fresh=false·user_contact=false 로 "터치 기능 없음"을
    # 알린다. 09-04 에는 false 로 뒀을 때 노드가 죽는 결함이 있었다 — 지금은
    # 어느 값이든 살아 있는지 시험이 고정한다.
    #
    # 2026-09-05 false 로 확정(사용자): 실기에서 D11 이 한 번도 LOW 가 안 됐다
    # (원시 관찰 2,400 프레임 중 0). 노드·펌웨어는 무죄, 센서 부품·배선 쪽이다.
    # true 로 두면 "센서는 살아 있는데 손이 없다"로 보여 2단계가 헷갈린다.
    # 정식 터치 모듈(VCC·GND·OUT)을 D11 에 달고 ~/touch_monitor.py 로 LOW 가
    # 보이면 이 한 줄만 true 로 되돌린다. 펌웨어·노드 코드는 그대로다.
    touch_enabled: false

    # 상향 신선도 시한. 이 시간 안에 터치 프레임이 안 오면 uplink_fresh=false 이고
    # user_contact 는 강제로 false 가 된다 — 죽은 센서가 "잡고 있다"고 말하면 안 된다.
    # 초음파 stale(2.0)과 따로 둔다. 20Hz 면 0.5초에 프레임 10개다.
    touch_stale_sec: 0.5

    # 터치가 바뀐 순간 진단을 한 번 더 발행하는 최소 간격. 주기 발행 2Hz 만으로는
    # 0.5초 판정에 샘플이 1개뿐이라 즉시 발행을 더하는데, 손을 빠르게 두드리면
    # system_monitor 의 handle_state 프로브(max_hz 4.0)를 넘길 수 있다. 100ms 면
    # 상위 지연은 충분히 작고 프로브 상한도 안 넘는다.
    touch_publish_min_interval_sec: 0.1
    # 채널 순서 = 자리 번호 순 (2026-09-22 10cm 장애물 실측, 펌웨어 US_ADDR7 과 동일):
    #   1 왼쪽 바퀴 옆 0x68 · 2 앞 왼쪽 0x69 · 3 앞 오른쪽 0x6A · 4 오른쪽 바퀴 옆 0x6B
    #   5 오른쪽 뒷바퀴 옆 0x6F · 6 후방 오른쪽 0x6E · 7 후방 왼쪽 0x6D · 8 왼쪽 뒷바퀴 옆 0x6C
    # 토픽 이름은 nav2_params.yaml 의 range_sensor_* 레이어와 짝이다.
    ultrasonic_topics:
      - /ultrasonic/left_wheel
      - /ultrasonic/front_left
      - /ultrasonic/front_right
      - /ultrasonic/right_wheel
      - /ultrasonic/right_rear_wheel
      - /ultrasonic/rear_right
      - /ultrasonic/rear_left
      - /ultrasonic/left_rear_wheel
    # URDF 링크 이름과 반드시 일치해야 한다. 다르면 TF 를 못 찾아 costmap 이 버린다.
    # (vica_description/urdf/VICA.xacro 초음파 절)
    ultrasonic_frame_ids:
      - usonic_left_wheel
      - usonic_front_left
      - usonic_front_right
      - usonic_right_wheel
      - usonic_right_rear_wheel
      - usonic_rear_right
      - usonic_rear_left
      - usonic_left_rear_wheel
    # 2026-08-31 실험(사용자 요청): 레벨 1(30도)/0.30m -> 레벨 4(60도)/0.80m.
    # 계산상 60도 수평 장착은 바닥 에코가 0.13~0.16m 부터지만, 이 바닥(매끈한
    # 재질)이 정반사로 에코를 안 돌려주는 것이 실측돼 시험한다. 빈 전방에서
    # 유령이 생기면 0.524/0.30 으로 되돌린다. 펌웨어 US_ANGLE_LEVEL 과 일치 필수.
    #
    # 0.50 -> 0.80 (같은 날 2차): usonic_drive02 bag 실측 — 첫 감지 0.28m 에서
    # 정지명령까지 0.5초로 반응은 정상이나, max_vel 0.5 의 제동거리 0.32m 보다
    # 짧아 물리적으로 못 멈추고 충돌했다. 제동(0.32)+반응(~0.25) < 0.8 성립.
    # 속도 인하는 사용자가 보류(0.5 유지).
    # 실주행 이력(2026-08-31): 60도+1.5m 과잉 봉쇄(6차) / 60도+1.1m 회피 짧음(7차)
    # / 40도+1.5m 양립 통과(8차).
    # 2026-09-01: 50도+1.5m 시험(9차) 통과 후 "과잉 봉쇄 체감"으로 40도에
    # 잠시 복귀했으나, 봉쇄 원인이 초음파가 아니라 라이다에 잡힌 바닥 모니터
    # 선으로 판명(사용자 확인)되어 50도로 재확정. 봉쇄 증상이 또 보이면
    # 각도를 의심하기 전에 라이다가 보는 실물(선·틈)부터 확인할 것.
    #
    # ── 2026-09-02 마킹 폭 축소 실험 (⚠️ 의도된 불일치) ──────────────────
    # 펌웨어 물리 빔은 레벨 3(50도, US_ANGLE_LEVEL 0x03) 그대로 두고, 이 값만
    # 0.873 -> 0.524 로 줄인다. 이 값은 "듣는 각"이 아니라 costmap 이 "그리는
    # 호의 폭"이다(RangeSensorLayer 가 메시지 fov 로 호를 계산). 근거:
    #  - bag usonic_stutter01: 주춤 13건 중 92%가 초음파 마크 상관
    #  - bag usonic_corner01 렌더링: 실물 실루엣 너머로 초음파 호가 살을 붙여
    #    코너 10cm 틈을 지도에서 닫음(복불복 통과의 원인)
    #  - inflate_cone 은 소스 확인 결과 원뿔 밖 자투리 판정용이라 효과 없음
    # 효과: 1.5m 마킹 호 폭 1.31 -> 0.79m. 감지력(청취·감속 반응)은 물리 빔이
    # 결정하므로 불변. 대가: 빔 가장자리(±15~25도) 물체의 마크가 중앙 쪽으로
    # 어긋남 — 회피 위치 정밀도 일부 양보. 되돌리기: 0.873 한 줄.
    #
    # [2026-09-02 A/B 확정] 같은 검출 잣대(기저 대비 40%+ 급락)로
    #   마킹 50°: 부분 감속 1.6건/분  ->  마킹 30°: 0.2건/분 (8분의 1)
    # 평균 주행 속도 동일(0.40->0.39). costmap 스냅샷에서 마크가 실물 실루엣에
    # 밀착(부풀림 소멸), 0.29m 실물 정상 감지·감속 확인. 사용자 체감 "주행 중
    # 멈춤 좋아짐" — 확정. (bag: usonic_stutter01 vs usonic_fovnarrow02)
    ultrasonic_fov_rad: 0.524    # 마킹 폭 30도 (물리 빔은 50도 유지) — A/B 확정
    # [2026-09-24] 채널별 칠하는 폭(순서 = ultrasonic_topics). 0 이하 = 위 공통값.
    # 바퀴 옆 두 개(1번 왼쪽·4번 오른쪽)만 60°(1.047) — 펌웨어 US_ANGLE_LEVEL_CH 로 물리 빔도
    # 레벨 4(60°)로 넓혔고, 사용자 결정으로 칠하는 폭도 맞췄다. 정지 시험 근거는 펌웨어 주석.
    # 되돌리기: 전부 -1.0 (펌웨어 US_ANGLE_LEVEL_CH 도 3 으로).
    ultrasonic_fov_rad_per_channel: [1.047, -1.0, -1.0, 1.047, -1.0, -1.0, -1.0, -1.0]
    ultrasonic_min_range_m: 0.02
    ultrasonic_max_range_m: 1.50
    # 라운드 발사라 채널별 측정 시점이 다르다. 8채널 프레임은 라운드 D 를 읽은 직후
    # 나가고, 각 채널은 자기 라운드의 트리거 시각(GAP 5 + WAIT 100 = 105ms 단위)만큼
    # 과거다: A(앞 왼쪽·후방 오른쪽) 420 / B(앞 오른쪽·후방 왼쪽) 315 /
    # C(바퀴 옆 둘) 210 / D(뒷바퀴 옆 둘) 105. 순서는 위 채널 순서와 같다.
    # 트리거 명령을 바꾸면(0xBC->다른 것) 펌웨어 US_WAIT_MS 와 함께 바꾼다.
    ultrasonic_measurement_delay_ms: [210, 420, 315, 210, 105, 420, 315, 105]
    ultrasonic_stale_warn_sec: 2.0
