# external_diagnostics_node가 감시할 대상 목록.
#
# 이 노드는 우리가 고칠 수 없는 대상을 대신해 /diagnostics를 발행한다. rplidar_ros,
# D455는 외부 패키지라 fork하지 않으면 진단을 낼 수 없다.
#
# [2026-08-31] nvblox 감시를 뺐다. Nav2는 더 이상 nvblox를 쓰지 않는다 —
# nav2_params.yaml의 global·local plugins 목록 어디에도 nvblox_layer가 없다.
# 카메라는 점군(PointCloud2)을 2D 스캔으로 눌러 local_costmap에 넣는 경로로만
# 쓴다. 쓰지도 않는 것을 감시하면 앱에 '카메라 인식 저하'가 상시로 떠서, 정작
# 봐야 할 결함을 사람이 무시하게 된다.
#
# [중요] 최상위 키는 launch의 Node(name=...)와 정확히 일치해야 한다.
# 다르면 파라미터가 조용히 무시되고 전부 기본값으로 동작한다.
#
# 구조: ROS 2 파라미터는 중첩 리스트를 담을 수 없으므로 이름 목록 + dotted namespace를
# 쓴다. diagnostic_aggregator의 analyzers 설정과 같은 방식이다.
#
# [실측 반영 2026-08-01] Jetson 실기 1차 측정으로 아래 값을 확정했다.
# 근거는 devlog/2026-07-31-health-monitor-implementation.md 14절이다.
#
# 측정 조건: 로봇 스택 40노드 기동, **바퀴를 띄운 정지 상태**, 주행 명령 없음.
# `[정지 실측]` 표기가 그 뜻이다.
#
# `/wheel/odom`만 별도로 **주행 중에도 쟀다**(바퀴 회전 확인 완료, 0.26 m/s 명령).
# 나머지 항목의 주행 중 값은 아직 `[미측정]`이다.
#
# 임계값을 코드에 하드코딩하지 않고 여기 두는 이유는 그대로다
# (guideline/vica_system_health_monitoring_draft.md 19절).
#   - /imu/base_link가 현재 200 Hz다. 60 Hz로 낮추는 안이 남아 있다
#   - voxel_layer.publish_voxel_map을 끄면 /local_costmap/voxel_grid 토픽이 소멸한다
#   - behavior_plugins에서 backup을 빼면 /backup action이 소멸한다
#   - imu adapter CPU 45 %를 정적 TF 캐시로 낮추는 작업이 남아 있다
# 최적화가 끝나면 그 항목의 임계를 다시 조인다. 그러지 않으면 회귀를 못 잡는다.
#
# 실측 절차: `ros2 topic info -v <topic>`로 QoS를, 자체 rclpy 스크립트로 주기를 잰다.
# **`ros2 topic hz`는 이 장비에서 쓰지 않는다** — 스스로 종료하지 않아 timeout으로
# 죽이게 되고, /dev/shm에 fastrtps 고아 세그먼트가 쌓여 DDS 디스커버리가 막힌다.

external_diagnostics_node:
  ros__parameters:
    # 진단 발행 주기. diagnostic_updater 기본값과 같게 둔다.
    diagnostic_period_sec: 1.0

    # process_cpu 프로브가 /proc을 훑는 주기. 매 tick 전체 /proc을 읽지 않는다.
    process_scan_period_sec: 5.0

    # -----------------------------------------------------------------------
    # topic_rate 프로브 — 토픽이 기대 주기로 오는지 본다
    # -----------------------------------------------------------------------
    #
    # qos 값:
    #   sensor_data : BEST_EFFORT + KEEP_LAST(5). 센서 드라이버 기본값
    #   default     : RELIABLE + KEEP_LAST(10). 일반 토픽
    #
    # [중요] QoS를 잘못 고르면 구독이 매칭되지 않아 메시지를 하나도 받지 못하고,
    # 감시 도구가 스스로 "센서가 죽었다"고 영구 오탐한다.
    # 어댑터는 "구독자는 붙었는데 메시지 0건" 상태를 진단 문구에 구분해 남긴다.
    #
    # [실측 2026-08-01] 여섯 토픽의 발행 QoS가 **전부 RELIABLE + VOLATILE**이었다.
    # rplidar_ros와 카메라도 그렇다 — "센서 드라이버는 BEST_EFFORT"라는 통념과 다르다.
    #
    # 그래도 아래 sensor_data(BEST_EFFORT) 설정을 그대로 둔다. DDS는 "요청 <= 제공"일 때
    # 매칭하므로 BEST_EFFORT 구독은 RELIABLE 발행자와도 붙는다. 반대 조합만 비호환이다.
    # 즉 sensor_data가 **더 안전한 쪽**이며, 발행자가 나중에 BEST_EFFORT로 바뀌어도
    # 구독이 끊기지 않는다.
    topic_probe_names:
      - lidar_scan
      - depth_scan
      - camera_depth
      - camera_color
      - odom
      - wheel_odom
      - handle_state
      - handle_uplink
      - app_bridge

    # [정지 실측 2026-08-01] 11.81 / 11.92 Hz. 720점, 유효 81 %, 0.38~7.46 m.
    # 드라이버가 보고하는 값은 10 Hz인데 실측이 그보다 높다(Express 모드).
    # 기존 max_hz 12.0은 실측과 0.1 Hz 차이라 언제든 넘길 수 있어 15.0으로 올린다.
    lidar_scan:
      component: lidar
      topic: /scan
      msg_type: sensor_msgs/msg/LaserScan
      qos: sensor_data
      min_hz: 7.0
      max_hz: 15.0
      fault_code: LIDAR_SCAN_STALE
      optional: false

    # ===== 카메라 인식 (2026-08-31, nvblox_slice 를 대신한다) =====
    #
    # 카메라가 costmap 까지 가는 길은 두 칸이다.
    #
    #   /camera/camera/depth/color/points   (PointCloud2, D455)
    #        -> depth_band_to_scan (pointcloud_to_laserscan, 0.30~1.05 m 띠)
    #   /camera/depth_scan                  (LaserScan)
    #        -> local_costmap 의 observation_sources: scan depth_scan
    #
    # **점군 토픽은 구독하지 않는다.** 640x480 XYZRGB 를 30 Hz 로 복사하면
    # 감시 노드가 초당 수백 MB 를 먹는 대역폭 소비자가 된다. camera_depth 가
    # 보는 camera_info 가 같은 주기로 나오면서 수백 바이트라 그것으로 충분하다.
    #
    # 그래서 두 칸을 이렇게 가른다.
    #   camera_depth(camera_info) 끊김 -> 카메라(또는 컨테이너)가 죽었다
    #   depth_scan 만 끊김             -> 변환 노드가 죽었다. 카메라는 멀쩡하다
    # 한 칸만 보면 이 둘이 같은 얼굴로 보인다.
    depth_scan:
      component: perception
      # LaserScan 이다. 빔 173개라 camera_info 와 비슷한 크기이며 점군이 아니다.
      topic: /camera/depth_scan
      msg_type: sensor_msgs/msg/LaserScan
      qos: sensor_data
      # [미검증] 변환 노드는 들어온 점군 한 장마다 스캔 한 장을 낸다. 즉 실효
      # 주기는 카메라 점군 주기와 같다. nav2_map_test.launch.py 의 scan_time
      # 0.0667 은 메시지 필드값이지 발행 주기가 아니다. 아래는 "끊김을 잡는"
      # 넓은 범위이며, 실측 뒤 다른 프로브처럼 조인다:
      #   ros2 topic hz /camera/depth_scan
      min_hz: 3.0
      max_hz: 40.0
      fault_code: DEPTH_SCAN_STALE
      # 카메라가 없으면 이 프로브만 건너뛴다. 어댑터는 계속 동작한다.
      optional: true

    # [정지 실측 2026-08-01] depth 30.01 / 30.24 Hz, color 28.28 / 29.31 Hz.
    # 둘 다 640x480이다. 기존 범위(10~35)가 실측을 충분히 감싸므로 그대로 둔다.
    camera_depth:
      component: perception
      # image가 아니라 camera_info를 본다. 같은 주기로 나오지만 수백 바이트다.
      # 30 Hz depth 원본을 복사하면 감시 노드가 대역폭 소비자가 된다.
      topic: /camera/camera/depth/camera_info
      msg_type: sensor_msgs/msg/CameraInfo
      qos: sensor_data
      min_hz: 10.0
      max_hz: 35.0
      fault_code: CAMERA_DEPTH_STALE
      optional: true

    camera_color:
      component: perception
      topic: /camera/camera/color/camera_info
      msg_type: sensor_msgs/msg/CameraInfo
      qos: sensor_data
      min_hz: 10.0
      max_hz: 35.0
      fault_code: CAMERA_COLOR_STALE
      optional: true

    # EKF 실효 주기. 리뷰 7.1·7.4절이 요구하는 baseline 계측 항목이다.
    #
    # [정지 실측 2026-08-01] **30.00 / 30.01 Hz. ekf.yaml의 frequency: 30 그대로다.**
    # "EKF가 30 Hz에 미달한다"는 종전 서술은 근거가 확인되지 않았다. 최적화 대상이
    # 아니다(devlog 14.6). 아래 범위는 실측을 그대로 감싼다.
    odom:
      component: localization
      topic: /odom
      msg_type: nav_msgs/msg/Odometry
      qos: default
      min_hz: 20.0
      max_hz: 35.0
      fault_code: LOCALIZATION_ODOM_STALE
      optional: false

    # 미발행 감지. encoder_feedback이 죽으면 조용히 아무것도 안 나온다.
    #
    # [정지·주행 실측 2026-08-01] **바퀴 회전과 무관하게 9.45 Hz에 고정된다.**
    # 기존 min_hz 20.0으로는 항상 오탐이었다.
    #
    #   정지        9.45 Hz   (바퀴 정지)
    #   일정 속도    9.45 Hz   (바퀴 0.368 m/s)
    #   변동 속도    9.46 Hz   (바퀴 0.534 m/s)
    #   CAN TX      14.9 Hz(정지) -> 128.0 Hz(주행)   8.6배 늘어도 주기는 그대로다
    #
    # **9.45 Hz는 결함이 아니라 드라이버의 실제 보고 속도다.** CAN을 직접 읽어 확인했다.
    #
    #   MDROBOT 드라이버는 C5 응답을 **약 105 ms마다 2~4프레임씩 뭉쳐서** 보낸다.
    #   버스트 자체가 9.50 Hz다. 버스트 안 프레임은 0.1 ms 간격이며 **같은 축의 값이
    #   100 % 동일하다**(68건 전부 동일, 다른 것 0건). 0.1 ms면 바퀴가 0.026 mm도 움직이지
    #   않으므로 애초에 다를 수 없다.
    #
    # `encoder_feedback`은 tick당 1회만 발행하므로 버스트의 중복 프레임 37 %를 버린다.
    # **그 37 %는 정보 손실이 아니다.**
    #
    # `request_hz`를 5~60으로 훑어 최적값을 확인했다. 발행률은 15부터 평평하고 지연만
    # `주기/2`로 줄어든다. 0.26 m/s 기준 20 Hz는 0.69 cm, 40 Hz는 0.33 cm 오래된 값이다.
    # **20.0은 무릎점(15) 위에 여유가 있고 지연도 충분히 짧다. 바꿀 이유가 없다.**
    #
    # 따라서 기존 min_hz 20.0은 드라이버가 낼 수 없는 값이었다. 5.0은 실측 9.45의
    # 절반쯤이라 "정말 끊겼다"만 잡는다. max_hz 40.0은 드라이버 교체 등에 대비한 여유다.
    wheel_odom:
      component: localization
      topic: /wheel/odom
      msg_type: nav_msgs/msg/Odometry
      qos: default
      min_hz: 5.0
      max_hz: 40.0
      fault_code: LOCALIZATION_WHEEL_ODOM_STALE
      optional: false

    # ===== 스마트 핸들 + 초음파 (2026-09-02) =====
    #
    # **아두이노 하나에 둘이 같이 물려 있다.** 핸들 안내(서보·LED)와 초음파 거리
    # 센서가 같은 시리얼 링크를 쓴다(smart_handle_firmware.ino). 그래서 링크가
    # 끊기면 두 기능이 함께 멈추고, 문구도 둘을 함께 적는다.
    #
    # 종전에는 이 부품이 `observable: false`(관측 불가)였다. 근거는
    # "아두이노 -> 젯슨 상향 통신이 없다" 였는데 **2026-08-31 초음파 연동으로
    # 상향이 생겼다.** 이제 아두이노가 실제로 답하는지 볼 수 있다.
    #
    # 두 칸으로 가르는 이유는 카메라(camera_depth / depth_scan)와 같다.
    #   handle_state 만 끊김   -> 드라이버 노드가 죽었다
    #   handle_uplink 만 끊김  -> 노드는 살아 있고 아두이노가 답을 안 한다
    # 한 칸만 보면 이 둘이 같은 얼굴로 보인다.
    #
    # **둘 다 주행을 막지 않는다.** 핸들이 없어도 로봇은 달린다 — 잃는 것은
    # 방향 안내와 초음파 거리 감지다. 그래서 등급이 DEGRADED 다
    # (required_components.yaml 의 guidance severity).

    # [정지 실측 2026-09-02] 1.974 Hz. diag_rate_hz 기본값 2.0 과 맞는다.
    # 이 토픽은 시리얼이 끊겨도 나온다 — 노드 생존만 뜻한다.
    handle_state:
      component: guidance
      topic: /vica/smart_handle_state
      msg_type: vica_interfaces/msg/SmartHandleState
      qos: default
      min_hz: 1.0
      max_hz: 4.0
      fault_code: GUIDANCE_NODE_SILENT
      optional: true

    # [정지 실측 2026-09-02] 4.675 Hz. 펌웨어 상향 프레임 4.8 Hz 와 맞는다.
    # **이것만이 아두이노가 실제로 살아 있다는 증거다.** 위 handle_state 는
    # 노드가 혼자 찍어내는 값이라 링크가 끊겨도 계속 나온다.
    #
    # front_right 만 본다. front_left 는 2026-09-02 실측에서 25초간 한 건도
    # 오지 않았다(오른쪽은 정상) — 센서·주소 설정 쪽 문제로 보인다. 고치기
    # 전에 프로브를 걸면 상시 경고가 되어, 사람이 결함 표시 자체를 무시하게
    # 된다. 왼쪽이 살아나면 같은 모양으로 한 칸 더 넣는다.
    handle_uplink:
      component: guidance
      topic: /ultrasonic/front_right
      msg_type: sensor_msgs/msg/Range
      qos: sensor_data
      min_hz: 2.0
      max_hz: 8.0
      fault_code: GUIDANCE_UPLINK_STALE
      optional: true

    # ===== 관리자 앱 브리지 (2026-09-02) =====
    #
    # [정지 실측 2026-09-02] 2.005 Hz. vica_status_app_node 가 상시 발행한다.
    #
    # **rosbridge 와 다른 프로세스다.** rosbridge 가 살아 앱이 붙어 있는데 이
    # 노드만 멈추면, 화면은 멀쩡해 보이면서 로봇 정보만 굳는다. 그 상황을
    # 알려줄 방법이 지금까지 없었다.
    #
    # 등급 WARN — 로봇 동작과 무관하다. 이 결함이 보인다는 것 자체가 앱이
    # 연결돼 있다는 뜻이고, 로봇은 정상 주행 중일 수 있다.
    app_bridge:
      component: app
      topic: /robot_status
      msg_type: std_msgs/msg/String
      qos: default
      min_hz: 1.0
      max_hz: 4.0
      fault_code: APP_BRIDGE_SILENT
      optional: true

    # -----------------------------------------------------------------------
    # process_cpu 프로브 — /proc/<pid>/stat 기반 노드별 CPU %
    # -----------------------------------------------------------------------
    #
    # 목적은 최적화 전 baseline 기록이다(리뷰 7.1절).
    #
    # [정지 실측 2026-08-01] 어댑터 보고값이며 `top` 독립 측정과 1 %p 안쪽으로 맞는다.
    #
    #   imu_adapter        43.6 %   <- 최적화 대상. 이것이 유일한 before다
    #   ekf_node           11.0 %
    #   motor_node         10.4 %
    #   controller_server   9.4 %   <- **Nav2 미활성 상태의 값이다**
    #   nvblox_node        25.9 %   (Docker)
    #   realsense2_camera  37.4 %   (Docker)
    #
    # [중요] warn_percent를 baseline보다 한참 위에 두면 개선 후에도 통과해 회귀를 잡지
    # 못한다. baseline이 확인된 항목은 그 값의 1.2~1.5배로 조인다.
    #
    # **단, 부하 상태를 재지 못한 항목은 조이지 않는다.** controller_server는 Nav2가
    # 활성이 아닐 때 잰 값이라 주행 중 값을 모른다. 지금 조이면 첫 주행에서 오탐이 난다.
    #
    # [해결됨] Docker 가시성 — 호스트 /proc에서 **보인다.** PID 네임스페이스는 계층
    # 구조라 호스트가 컨테이너 프로세스를 본다. 그래서 nvblox·D455 프로브를 추가했다.
    # 컨테이너가 안 떠 있으면 "미구성"으로 표시되고 결함이 아니다.
    #
    # 등급은 WARN 상한이다 — CPU 사용률로 주행을 막지 않는다.
    process_probe_names:
      - imu_adapter
      - ekf_node
      - controller_server
      - motor_node
      - realsense_node
      - voice_wakeword
      - voice_tts
      - voice_llm

    # ===== 음성 (2026-09-02) — **노드 실행 여부만 본다** =====
    #
    # required: true 는 "프로세스가 없으면 결함"이라는 뜻이다. 다른 프로세스
    # 프로브(Docker 등)는 없는 것이 정상일 수 있어 기본값 false 다.
    #
    # **왜 프로세스로 보는가.** 음성 토픽은 사람이 말을 걸 때만 나온다
    # (/vica/intent·/vica/tts_request). 주기 신호가 없어 topic_rate 로는 볼 수
    # 없다. 프로세스 생존은 /proc 으로 볼 수 있는 유일한 것이다.
    #
    # **이것으로 알 수 없는 것 — 중요하다.** 노드가 멀쩡히 떠서 CPU 를 쓰고
    # 있어도 마이크에서 소리가 안 들어올 수 있다(USB 헐거움·다른 앱이 장치
    # 선점·음소거). 그 상태에서 "멈춰"를 외쳐도 로봇은 못 듣는다. 오디오는
    # ROS 토픽이 아니라 콜백 안으로 직행하므로 **밖에서는 원리적으로 볼 수
    # 없다**(vica_architecture.md 13.3절, P1 과제).
    #
    # 그래서 문구(VOICE_NODE_SILENT)와 앱 표시에 "실행만 확인"을 명시한다.
    # 마이크 입력 카운터가 음성 노드에 들어오면 그때 진짜 관측으로 올린다
    # (사용자 판정 2026-09-02 — LLM 파트 수정이 끝난 뒤).
    #
    # warn_percent 는 CPU 경고용이며 이 프로브의 본뜻이 아니다. 실측 baseline 이
    # 없어 넉넉히 둔다 `[미검증]`.
    voice_wakeword:
      component: voice
      cmdline_pattern: src.ros_wakeword_node
      required: true
      warn_percent: 90.0

    voice_tts:
      component: voice
      cmdline_pattern: src.ros_tts_node
      required: true
      warn_percent: 90.0

    # LLM 목적지 해석. 모듈 이름이 src.ros_node 라 패턴이 짧다 — 다른 파이썬
    # 프로세스와 겹치지 않는지 후보 수를 함께 본다(어댑터가 2개 이상이면 경고).
    voice_llm:
      component: voice
      cmdline_pattern: src.ros_node
      required: true
      warn_percent: 90.0

    # baseline 43.6 %. 정적 TF 캐시 최적화가 끝나면 이 값을 다시 조인다.
    imu_adapter:
      component: localization
      cmdline_pattern: imu_base_link_adapter
      warn_percent: 55.0

    # baseline 11.0 % (관측 범위 10.4~13.3).
    ekf_node:
      component: localization
      cmdline_pattern: ekf_node
      warn_percent: 20.0

    # [미측정] 9.4 %는 Nav2 미활성 값이다. 주행 중 값을 잰 뒤 조인다.
    controller_server:
      component: navigation
      cmdline_pattern: controller_server
      warn_percent: 90.0

    # baseline 10.4 % (관측 범위 10.4~11.4). 정지·주행 모두 CAN 주기가 지배적이다.
    motor_node:
      component: motor
      cmdline_pattern: mdrobot_can_keyboard_knob_node
      warn_percent: 25.0

    # [2026-08-31] nvblox_node CPU 프로브를 뺐다. Nav2 가 nvblox 를 쓰지 않으므로
    # 그 프로세스는 이제 떠 있지 않는 것이 정상이다. baseline 25.9 % 와 GPU 경합
    # 조사(devlog/2026-07-30-gpu-nvblox-stt-contention.md)는 그 문서에 남아 있다.

    # [신규 2026-08-01] Docker 프로세스. baseline 37.4 %.
    realsense_node:
      component: perception
      cmdline_pattern: realsense2_camera_node
      warn_percent: 60.0
