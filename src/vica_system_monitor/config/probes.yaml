# external_diagnostics_node가 감시할 대상 목록.
#
# 이 노드는 우리가 고칠 수 없는 대상을 대신해 /diagnostics를 발행한다. rplidar_ros,
# nvblox(Docker), D455는 외부 패키지라 fork하지 않으면 진단을 낼 수 없다.
#
# [중요] 최상위 키는 launch의 Node(name=...)와 정확히 일치해야 한다.
# 다르면 파라미터가 조용히 무시되고 전부 기본값으로 동작한다.
#
# 구조: ROS 2 파라미터는 중첩 리스트를 담을 수 없으므로 이름 목록 + dotted namespace를
# 쓴다. diagnostic_aggregator의 analyzers 설정과 같은 방식이다.
#
# [실측 반영 2026-08-01] Jetson 실기 1차 측정으로 아래 값을 확정했다.
# 근거는 devlog/2026-07-31-health-monitor-implementation.md 14절이다.
#
# 측정 조건: 로봇 스택 40노드 기동, **바퀴를 띄운 정지 상태**, 주행 명령 없음.
# 주행 중 값은 아직 재지 않았다. 아래 각 항목의 `[정지 실측]` 표기가 그 뜻이다.
#
# 임계값을 코드에 하드코딩하지 않고 여기 두는 이유는 그대로다
# (guideline/vica_system_health_monitoring_draft.md 19절).
#   - /imu/base_link가 현재 200 Hz다. 60 Hz로 낮추는 안이 남아 있다
#   - voxel_layer.publish_voxel_map을 끄면 /local_costmap/voxel_grid 토픽이 소멸한다
#   - behavior_plugins에서 backup을 빼면 /backup action이 소멸한다
#   - imu adapter CPU 45 %를 정적 TF 캐시로 낮추는 작업이 남아 있다
# 최적화가 끝나면 그 항목의 임계를 다시 조인다. 그러지 않으면 회귀를 못 잡는다.
#
# 실측 절차: `ros2 topic info -v <topic>`로 QoS를, 자체 rclpy 스크립트로 주기를 잰다.
# **`ros2 topic hz`는 이 장비에서 쓰지 않는다** — 스스로 종료하지 않아 timeout으로
# 죽이게 되고, /dev/shm에 fastrtps 고아 세그먼트가 쌓여 DDS 디스커버리가 막힌다.

external_diagnostics_node:
  ros__parameters:
    # 진단 발행 주기. diagnostic_updater 기본값과 같게 둔다.
    diagnostic_period_sec: 1.0

    # process_cpu 프로브가 /proc을 훑는 주기. 매 tick 전체 /proc을 읽지 않는다.
    process_scan_period_sec: 5.0

    # -----------------------------------------------------------------------
    # topic_rate 프로브 — 토픽이 기대 주기로 오는지 본다
    # -----------------------------------------------------------------------
    #
    # qos 값:
    #   sensor_data : BEST_EFFORT + KEEP_LAST(5). 센서 드라이버 기본값
    #   default     : RELIABLE + KEEP_LAST(10). 일반 토픽
    #
    # [중요] QoS를 잘못 고르면 구독이 매칭되지 않아 메시지를 하나도 받지 못하고,
    # 감시 도구가 스스로 "센서가 죽었다"고 영구 오탐한다.
    # 어댑터는 "구독자는 붙었는데 메시지 0건" 상태를 진단 문구에 구분해 남긴다.
    #
    # [실측 2026-08-01] 여섯 토픽의 발행 QoS가 **전부 RELIABLE + VOLATILE**이었다.
    # rplidar_ros와 카메라도 그렇다 — "센서 드라이버는 BEST_EFFORT"라는 통념과 다르다.
    #
    # 그래도 아래 sensor_data(BEST_EFFORT) 설정을 그대로 둔다. DDS는 "요청 <= 제공"일 때
    # 매칭하므로 BEST_EFFORT 구독은 RELIABLE 발행자와도 붙는다. 반대 조합만 비호환이다.
    # 즉 sensor_data가 **더 안전한 쪽**이며, 발행자가 나중에 BEST_EFFORT로 바뀌어도
    # 구독이 끊기지 않는다.
    topic_probe_names:
      - lidar_scan
      - nvblox_slice
      - camera_depth
      - camera_color
      - odom
      - wheel_odom

    # [정지 실측 2026-08-01] 11.81 / 11.92 Hz. 720점, 유효 81 %, 0.38~7.46 m.
    # 드라이버가 보고하는 값은 10 Hz인데 실측이 그보다 높다(Express 모드).
    # 기존 max_hz 12.0은 실측과 0.1 Hz 차이라 언제든 넘길 수 있어 15.0으로 올린다.
    lidar_scan:
      component: lidar
      topic: /scan
      msg_type: sensor_msgs/msg/LaserScan
      qos: sensor_data
      min_hz: 7.0
      max_hz: 15.0
      fault_code: LIDAR_SCAN_STALE
      optional: false

    nvblox_slice:
      component: perception
      topic: /nvblox_node/static_map_slice
      msg_type: nvblox_msgs/msg/DistanceMapSlice
      qos: default
      # 정상 ~9 Hz 기대(docs/vica_robot_bringup_manual.md).
      # nvblox_base.yaml의 update_esdf_rate_hz가 10.0이다.
      # [정지 실측 2026-08-01] 9.38 / 9.51 Hz. 기대와 일치하므로 범위를 그대로 둔다.
      min_hz: 3.0
      max_hz: 12.0
      fault_code: NVBLOX_SLICE_STALE
      # nvblox_msgs가 없으면 이 프로브만 건너뛴다. 어댑터는 계속 동작한다.
      optional: true

    # [정지 실측 2026-08-01] depth 30.01 / 30.24 Hz, color 28.28 / 29.31 Hz.
    # 둘 다 640x480이다. 기존 범위(10~35)가 실측을 충분히 감싸므로 그대로 둔다.
    camera_depth:
      component: perception
      # image가 아니라 camera_info를 본다. 같은 주기로 나오지만 수백 바이트다.
      # 30 Hz depth 원본을 복사하면 감시 노드가 대역폭 소비자가 된다.
      topic: /camera/camera/depth/camera_info
      msg_type: sensor_msgs/msg/CameraInfo
      qos: sensor_data
      min_hz: 10.0
      max_hz: 35.0
      fault_code: CAMERA_DEPTH_STALE
      optional: true

    camera_color:
      component: perception
      topic: /camera/camera/color/camera_info
      msg_type: sensor_msgs/msg/CameraInfo
      qos: sensor_data
      min_hz: 10.0
      max_hz: 35.0
      fault_code: CAMERA_COLOR_STALE
      optional: true

    # EKF 실효 주기. 리뷰 7.1·7.4절이 요구하는 baseline 계측 항목이다.
    #
    # [정지 실측 2026-08-01] **30.00 / 30.01 Hz. ekf.yaml의 frequency: 30 그대로다.**
    # "EKF가 30 Hz에 미달한다"는 종전 서술은 근거가 확인되지 않았다. 최적화 대상이
    # 아니다(devlog 14.6). 아래 범위는 실측을 그대로 감싼다.
    odom:
      component: localization
      topic: /odom
      msg_type: nav_msgs/msg/Odometry
      qos: default
      min_hz: 20.0
      max_hz: 35.0
      fault_code: LOCALIZATION_ODOM_STALE
      optional: false

    # 미발행 감지. encoder_feedback이 죽으면 조용히 아무것도 안 나온다.
    #
    # [정지 실측 2026-08-01] 9.43 / 9.53 Hz. **기존 min_hz 20.0으로는 영구 오탐이었다.**
    #
    # 20.0의 근거는 encoder.yaml의 `request_hz: 20.0`이었으나 그 값은 바로 위의
    # `request_position_feedback: false` 때문에 **적용되지 않는다**(벤치 전용 옵션).
    #
    # 실제 주기는 모터 노드가 C5 피드백을 얼마나 자주 요청하느냐가 정한다. 그 노드는
    # 30 Hz 루프마다 보내지 않고 **RPM이 바뀌었을 때 또는 resend_interval_sec(0.05)**에만
    # 보낸다. 정지 중에는 RPM이 계속 0이라 재전송 경로만 남는다. 실측 CAN TX 14.9 Hz가
    # 이 계산과 맞는다.
    #
    # 따라서 정지가 정상 운영의 하한이며 그 아래로 임계를 둔다. 5.0은 실측 9.5의 절반쯤이라
    # "정말 끊겼다"만 잡는다.
    #
    # [미측정] 주행 중에는 RPM이 계속 바뀌어 30 Hz 루프마다 전송될 것으로 보인다.
    # 그때 값을 재고 max_hz를 다시 본다. 지금 40.0은 30 Hz 루프 상한에 여유를 둔 값이다.
    wheel_odom:
      component: localization
      topic: /wheel/odom
      msg_type: nav_msgs/msg/Odometry
      qos: default
      min_hz: 5.0
      max_hz: 40.0
      fault_code: LOCALIZATION_WHEEL_ODOM_STALE
      optional: false

    # -----------------------------------------------------------------------
    # process_cpu 프로브 — /proc/<pid>/stat 기반 노드별 CPU %
    # -----------------------------------------------------------------------
    #
    # 목적은 최적화 전 baseline 기록이다(리뷰 7.1절).
    #
    # [정지 실측 2026-08-01] 어댑터 보고값이며 `top` 독립 측정과 1 %p 안쪽으로 맞는다.
    #
    #   imu_adapter        43.6 %   <- 최적화 대상. 이것이 유일한 before다
    #   ekf_node           11.0 %
    #   motor_node         10.4 %
    #   controller_server   9.4 %   <- **Nav2 미활성 상태의 값이다**
    #   nvblox_node        25.9 %   (Docker)
    #   realsense2_camera  37.4 %   (Docker)
    #
    # [중요] warn_percent를 baseline보다 한참 위에 두면 개선 후에도 통과해 회귀를 잡지
    # 못한다. baseline이 확인된 항목은 그 값의 1.2~1.5배로 조인다.
    #
    # **단, 부하 상태를 재지 못한 항목은 조이지 않는다.** controller_server는 Nav2가
    # 활성이 아닐 때 잰 값이라 주행 중 값을 모른다. 지금 조이면 첫 주행에서 오탐이 난다.
    #
    # [해결됨] Docker 가시성 — 호스트 /proc에서 **보인다.** PID 네임스페이스는 계층
    # 구조라 호스트가 컨테이너 프로세스를 본다. 그래서 nvblox·D455 프로브를 추가했다.
    # 컨테이너가 안 떠 있으면 "미구성"으로 표시되고 결함이 아니다.
    #
    # 등급은 WARN 상한이다 — CPU 사용률로 주행을 막지 않는다.
    process_probe_names:
      - imu_adapter
      - ekf_node
      - controller_server
      - motor_node
      - nvblox_node
      - realsense_node

    # baseline 43.6 %. 정적 TF 캐시 최적화가 끝나면 이 값을 다시 조인다.
    imu_adapter:
      component: localization
      cmdline_pattern: imu_base_link_adapter
      warn_percent: 55.0

    # baseline 11.0 % (관측 범위 10.4~13.3).
    ekf_node:
      component: localization
      cmdline_pattern: ekf_node
      warn_percent: 20.0

    # [미측정] 9.4 %는 Nav2 미활성 값이다. 주행 중 값을 잰 뒤 조인다.
    controller_server:
      component: navigation
      cmdline_pattern: controller_server
      warn_percent: 90.0

    # baseline 10.4 % (관측 범위 10.4~11.4). 정지·주행 모두 CAN 주기가 지배적이다.
    motor_node:
      component: motor
      cmdline_pattern: mdrobot_can_keyboard_knob_node
      warn_percent: 25.0

    # [신규 2026-08-01] Docker 프로세스. baseline 25.9 %.
    # GPU 경합 조사(2026-07-30-gpu-nvblox-stt-contention.md)와 함께 볼 수 있게 둔다.
    nvblox_node:
      component: perception
      cmdline_pattern: nvblox_node
      warn_percent: 50.0

    # [신규 2026-08-01] Docker 프로세스. baseline 37.4 %.
    realsense_node:
      component: perception
      cmdline_pattern: realsense2_camera_node
      warn_percent: 60.0
