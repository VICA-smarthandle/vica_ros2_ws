ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: false
    publish_acceleration: false

    odom0: /odom
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, true,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false

    odom1: /visual_slam/tracking/odometry
    odom1_config: [
      true,  true,  false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom1_differential: false
    odom1_relative: true 
